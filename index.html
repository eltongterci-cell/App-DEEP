function escapeHtml(t) {
  return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderAniversariantesHome() {
  const aniversariantes = getAniversariantesDoMes();
  if (aniversariantes.length === 0) return '';

  const hoje = new Date();
  const diaHoje = hoje.getDate();
  const mesHoje = hoje.getMonth() + 1;
  const nomeMes = hoje.toLocaleDateString('pt-BR', { month: 'long' });

  const itens = aniversariantes.map(a => {
    const [, mes, dia] = a.data_nascimento.split('-');
    const diaNum = parseInt(dia);
    const ehHoje = diaNum === diaHoje && parseInt(mes) === mesHoje;
    const jaPassou = diaNum < diaHoje && parseInt(mes) === mesHoje;
    const diasFaltam = diasParaAniversario(a.data_nascimento);
    const ehDaSemana = diasFaltam >= 0 && diasFaltam <= 7;
    const primeiroNome = escapeHtml(a.nome.split(' ')[0]);
    const inicial = escapeHtml((a.nome.trim()[0] || '?').toUpperCase());
    let cls = 'aniv-mini';
    if (ehHoje) cls += ' aniv-mini-hoje';
    else if (ehDaSemana) cls += ' aniv-mini-semana';
    else if (jaPassou) cls += ' aniv-mini-passou';
    const foto = a.foto
      ? `<img src="${a.foto}" alt="${primeiroNome}" loading="lazy">`
      : `<span>${inicial}</span>`;
    const selo = ehHoje ? '🎉' : (ehDaSemana ? '⭐' : '');
    return `
      <button class="${cls}" data-action="ver-aniv-detalhe" data-id="${a.id}" aria-label="Aniversário de ${primeiroNome}, dia ${diaNum}">
        <span class="aniv-mini-foto">${foto}${selo ? `<i class="aniv-mini-selo">${selo}</i>` : ''}</span>
        <span class="aniv-mini-nome">${primeiroNome}</span>
        <span class="aniv-mini-dia">${ehHoje ? 'Hoje!' : 'dia ' + diaNum}</span>
      </button>`;
  }).join('');

  return `
    <div class="section">
      <div class="section-header" style="margin-bottom:10px;">
        <div class="section-label">🎂 Aniversariantes</div>
        <h3 class="section-title">Niver de ${nomeMes}</h3>
      </div>
      <div class="aniv-faixa">${itens}</div>
    </div>
  `;
}

function renderEventoCard(evento) {
  const dt = new Date(evento.data + 'T00:00:00');
  const dia = dt.getDate();
  const mesAbr = dt.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '');
  const diaSem = dt.toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '');
  const dias = diasParaData(evento.data);
  
  let badge = '';
  if (dias === 0) badge = '<span class="tag tag-primary">HOJE</span>';
  else if (dias === 1) badge = '<span class="tag tag-primary">AMANHÃ</span>';
  else if (dias > 0 && dias <= 7) badge = `<span class="tag">EM ${dias} DIAS</span>`;
  
  // Inscrições
  const cfg = getConfigDoEvento(evento.id);
  const inscritos = getInscricoesDoEvento(evento.id);
  const temInscricao = !!cfg.inscricoesAbertas;
  const temPix = (cfg.pixChave && cfg.pixChave.trim() !== '') || (cfg.pixLink && cfg.pixLink.trim() !== '') || (cfg.pixQrCode && cfg.pixQrCode !== '');
  
  const blocoInscricao = temInscricao ? `
    <div style="margin-top:14px;padding-top:14px;border-top:1px dashed var(--border, rgba(255,255,255,.1));">
      <div style="font-size:12px;font-weight:600;color:var(--primary);letter-spacing: 0;margin-bottom:9px;text-align:center;opacity:.85;">
        INSCRIÇÕES ABERTAS
      </div>
      <div style="background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:12px;padding:10px 16px;text-align:center;font-weight:600;font-size:14px;letter-spacing: 0;box-shadow:0 2px 8px rgba(253,127,33,.22);">
        Quero participar →
      </div>
    </div>
  ` : '';
  
  // Quando há inscrições, o card inteiro abre a inscrição + pagamento
  const abreInscricao = temInscricao
    ? ` data-action="abrir-inscricao" data-id="${evento.id}" style="cursor:pointer;"`
    : '';
  
  // Capa do evento: foto se tiver (no evento ou na config), ou emoji como reserva
  const capa = evento.capa || cfg.capa || '';
  
  // VARIANTE FEED (estilo Instagram) — só quando tem capa
  if (capa) {
    return `
      <div class="evento-card feed${temInscricao ? ' clickable' : ''}"${abreInscricao}>
        <div class="evento-capa-grande" style="background-image:url('${capa}');"></div>
        <div class="evento-feed-body">
          <div class="evento-titulo" style="margin-bottom:8px;">${evento.titulo} ${badge}</div>

      <div class="evento-icone">${evento.icone || '🎉'}</div>

// PASSO 3: Escolher horário (com restrição dia de semana)
function renderPasso3Horario() {
  const agendamentos = DB.get('agendamentos', []) || [];
  const horariosTravados = DB.get('horariosTravados', {}) || {};
  const liderEscolhido = State.formData.com_quem;
  
  // Horários permitidos para essa data (semana = só após 19h)
  const horariosDisponiveis = getHorariosDisponiveisPorData(State.dataEscolhida);
  const isDiaSemana = ehDiaSemana(State.dataEscolhida);
  
  // Travados por líder
  const travadosEltinho = horariosTravados[`eltinho_${State.dataEscolhida}`] || [];
  const travadosDayana = horariosTravados[`dayana_${State.dataEscolhida}`] || [];
  const travadosGerais = horariosTravados[State.dataEscolhida] || [];
  
  const horarioDisponivel = (h) => {
    if (horarioJaPassouHoje(State.dataEscolhida, h)) return false; // já passou hoje
    const ags = agendamentos.filter(a => 
      a.data_agendada === State.dataEscolhida && 
      a.hora_agendada === h && 
      a.status !== 'cancelado'
    );
    
    if (liderEscolhido === 'eltinho') {
      const ocupado = ags.some(a => a.com_quem === 'eltinho' || a.com_quem === 'os_dois');
      const travado = travadosEltinho.includes(h) || travadosGerais.includes(h);
      return !ocupado && !travado;
    }
    if (liderEscolhido === 'dayana') {
      const ocupado = ags.some(a => a.com_quem === 'dayana' || a.com_quem === 'os_dois');
      const travado = travadosDayana.includes(h) || travadosGerais.includes(h);
      return !ocupado && !travado;
    }
    if (liderEscolhido === 'os_dois') {
      const eltOc = ags.some(a => a.com_quem === 'eltinho' || a.com_quem === 'os_dois');
      const dayOc = ags.some(a => a.com_quem === 'dayana' || a.com_quem === 'os_dois');
      const eltT = travadosEltinho.includes(h) || travadosGerais.includes(h);
      const dayT = travadosDayana.includes(h) || travadosGerais.includes(h);
      return !eltOc && !dayOc && !eltT && !dayT;
    }
    return false;
  };
  
  const nomeLider = {
    'eltinho': 'Eltinho',
    'dayana': 'Day',
    'os_dois': 'Eltinho e Day'
  }[liderEscolhido];

  return `
    <div class="form-box anim-fade-up">
      <div class="form-header">
        <h3>Escolha o horário</h3>
        <p class="form-subtitle">Conversa com <strong style="color: var(--primary);">${nomeLider}</strong> em <strong>${formatDateFull(State.dataEscolhida)}</strong></p>
      </div>
      
      ${isDiaSemana ? `
        <div style="background: var(--info-bg); border: 1px solid rgba(59, 130, 246, 0.3); border-radius: var(--radius-md); padding: 12px 16px; margin-bottom: 20px; font-size: 14px; color: #93C5FD;">
          ℹ️ Em dias de semana, atendimentos são realizados apenas <strong>após às 19h</strong>.
        </div>
      ` : ''}
      
      <div class="horarios-grid">
        ${horariosDisponiveis.map(h => {
          const disponivel = horarioDisponivel(h);
          const isSel = State.horarioEscolhido === h;
          let cls = 'horario';
          if (isSel && disponivel) cls += ' selected';
          return `<button class="${cls}" data-action="select-horario" data-horario="${h}" ${!disponivel ? 'disabled' : ''}>
            <span class="horario-time">${h}</span>
            <span class="horario-status ${disponivel ? 'ok' : 'no'}">${disponivel ? 'Disponível' : 'Indisponível'}</span>
          </button>`;
        }).join('')}
      </div>

      <div class="form-actions">
        <button class="btn btn-secondary w-full" data-action="passo-back">Voltar</button>
        <button class="btn btn-primary w-full" data-action="passo-next" ${!State.horarioEscolhido ? 'disabled' : ''}>Avançar →</button>
      </div>
    </div>
  `;
}

function renderDaysCalendario(date, adminMode = false) {
  const datasFechadas = DB.get('datasFechadas', []) || [];
  const agendamentos = DB.get('agendamentos', []) || [];
  const horariosTravados = DB.get('horariosTravados', {}) || {};
  const eventos = DB.get('eventos', []) || [];
  
  const y = date.getFullYear();
  const m = date.getMonth();
  const first = new Date(y, m, 1).getDay();
  const last = new Date(y, m + 1, 0).getDate();
  let html = '';

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const liderEscolhido = State.formData.com_quem;
  const liderLogado = State.adminNome.toLowerCase();

  for (let i = 0; i < first; i++) html += '<div class="calendar-day empty"></div>';
  
  for (let d = 1; d <= last; d++) {
    const ds = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    const isClosed = datasFechadas.includes(ds);
    const isSel = adminMode ? (State.dataSelecionadaAdmin === ds) : (State.dataEscolhida === ds);
    const dayDate = new Date(ds + 'T00:00:00');
    const isPast = dayDate < today;
    const isToday = dayDate.getTime() === today.getTime();
    
    const eventosNoDia = eventos.filter(e => e.data === ds);
    const temEvento = eventosNoDia.length > 0;
    
    // Agendamentos no dia (filtrados por líder se admin)
    const agsNoDia = adminMode 
      ? agendamentos.filter(a => 
          a.data_agendada === ds && a.status !== 'cancelado' && a.status !== 'concluido' &&
          (a.com_quem === liderLogado || a.com_quem === 'os_dois')
        )
      : [];
    const qtdAgendamentos = agsNoDia.length;
    
    // Verifica se tem horários disponíveis para o cliente
    let indisponivel = false;
    if (!adminMode && !isClosed && !isPast && liderEscolhido) {
      const horariosData = getHorariosDisponiveisPorData(ds);
      const travadosEl = horariosTravados[`eltinho_${ds}`] || [];
      const travadosDy = horariosTravados[`dayana_${ds}`] || [];
      const travGer = horariosTravados[ds] || [];
      
      const disponivel = horariosData.some(h => {
        const ags = agendamentos.filter(a => 
          a.data_agendada === ds && a.hora_agendada === h && a.status !== 'cancelado'
        );
        if (liderEscolhido === 'eltinho') {
          return !ags.some(a => a.com_quem === 'eltinho' || a.com_quem === 'os_dois') &&
                 !travadosEl.includes(h) && !travGer.includes(h);
        }
        if (liderEscolhido === 'dayana') {
          return !ags.some(a => a.com_quem === 'dayana' || a.com_quem === 'os_dois') &&
                 !travadosDy.includes(h) && !travGer.includes(h);
        }
        if (liderEscolhido === 'os_dois') {
          const eltOc = ags.some(a => a.com_quem === 'eltinho' || a.com_quem === 'os_dois');
          const dayOc = ags.some(a => a.com_quem === 'dayana' || a.com_quem === 'os_dois');
          return !eltOc && !dayOc && 
                 !travadosEl.includes(h) && !travadosDy.includes(h) && !travGer.includes(h);
        }
        return false;
      });
      indisponivel = !disponivel;
    }
    
    let cls = 'calendar-day';
    const isMultiSel = adminMode && State.modoSelecaoMultipla && State.datasSelecionadas.includes(ds);
    if (isMultiSel) cls += ' multi-selected';
    else if (isSel) cls += ' selected';
    else if (isClosed) cls += ' closed';
    else if (indisponivel) cls += ' indisponivel';
    else if (isToday) cls += ' today';
    if (temEvento && !isSel && !isMultiSel) cls += ' com-evento';
    if (qtdAgendamentos > 0 && !isSel && !isMultiSel) cls += ' com-agendamento';
    if (!adminMode && isPast && !isSel) cls += ' disabled';
    
    const disabled = (!adminMode && (isPast || isClosed || indisponivel));
    // No modo múltiplo, a ação é marcar/desmarcar; senão, seleciona normalmente
    let action;
    if (adminMode && State.modoSelecaoMultipla) action = 'toggle-data-multipla';
    else action = adminMode ? 'admin-select-date' : 'select-data';
    
    // Badge de agendamentos (admin)
    const badgeAgendamentos = adminMode && qtdAgendamentos > 0 
      ? `<span class="day-badge-ags">${qtdAgendamentos}</span>` 
      : '';
    
    // Ícone do evento
    const iconeEvento = temEvento 
      ? `<span class="day-evento-icon">${eventosNoDia[0].icone}</span>` 
      : '';
    
    // Marca de check no modo múltiplo
    const checkMulti = isMultiSel ? '<span class="day-check-multi">✓</span>' : '';
    
    html += `
      <button class="${cls}" data-action="${action}" data-date="${ds}" ${disabled && !adminMode ? 'disabled' : ''}>
        <span class="day-numero">${d}</span>
        ${iconeEvento}
        ${badgeAgendamentos}
        ${checkMulti}
      </button>
    `;
  }

  for (let i = 0; i < (42 - first - last); i++) html += '<div class="calendar-day empty"></div>';
  return html;
}

// ADICIONAR À AGENDA DO CELULAR (.ics + Google)
// ============================================
function _calDados(ag) {
  const nomesLider = { eltinho: 'Eltinho', dayana: 'Day', os_dois: 'Eltinho e Day' };
  const lider = nomesLider[ag.com_quem] || 'a liderança';
  const inicio = new Date(ag.data_agendada + 'T' + ag.hora_agendada + ':00');
  const fim = new Date(inicio.getTime() + 60 * 60 * 1000); // 1 hora
  const local = ag.tipo_atendimento === 'online'
    ? 'Online (link enviado no WhatsApp)'
    : 'Presencial — local combinado com a liderança';
  const titulo = `Conversa DEEP com ${lider}`;
  const descricao = 'Aconselhamento pastoral DEEP — um tempo para ouvir, orar e cuidar. 🙏';
  return { inicio, fim, local, titulo, descricao };
}

// Formata uma data como horário local pra calendário: AAAAMMDDTHHMMSS
function _fmtCal(d) {
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + 'T' +
         p(d.getHours()) + p(d.getMinutes()) + '00';
}

function linkGoogleAgenda(ag) {
  if (!ag) return '#';
  const c = _calDados(ag);
  const datas = _fmtCal(c.inicio) + '/' + _fmtCal(c.fim);
  const params = new URLSearchParams({
    action: 'TEMPLATE',
    text: c.titulo,
    dates: datas,
    details: c.descricao,
    location: c.local,
    ctz: 'America/Sao_Paulo'
  });
  return 'https://calendar.google.com/calendar/render?' + params.toString();
}

function gerarICS(ag) {
  const c = _calDados(ag);
  const agora = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
  const uid = 'deep-' + (ag.id || Date.now()) + '@deep.app';
  // Escapa caracteres especiais do formato ICS
  const esc = t => String(t).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
  return [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//DEEP//Aconselhamento//PT-BR',
    'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    'UID:' + uid,
    'DTSTAMP:' + agora,
    'DTSTART:' + _fmtCal(c.inicio),
    'DTEND:' + _fmtCal(c.fim),
    'SUMMARY:' + esc(c.titulo),
    'DESCRIPTION:' + esc(c.descricao),
    'LOCATION:' + esc(c.local),
    'BEGIN:VALARM',
    'TRIGGER:-PT1H',
    'ACTION:DISPLAY',
    'DESCRIPTION:' + esc('Sua conversa DEEP é em 1 hora 🙏'),
    'END:VALARM',
    'END:VEVENT',
    'END:VCALENDAR'
  ].join('\r\n');
}

function baixarICS(ag) {
  if (!ag) return;
  try {
    const blob = new Blob([gerarICS(ag)], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'conversa-deep.ics';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    showToast('📅 Abrindo sua agenda...', 'success');
  } catch (err) {
    console.error('Erro ao gerar evento:', err);
    showToast('Não consegui abrir a agenda. Tente o Google Agenda.', 'error');
  }
}

function mediaPesq(lista, k) {
  const v = lista.map(r => r && r.notas && r.notas[k]).filter(n => typeof n === 'number');
  return { n: v.length, m: v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0 };
}
function contaOps(lista, k) {
  const c = {}; lista.forEach(r => { const v = r.ops && r.ops[k]; if (v) c[v] = (c[v] || 0) + 1; }); return c;
}
function contaChips(lista, k) {
  const c = {}; lista.forEach(r => (r.chips && r.chips[k] || []).forEach(x => { c[x] = (c[x] || 0) + 1; }));
  return Object.entries(c).sort((a, b) => b[1] - a[1]);
}
function renderTabPesquisa() {
  const lista = getPesquisaRetiro();
  const total = lista.length;
  const cor = m => m >= 4 ? '#3BC47A' : m >= 3 ? '#F2B233' : '#E5584A';
  const geral = mediaPesq(lista, 'geral');
  const pct = (k, v) => { const c = contaOps(lista, k); const t = Object.values(c).reduce((a, b) => a + b, 0); return t ? Math.round((c[v] || 0) / t * 100) + '%' : '–'; };
  const todasNotas = PESQ_ITENS.filter(i => i.tipo === 'nota' && i.k !== 'geral').map(i => ({ ...i, ...mediaPesq(lista, i.k) })).filter(x => x.n > 0).sort((a, b) => b.m - a.m);
  const textosItens = PESQ_ITENS.filter(i => i.tipo === 'texto');
  const palavras = contaChips(lista, 'palavras');
  const proximo = contaChips(lista, 'proximo');
  const ajudar = lista.filter(r => r.ops.ajudar === 'sim');
  const chip = ([t, n]) => `<span class="pesq-chip sel" style="cursor:default;">${t} · ${n}</span>`;
  return `
    <div class="section">
      <div class="section-header">
        <div class="section-label">📝 Pesquisa do retiro</div>
        <h3 class="section-title">${total === 0 ? 'Nenhuma resposta ainda' : total + ' resposta' + (total > 1 ? 's' : '')}</h3>
        <p class="section-subtitle">${PESQUISA_ATIVA ? 'Aberta para os jovens na tela inicial.' : 'Pesquisa encerrada.'}</p>
      </div>
      ${total === 0 ? '<div class="evento-empty">Quando os jovens responderem, o resultado aparece aqui.</div>' : `
      <div class="card" style="margin-bottom:12px;">
        <div class="pesq-kpis">
          <div><b>${geral.n ? geral.m.toFixed(1) : '–'}</b><span>nota geral (de 5)</span></div>
          <div><b>${pct('voltaria', 'sim')}</b><span>voltariam</span></div>
          <div><b>${pct('indicaria', 'sim')}</b><span>indicariam</span></div>
        </div>
      </div>
      ${palavras.length ? `<div class="card" style="margin-bottom:12px;"><div class="pesq-item-t" style="margin-bottom:10px;">O retiro foi…</div><div class="pesq-chips">${palavras.map(chip).join('')}</div></div>` : ''}
      ${PESQ_PASSOS.filter(x => x.itens.some(i => i.tipo === 'nota' && i.k !== 'geral')).map(passo => {
        const rows = passo.itens.filter(i => i.tipo === 'nota' && i.k !== 'geral').map(i => ({ ...i, ...mediaPesq(lista, i.k) })).filter(x => x.n > 0);
        if (!rows.length) return '';
        return `<div class="card" style="margin-bottom:12px;"><div class="pesq-item-t" style="margin-bottom:12px;">${passo.ico} ${passo.titulo}</div>
          ${rows.map(x => `<div class="pesq-barra"><span class="pb-n">${x.t}</span><span class="pb-t"><i style="width:${x.m / 5 * 100}%;background:${cor(x.m)}"></i></span><span class="pb-v">${x.m.toFixed(1)}</span></div>`).join('')}</div>`;
      }).join('')}
      ${todasNotas.length > 1 ? `<div class="card" style="margin-bottom:12px;"><p style="font-size:14px;line-height:1.7;color:var(--text-secondary);margin:0;">⭐ Mais bem avaliados: <strong>${todasNotas.slice(0, 3).map(x => x.t).join(', ')}</strong><br>🔧 Precisam de atenção: <strong>${todasNotas.slice(-3).reverse().map(x => x.t).join(', ')}</strong></p></div>` : ''}
      ${proximo.length ? `<div class="card" style="margin-bottom:12px;"><div class="pesq-item-t" style="margin-bottom:10px;">💡 Não pode faltar no próximo</div><div class="pesq-chips">${proximo.map(chip).join('')}</div></div>` : ''}
      ${textosItens.concat([{ k: 'nome' }]).filter(i => i.k !== 'nome').map(i => {
        const rs = lista.filter(r => r.textos[i.k]);
        if (!rs.length) return '';
        return `<div class="card" style="margin-bottom:12px;"><div class="pesq-item-t" style="margin-bottom:6px;">${i.t} (${rs.length})</div>
          ${rs.map(r => `<div class="pesq-resp"><div class="pesq-resp-q">${(r.anonimo || !r.textos.nome) ? '🕊️ Anônimo' : escapeHtml(r.textos.nome)}${i.k === 'testemunho' ? (r.flags.autoriza ? ' · ✅ autorizou compartilhar' : ' · 🔒 não autorizou') : ''}</div><p>${escapeHtml(r.textos[i.k])}</p></div>`).join('')}</div>`;
      }).join('')}
      ${ajudar.length ? `<div class="card" style="margin-bottom:12px;"><div class="pesq-item-t" style="margin-bottom:6px;">🙋 Querem ajudar no próximo (${ajudar.length})</div>
        ${ajudar.map(r => `<div class="pesq-resp"><strong>${escapeHtml(r.textos.nome || 'Sem nome')}</strong> ${r.textos.contato ? '· ' + escapeHtml(r.textos.contato) : ''}</div>`).join('')}</div>` : ''}
      <button class="btn btn-primary w-full" data-action="pesq-copiar">📋 Copiar resumo para o WhatsApp</button>`}
    </div>`;
}
function resumoPesquisaTexto() {
  const lista = getPesquisaRetiro();
  const g = mediaPesq(lista, 'geral');
  let t = `📝 Pesquisa do Retiro DEEP 2026\n${lista.length} respostas · nota geral ${g.n ? g.m.toFixed(1) : '–'}/5\n`;
  PESQ_PASSOS.forEach(passo => {
    const rows = passo.itens.filter(i => i.tipo === 'nota' && i.k !== 'geral').map(i => ({ ...i, ...mediaPesq(lista, i.k) })).filter(x => x.n);
    if (rows.length) t += `\n${passo.ico} ${passo.titulo}\n` + rows.map(x => `• ${x.t}: ${x.m.toFixed(1)}`).join('\n') + '\n';
  });
  const pr = contaChips(lista, 'proximo');
  if (pr.length) t += `\n💡 Não pode faltar: ` + pr.slice(0, 5).map(x => `${x[0]} (${x[1]})`).join(', ') + '\n';
  const ab = lista.filter(r => r.textos.melhorar);
  if (ab.length) t += `\n🔧 Para melhorar:\n` + ab.map(r => '• ' + r.textos.melhorar).join('\n') + '\n';
  const su = lista.filter(r => r.textos.sugestao);
  if (su.length) t += `\n💡 Sugestões:\n` + su.map(r => '• ' + r.textos.sugestao).join('\n');
  return t;
}

function renderAlertasProximos(agsHoje, proximos) {
  const alertas = [];
  
  // Adicionar HOJE primeiro
  agsHoje.forEach(a => {
    alertas.push({ ...a, dias: 0 });
  });
  
  // Depois próximos (excluindo os de hoje)
  proximos.forEach(a => {
    const dias = diasParaData(a.data_agendada);
    if (dias > 0) alertas.push({ ...a, dias });
  });
  
  if (alertas.length === 0) return '';
  
  return `
    <div class="section">
      <div class="section-header">
        <div class="section-label">🔔 Atenção</div>
        <h3 class="section-title">Agendamentos próximos</h3>

      </div>
      
      <div class="alerta-proximos">
        ${alertas.map(a => renderAlertaCard(a)).join('')}
      </div>
    </div>
  `;
}

  let cls = 'alerta-card clickable';
  let label = '';
  let numeroDisplay = a.dias;
  let numLabel = a.dias === 1 ? 'dia' : 'dias';
  
  if (a.dias === 0) {
    cls += ' hoje';

    numeroDisplay = '!';
    numLabel = 'hoje';
  } else if (a.dias === 1) {
    cls += ' amanha';
    label = 'AMANHÃ';
  } else if (a.dias <= 3) {
    cls += ' urgente';

  const comQuemLabel = { 'eltinho': 'Eltinho', 'dayana': 'Day', 'os_dois': 'Os dois' }[a.com_quem];
  
  return `

function renderSecaoEventos() {
  const eventos = DB.get('eventos', []) || [];
  const hoje = new Date().toISOString().split('T')[0];
  const eventosFuturos = eventos
    .filter(e => {
      if (!e.data) return false;
      // Normaliza a data pro formato YYYY-MM-DD (pega só os 10 primeiros caracteres)
      const dataEvento = String(e.data).substring(0, 10);
      return dataEvento >= hoje;
    })
    .sort((a, b) => String(a.data).localeCompare(String(b.data)));
  
  // Diagnóstico: quantos eventos no total (todos)
  const totalEventos = eventos.length;
  
  return `
    <div class="section">
      <div class="section-header" style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;">
        <div>
          <div class="section-label">🎉 Programação DEEP</div>
          <h3 class="section-title">Eventos</h3>
          <p class="section-subtitle">Crie eventos visíveis para todos os jovens</p>
        </div>
        <button class="btn btn-primary btn-sm" data-action="novo-evento">+ Novo evento</button>
      </div>
      
      ${totalEventos > 0 && eventosFuturos.length === 0 ? `
        <div class="info-card" style="margin-bottom: 16px; background: rgba(255,200,0,0.1); border-color: rgba(255,200,0,0.3);">
          <div class="info-card-icon">📅</div>
          <div>
            <div class="info-card-title">${totalEventos} evento(s) cadastrado(s), mas com data passada</div>
            <div class="info-card-text">Os eventos só aparecem se a data for de hoje em diante.</div>
          </div>
        </div>
      ` : ''}
      
      ${eventosFuturos.length > 0 ? `
        <div>
          ${eventosFuturos.map(e => {

function renderHistoricoJovem(ag) {
  if (!ag.telefone) return '';
  
  const todosAgs = DB.get('agendamentos', []) || [];
  const conversas = todosAgs.filter(a => 
    a.telefone === ag.telefone && 
    a.id !== ag.id &&
    a.status !== 'cancelado'
  ).sort((a, b) => b.data_agendada.localeCompare(a.data_agendada));
  
  if (conversas.length === 0) {
    return `
      <div class="detalhe-secao">
        <div class="detalhe-secao-label">📊 HISTÓRICO</div>
        <div class="historico-empty">
          ✨ <strong>Primeira conversa</strong> dessa pessoa!
        </div>
      </div>
    `;
  }
  
  const concluidas = conversas.filter(c => c.status === 'concluido').length;
  const pendentes = conversas.filter(c => c.status === 'remarcacao').length;
  
  return `
    <div class="detalhe-secao">
      <div class="detalhe-secao-label">📊 HISTÓRICO — ${conversas.length} conversa${conversas.length > 1 ? 's' : ''} anterior${conversas.length > 1 ? 'es' : ''}</div>
      
      <div class="historico-stats">
        <div class="hist-stat">
          <div class="hist-stat-numero">${conversas.length}</div>
          <div class="hist-stat-label">Total</div>
        </div>
        <div class="hist-stat success">
          <div class="hist-stat-numero">${concluidas}</div>
          <div class="hist-stat-label">Concluídas</div>
        </div>
        ${pendentes > 0 ? `
          <div class="hist-stat warning">
            <div class="hist-stat-numero">${pendentes}</div>
            <div class="hist-stat-label">Remarcações</div>
          </div>
        ` : ''}
      </div>
      
      <div class="historico-lista">
        ${conversas.slice(0, 5).map(c => {
          const comQ = { 'eltinho': 'Eltinho', 'dayana': 'Day', 'os_dois': 'Os dois' }[c.com_quem];
          const statusIcon = c.status === 'concluido' ? '✓' : (c.status === 'remarcacao' ? '🔄' : '⏰');
          return `
            <div class="historico-item" data-action="ver-detalhes-ag" data-id="${c.id}">
              <div class="hist-icon">${statusIcon}</div>
              <div class="hist-info">
                <div class="hist-data">${formatDateShort(c.data_agendada)} · ${c.hora_agendada}</div>
                <div class="hist-meta">${comQ} · ${c.motivo_gabinete || 'Sem motivo'}</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

function formatarDataHora(isoString) {
  const dt = new Date(isoString);
  const hoje = new Date();
  const diff = (hoje - dt) / (1000 * 60 * 60);
  
  if (diff < 1) return 'Agora há pouco';
  if (diff < 24) return `Há ${Math.floor(diff)}h`;
  if (diff < 24 * 7) return `Há ${Math.floor(diff / 24)} dia${Math.floor(diff / 24) > 1 ? 's' : ''}`;
  
  return dt.toLocaleDateString('pt-BR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

// 🛍️ DEEP STORE — telas do jovem (catálogo, produto, compra, meus pedidos)
// ============================================
function renderLoja() {
  const produtos = getLojaProdutos().filter(p => p.ativo !== false);
  return `
    <div class="loja-theme">
      <div style="position:relative;width:100%;overflow:hidden;line-height:0;">
        <img src="${LOJA_CAPA}" alt="DEEP STORE" style="width:100%;display:block;">
        <div style="position:absolute;inset:0;background:linear-gradient(180deg, rgba(5,43,51,.6) 0%, rgba(5,43,51,.05) 30%, rgba(5,43,51,.15) 55%, rgba(5,43,51,.92) 100%);"></div>
        <button data-action="back-home" aria-label="Voltar" style="position:absolute;top:16px;left:16px;width:38px;height:38px;border-radius:50%;background:rgba(5,43,51,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;">←</button>
        <button data-action="abrir-carrinho-loja" aria-label="Carrinho" style="position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;background:rgba(5,43,51,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;">
          🛒${lojaCarrinhoQtdTotal() > 0 ? `<span style="position:absolute;top:-4px;right:-4px;background:var(--primary);color:#fff;font-size:12px;font-weight:700;min-width:16px;height:16px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 3px;">${lojaCarrinhoQtdTotal()}</span>` : ''}
        </button>
        <div style="position:absolute;bottom:0;left:0;right:0;padding:16px 20px 20px;">
          <div style="font-size:14px;font-weight:700;letter-spacing: 0;color:#FF5F00;margin-bottom:6px;">DEEP STORE</div>
          <div style="font-size:14px;color:#fff;font-weight:700;line-height:1.4;">Vista sua fé. Viva Cristo.<br>O raso não satisfaz mais!</div>
        </div>
      </div>

      <div class="container" style="padding-top:20px;">
        <button class="btn btn-secondary w-full" data-action="abrir-meus-pedidos-loja" style="margin-bottom:20px;">📦 Meus pedidos</button>
        ${produtos.length === 0 ? `
          <div class="card" style="text-align:center;padding:32px 20px;color:var(--text-tertiary);">
            Nenhum produto disponível no momento. 🙏
          </div>
        ` : `
          <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px;">
            ${produtos.map(p => renderLojaProdutoCard(p)).join('')}
          </div>
        `}
      </div>
    </div>
  `;
}

function lojaEstaEsgotado(p) {
  return p.estoque !== null && p.estoque !== undefined && String(p.estoque).trim() !== '' && parseInt(p.estoque) <= 0;
}
// ⚡ "Estoque baixo" = tem 1 a 3 unidades — cria urgência sem exagerar
function lojaEstoqueBaixo(p) {
  if (lojaEstaEsgotado(p)) return false;
  if (p.estoque === null || p.estoque === undefined || String(p.estoque).trim() === '') return false;
  return parseInt(p.estoque) <= 3;
}

function renderLojaProdutoCard(p) {
  const esgotado = lojaEstaEsgotado(p);
  const estoqueBaixo = lojaEstoqueBaixo(p);
  return `
    <div class="loja-produto-card" ${esgotado ? '' : `data-action="abrir-produto-loja" data-id="${p.id}"`} style="cursor:${esgotado ? 'default' : 'pointer'};${esgotado ? 'opacity:.5;' : ''}">
      <div style="width:100%;aspect-ratio:1;background:var(--bg-3);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;">
        ${p.foto ? `<img src="${p.foto}" alt="${p.nome}" style="width:100%;height:100%;object-fit:cover;">` : `<span style="font-size:32px;">🛍️</span>`}
        ${esgotado ? `<div style="position:absolute;inset:0;background:rgba(5,43,51,.55);display:flex;align-items:center;justify-content:center;"><span style="font-size:12px;font-weight:700;letter-spacing: 0;color:#fff;background:#ef4444;padding:3px 10px;border-radius:999px;">ESGOTADO</span></div>` : ''}
        ${!esgotado && estoqueBaixo ? `<span style="position:absolute;top:6px;left:6px;font-size:12px;font-weight:700;letter-spacing: 0;color:#050505;background:#FF9433;padding:3px 8px;border-radius:999px;">SÓ ${p.estoque} UN.</span>` : ''}
      </div>
      <div style="padding:12px;">
        <div style="font-weight:600;font-size:12px;line-height:1.3;margin-bottom:6px;color:var(--text-secondary);min-height:32px;">${p.nome}</div>
        <div style="font-weight:700;color:var(--primary);font-size:16px;">${formatarMoeda(p.preco)}</div>
      </div>
    </div>
  `;
}

function lojaListaVariacoes(p) {
  return (p.variacoes || '').split(',').map(s => s.trim()).filter(Boolean);
}

// 🛒 CARRINHO — vive só em memória (State), some se recarregar a página.
// Cada item: { produtoId, nome, preco, foto, variacao, qtd }
function lojaAdicionarAoCarrinho(produto, variacao) {
  const carrinho = State.lojaCarrinho || [];
  const existente = carrinho.find(it => String(it.produtoId) === String(produto.id) && (it.variacao || '') === (variacao || ''));
  if (existente) {
    existente.qtd += 1;
  } else {
    carrinho.push({ produtoId: produto.id, nome: produto.nome, preco: produto.preco, foto: produto.foto || '', variacao: variacao || '', qtd: 1 });
  }
  State.lojaCarrinho = carrinho;
}
function lojaRemoverDoCarrinho(idx) {
  const carrinho = State.lojaCarrinho || [];
  carrinho.splice(idx, 1);
  State.lojaCarrinho = carrinho;
}
function lojaAlterarQtdCarrinho(idx, delta) {
  const carrinho = State.lojaCarrinho || [];
  if (!carrinho[idx]) return;
  carrinho[idx].qtd = Math.max(1, carrinho[idx].qtd + delta);
}
function lojaCarrinhoQtdTotal() {
  return (State.lojaCarrinho || []).reduce((s, it) => s + it.qtd, 0);
}
function lojaCarrinhoValorTotal() {
  return (State.lojaCarrinho || []).reduce((s, it) => s + it.preco * it.qtd, 0);
}
// Confere se, NA HORA de finalizar, cada item do carrinho ainda tem estoque
// suficiente (evita vender algo que esgotou enquanto a pessoa navegava)
function lojaCarrinhoTemProblemaDeEstoque() {
  const produtos = getLojaProdutos();
  return (State.lojaCarrinho || []).some(it => {
    const p = produtos.find(x => String(x.id) === String(it.produtoId));
    if (!p) return true; // produto removido da loja
    if (p.estoque === null || p.estoque === undefined || String(p.estoque).trim() === '') return false;
    return parseInt(p.estoque) < it.qtd;
  });
}

function renderModalLojaProdutoDetalhe() {
  const id = State.modalLojaProduto;
  const p = getLojaProdutos().find(x => String(x.id) === String(id));
  if (!p) { State.modalLojaProduto = null; return ''; }
  const esgotado = lojaEstaEsgotado(p);
  const estoqueBaixo = lojaEstoqueBaixo(p);
  const variacoes = lojaListaVariacoes(p);

        ${p.descricao ? `<p style="font-size:14px;color:var(--text-secondary);line-height:1.6;margin-bottom:18px;white-space:pre-wrap;">${p.descricao}</p>` : ''}
        ${esgotado ? `
          <div style="background:rgba(239,68,68,.1);color:#ef4444;font-weight:700;text-align:center;padding:12px;border-radius:12px;">Produto esgotado no momento</div>
        ` : `

              <div style="font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:8px;">Escolha o tamanho</div>

                  <button data-action="loja-escolher-variacao" data-value="${v.replace(/"/g,'&quot;')}" style="padding:9px 16px;border-radius:12px;border:1.5px solid ${variacaoEscolhida === v ? 'var(--primary)' : 'var(--border)'};background:${variacaoEscolhida === v ? 'var(--primary-soft)' : 'transparent'};color:${variacaoEscolhida === v ? 'var(--primary)' : 'var(--text-secondary)'};font-weight:700;font-size:14px;cursor:pointer;">${v}</button>

        `}
      </div>
    </div>
    </div>
  `;
}

        <div style="display:flex;justify-content:flex-end;margin-bottom:4px;">

function renderLojaPedidoCard(p) {
  const pct = lojaPercentualPago(p);
  const podeAddParcela = p.formaPagamento === 'pix' && lojaValorRestante(p) > 0 && !lojaTemParcelaPendente(p) && p.status !== 'cancelado';
  // Só deixa a pessoa cancelar sozinha se ainda não tiver nenhum valor aprovado nem parcela em análise
  // (se já pagou algo, ela fala com o líder pra resolver certinho)
  const podeCancelar = p.status !== 'cancelado' && p.status !== 'pago' && !lojaTemParcelaPendente(p) && (p.formaPagamento === 'cartao' || lojaValorPago(p) === 0);
  return `
    <div class="card" style="margin-bottom:12px;${p.status === 'cancelado' ? 'opacity:.55;' : ''}">
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px;">
        <div style="width:40px;height:40px;border-radius:8px;overflow:hidden;background:var(--bg-2);flex-shrink:0;">
          ${p.produtoFoto ? `<img src="${p.produtoFoto}" style="width:100%;height:100%;object-fit:cover;">` : ''}
        </div>
        <div style="flex:1;min-width:0;">
          <div style="font-weight:700;font-size:14px;">${p.produtoNome}</div>
          <div style="font-size:12px;color:var(--text-tertiary);">${formatarMoeda(p.precoProduto)}</div>
        </div>
      </div>
      ${p.formaPagamento === 'pix' && p.status !== 'cancelado' ? `
        <div style="background:var(--bg-1,rgba(255,255,255,.05));border-radius:999px;height:8px;overflow:hidden;margin-bottom:6px;">
          <div style="height:100%;background:var(--primary);width:${pct}%;transition:width .3s;"></div>
        </div>
      ` : ''}
      <div style="font-size:12px;font-weight:700;color:${p.status === 'cancelado' ? 'var(--text-tertiary)' : lojaValorRestante(p) <= 0 || p.status === 'pago' ? '#16a34a' : lojaTemParcelaPendente(p) ? '#f59e0b' : 'var(--text-tertiary)'};">${lojaStatusTexto(p)}</div>
      ${podeAddParcela ? `<button class="btn btn-primary btn-sm w-full" data-action="loja-add-parcela" data-id="${p.id}" style="margin-top:10px;">+ Pagar mais uma parcela</button>` : ''}
      ${podeCancelar ? `<button data-action="loja-cancelar-pedido-jovem" data-id="${p.id}" style="width:100%;background:none;border:none;color:#ef4444;font-size:12px;padding:8px 0 0;cursor:pointer;">Cancelar pedido</button>` : ''}
    </div>
  `;
}

function renderModalInscricao() {
  const eventoId = State.modalInscricao;
  const evento = (DB.get('eventos', []) || []).find(ev => String(ev.id) === String(eventoId));
  if (!evento) { State.modalInscricao = null; return ''; }
  const cfg = getConfigDoEvento(eventoId);
  const temPagamento = (cfg.pixChave && cfg.pixChave.trim() !== '')
    || (cfg.pixLink && cfg.pixLink.trim() !== '')
    || (cfg.pixValor && cfg.pixValor.trim() !== '');
  const compAtual = State.compTemp;
  const nomeAtual = (State.inscricaoNome || '').replace(/"/g, '&quot;');
  const telAtual = (State.inscricaoTel || '').replace(/"/g, '&quot;');

  // Etapas: só dados + pagamento (sem revisão redundante)
  const passos = temPagamento ? ['dados', 'pagamento'] : ['dados'];
  let passo = State.inscPasso || 'dados';
  // 'salvando' e 'sucesso' são passos especiais (não estão na barra de progresso)
  if (passo !== 'sucesso' && passo !== 'salvando' && passos.indexOf(passo) === -1) passo = 'dados';
  const idxPasso = passos.indexOf(passo);

  // Barrinha de progresso (estilo apps profissionais)
  const stepper = passo === 'sucesso' ? '' : `
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:18px;">
      ${passos.map((p, n) => `
        <div style="flex:1;height:5px;border-radius:999px;background:${n <= idxPasso ? 'var(--primary)' : 'var(--bg-1, rgba(255,255,255,.12))'};transition:background .3s;"></div>
      `).join('')}
    </div>
    <div style="font-size:12px;font-weight:700;color:var(--text-tertiary);letter-spacing: 0;margin-bottom:4px;">PASSO ${idxPasso + 1} DE ${passos.length}</div>
  `;

  let corpo = '';

  if (passo === 'dados') {
    corpo = `
      <h3 class="modal-title" style="margin-bottom:4px;">Seus dados</h3>
      <p style="font-size:14px;color:var(--text-tertiary);margin-bottom:16px;">Preencha para participar de <strong>${evento.titulo}</strong> 🙌</p>
      <div class="input-group">
        <label class="input-label">Nome completo</label>

          <input type="text" class="input-base" id="insc-nome" value="${nomeAtual}" placeholder="Nome e sobrenome">
        </div>
      </div>

        <label class="input-label">Seu WhatsApp</label>
        <div class="input-wrapper">
          <input type="tel" class="input-base" id="insc-tel" value="${telAtual}" placeholder="(27) 99999-9999">
        </div>
      </div>
      <div style="margin-top:18px;">
        <button class="btn btn-primary w-full btn-grande" data-action="insc-continuar" data-id="${eventoId}">
          ${temPagamento ? 'Continuar →' : 'Confirmar inscrição'}
        </button>
      </div>
    `;
  }

  // ---------- PASSO 2: PAGAMENTO ----------
  else if (passo === 'pagamento') {
    const valorBonito = formatarValorPix(cfg.pixValor);
    corpo = `
      <h3 class="modal-title" style="margin-bottom:4px;">Pagamento via Pix</h3>
      <p style="font-size:14px;color:var(--text-tertiary);margin-bottom:14px;">Copie a chave Pix, faça o pagamento e anexe o comprovante.</p>
      
      ${valorBonito ? `
        <div style="background:linear-gradient(135deg, rgba(34,197,94,.15), rgba(34,197,94,.05));border:1px solid rgba(34,197,94,.3);border-radius:16px;padding:14px;text-align:center;margin-bottom:16px;">
          <div style="font-size:12px;font-weight:700;color:#16a34a;letter-spacing: 0;margin-bottom:4px;">VALOR A PAGAR</div>
          <div style="font-size:28px;font-weight:700;color:#16a34a;">${valorBonito}</div>
        </div>
      ` : ''}
      
      ${cfg.pixChave ? `
        <div style="background:var(--bg-1, rgba(255,255,255,.04));border-radius:16px;padding:14px;margin-bottom:14px;">
          <div style="font-size:12px;font-weight:700;color:var(--text-tertiary);letter-spacing: 0;margin-bottom:8px;">CHAVE PIX</div>
          <div style="font-size:14px;word-break:break-all;background:var(--bg-3);padding:12px;border-radius:8px;margin-bottom:10px;font-family:monospace;text-align:center;">${cfg.pixChave}</div>
          <button class="btn btn-primary w-full" data-action="copiar-pix" data-value="${cfg.pixChave.replace(/"/g,'&quot;')}">📋 Copiar chave Pix</button>
        </div>` : ''}
      
      ${(() => { const linkBonito = normalizarUrl(cfg.pixLink); return linkBonito ? `
        <div style="background:var(--bg-1, rgba(255,255,255,.04));border-radius:16px;padding:14px;margin-bottom:14px;">
          <div style="font-size:12px;font-weight:700;color:var(--text-tertiary);letter-spacing: 0;margin-bottom:8px;">OU PAGUE PELO LINK</div>
          <button class="btn btn-primary w-full" data-action="abrir-link-pix" data-value="${linkBonito.replace(/"/g,'&quot;')}">🔗 Abrir link de pagamento</button>
        </div>` : ''; })()}
      
      <div style="background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);border-radius:16px;padding:14px;">
        <div style="font-size:12px;font-weight:700;color:#16a34a;letter-spacing: 0;margin-bottom:8px;">DEPOIS DE PAGAR · OBRIGATÓRIO</div>
        <div style="font-size:14px;font-weight:700;margin-bottom:10px;">📎 Anexe seu comprovante <span style="color:#ef4444;">*</span></div>
        <div id="comp-preview" style="${compAtual ? '' : 'display:none;'}text-align:center;margin-bottom:10px;">
          <img src="${compAtual || ''}" alt="Comprovante" style="max-width:160px;border-radius:12px;border:1px solid var(--border, rgba(255,255,255,.15));">

        <label class="btn ${compAtual ? 'btn-secondary' : 'btn-primary'} w-full" style="cursor:pointer;">
          <span id="comp-label">${compAtual ? '✓ Comprovante anexado (trocar)' : '📷 Tirar foto / escolher print'}</span>
          <input type="file" id="insc-comprovante" accept="image/*" style="display:none;">
        </label>
      </div>
      
      <div style="display:flex;gap:10px;margin-top:18px;">
        <button class="btn btn-secondary btn-grande" data-action="insc-voltar" style="flex:1;">← Voltar</button>
        <button class="btn btn-primary btn-grande" data-action="salvar-inscricao" data-id="${eventoId}" style="flex:2;" ${State.processando ? 'disabled' : ''}>${State.processando ? '⏳ Enviando...' : 'Confirmar inscrição'}</button>
      </div>
    `;
  }

  // ---------- PASSO 3: CONFIRMAR ----------
  // ---------- SALVANDO ----------
  else if (passo === 'salvando') {
    return `
      <div class="modal-overlay">
        <div class="modal" onclick="event.stopPropagation()" style="text-align:center;padding:40px 24px;">
          <div class="insc-spinner" style="margin:0 auto 18px;width:54px;height:54px;border:4px solid rgba(253,127,33,.18);border-top-color:var(--primary);border-radius:50%;animation:insc-spin .9s linear infinite;"></div>
          <h3 class="modal-title" style="margin-bottom:6px;">Salvando sua inscrição...</h3>
          <p style="font-size:14px;color:var(--text-tertiary);">Só um instante 🙏</p>
        </div>
      </div>
      <style>@keyframes insc-spin{to{transform:rotate(360deg)}}</style>
    `;
  }

  // ---------- SUCESSO ----------
  else if (passo === 'sucesso') {
    return `
      <div class="modal-overlay" data-action="concluir-inscricao">
        <div class="modal" onclick="event.stopPropagation()" style="text-align:center;position:relative;overflow:hidden;">
          <div class="aniv-confete aniv-confete-1">🎉</div>
          <div class="aniv-confete aniv-confete-2">🎊</div>
          <div class="aniv-confete aniv-confete-4">✨</div>
          <div style="width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#16a34a);display:flex;align-items:center;justify-content:center;color:#fff;font-size:42px;font-weight:700;margin:14px auto 18px;box-shadow:0 10px 28px rgba(34,197,94,.4);">✓</div>
          <h3 class="modal-title" style="margin-bottom:8px;">Inscrição confirmada!</h3>
          <p style="font-size:14px;color:var(--text-secondary);margin-bottom:6px;">${State.inscricaoNome ? State.inscricaoNome.split(' ')[0] + ', você' : 'Você'} está inscrito em <strong>${evento.titulo}</strong>. 🎉</p>
          ${temPagamento && !compAtualFoiEnviado(eventoId) ? `<p style="font-size:12px;color:#f59e0b;margin-bottom:14px;">Lembre de enviar o comprovante para garantir a vaga (toque em "Quero participar" de novo).</p>` : `<p style="font-size:14px;color:#16a34a;font-weight:700;margin-bottom:14px;">Tudo certo! Te esperamos lá. 🙏</p>`}

          <button class="btn btn-ghost w-full" data-action="ver-inscritos" data-id="${eventoId}" style="margin-top:8px;">Ver lista de inscritos</button>
        </div>
      </div>
    `;
  }

  return `
    <div class="modal-overlay" data-action="close-inscricao">
      <div class="modal" onclick="event.stopPropagation()">
        <div style="display:flex;justify-content:flex-end;margin-bottom:4px;">
          <button class="modal-close" data-action="close-inscricao">✕</button>
        </div>
        ${stepper}
        ${corpo}
      </div>
    </div>
  `;
}

// Verifica se o comprovante do jovem (pelo telefone atual) já foi salvo
function compAtualFoiEnviado(eventoId) {
  const fone = (State.inscricaoTel || '').replace(/\D/g, '');
  if (!fone) return false;
  const insc = getInscricoesDoEvento(eventoId).find(i => (i.telefone || '').replace(/\D/g, '') === fone);
  return !!(insc && insc.pago);
}

function renderModalInscritos() {

function decrementarEstoqueProduto(produtoId, qtd = 1) {
  const lista = getLojaProdutos();
  const p = lista.find(x => String(x.id) === String(produtoId));
  if (p && p.estoque !== null && p.estoque !== undefined && String(p.estoque).trim() !== '') {
    p.estoque = Math.max(0, parseInt(p.estoque) - qtd);
    salvarLojaProdutos(lista);
  }
}
// Desconta o estoque de TODOS os itens de um pedido (carrinho com vários produtos)
function decrementarEstoqueDoCarrinho(itens) {
  const lista = getLojaProdutos();
  let mudou = false;
  (itens || []).forEach(it => {
    const p = lista.find(x => String(x.id) === String(it.produtoId));
    if (p && p.estoque !== null && p.estoque !== undefined && String(p.estoque).trim() !== '') {
      p.estoque = Math.max(0, parseInt(p.estoque) - it.qtd);
      mudou = true;
    }
  });
  if (mudou) salvarLojaProdutos(lista);
}
function recalcularStatusPedidoPix(pedido) {
  pedido.status = lojaValorRestante(pedido) <= 0 ? 'pago' : 'parcial';
}

// Gera o texto do relatório da loja, formatado pro WhatsApp
function gerarRelatorioLojaTexto() {
  const pedidos = getLojaPedidos();
  let txt = `🛍️ *DEEP STORE — COMPROVANTES*\n\n`;
  pedidos.forEach((p, n) => {
    txt += `${n + 1}. *${p.compradorNome}* — ${p.produtoNome}\n`;
    if (p.compradorTel) txt += `   📱 ${p.compradorTel}\n`;
    txt += p.formaPagamento === 'cartao'
      ? `   💳 Cartão — ${p.status === 'pago' ? 'PAGO ✅' : 'aguardando na igreja'}\n`
      : `   💠 Pix — ${lojaStatusTexto(p)}\n`;
    txt += `\n`;
  });
  txt += `— — — — —\n👥 Total de pedidos: ${pedidos.length}`;
  return txt;
}

function gerarRelatorioLojaCSV() {
  const pedidos = getLojaPedidos();
  const esc = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const linhas = [];
  linhas.push(['#', 'Nome', 'WhatsApp', 'Produto', 'Preco', 'Forma', 'Valor pago', 'Status'].map(esc).join(';'));
  pedidos.forEach((p, n) => {
    linhas.push([
      n + 1, p.compradorNome || '', p.compradorTel || '', p.produtoNome || '',
      formatarMoeda(p.precoProduto), p.formaPagamento === 'pix' ? 'PIX' : 'CARTAO',
      formatarMoeda(lojaValorPago(p)), lojaStatusTexto(p)
    ].map(esc).join(';'));
  });
  return '\uFEFF' + linhas.join('\r\n');
}
function baixarPlanilhaLoja() {
  try {
    const csv = gerarRelatorioLojaCSV();
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'deep-store-comprovantes.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    showToast('📊 Planilha baixada!', 'success');
  } catch (err) {
    console.error('Erro ao gerar planilha da loja:', err);
    showToast('Não consegui gerar a planilha', 'error');
  }
}

// Gera o texto do relatório de inscritos, formatado pro WhatsApp
function gerarRelatorioTexto(eventoId) {
  const evento = (DB.get('eventos', []) || []).find(ev => String(ev.id) === String(eventoId));
  if (!evento) return '';
  const cfg = getConfigDoEvento(eventoId);
  const inscritos = getInscricoesDoEvento(eventoId);
  const pagos = inscritos.filter(i => i.pago);
  const naoPagos = inscritos.filter(i => !i.pago);
  
  let txt = `📋 *INSCRIÇÕES — DEEP*\n`;
  txt += `*${evento.titulo}*\n`;
  let linha2 = `📅 ${formatDateFull(evento.data)}`;
  if (evento.horario) linha2 += ` · 🕐 ${evento.horario}`;
  if (evento.local) linha2 += ` · 📍 ${evento.local}`;
  txt += linha2 + `\n`;
  
  txt += `\n✅ *PAGOS (${pagos.length})*\n`;
  txt += pagos.length ? pagos.map((i, n) => `${n + 1}. ${i.nome}${i.telefone ? ' — ' + i.telefone : ''}`).join('\n') : '—';
  
  txt += `\n\n🔴 *NÃO PAGOS (${naoPagos.length})*\n`;
  txt += naoPagos.length ? naoPagos.map((i, n) => `${n + 1}. ${i.nome}${i.telefone ? ' — ' + i.telefone : ''}`).join('\n') : '—';
  
  txt += `\n\n— — — — —\n`;
  txt += `👥 Total: ${inscritos.length} · ✅ ${pagos.length} pagos · 🔴 ${naoPagos.length} não pagos`;
  if (cfg.pixChave || cfg.pixValor) {
    txt += `\n💸 Pix: ${cfg.pixChave || ''}${cfg.pixValor ? ' · ' + formatarValorPix(cfg.pixValor) : ''}`;
  }
  return txt;
}

// Gera uma planilha (CSV) bem organizada dos inscritos, abre no Excel/Google Planilhas
function gerarRelatorioCSV(eventoId) {
  const evento = (DB.get('eventos', []) || []).find(ev => String(ev.id) === String(eventoId));
  const inscritos = getInscricoesDoEvento(eventoId);
  const esc = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const linhas = [];
  linhas.push(['#', 'Nome', 'WhatsApp', 'Pagamento', 'Tem comprovante', 'Data da inscrição'].map(esc).join(';'));
  inscritos.forEach((i, n) => {
    const data = i.criado_em ? new Date(i.criado_em).toLocaleString('pt-BR') : '';
    linhas.push([
      n + 1, i.nome || '', i.telefone || '',
      i.pago ? 'PAGO' : 'NAO PAGO',
      i.comprovante ? 'Sim' : 'Nao',
      data
    ].map(esc).join(';'));
  });
  // BOM pra acentos abrirem certo no Excel
  return '\uFEFF' + linhas.join('\r\n');
}

function baixarPlanilha(eventoId) {
  const evento = (DB.get('eventos', []) || []).find(ev => String(ev.id) === String(eventoId));
  try {
    const csv = gerarRelatorioCSV(eventoId);
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const nomeArq = 'inscritos-' + (evento ? evento.titulo.replace(/[^\w]+/g, '-').toLowerCase() : 'evento') + '.csv';
    a.href = url; a.download = nomeArq;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    showToast('📊 Planilha baixada!', 'success');
  } catch (err) {
    console.error('Erro ao gerar planilha:', err);
    showToast('Não consegui gerar a planilha', 'error');
  }
}

// Salva a inscrição (compartilhado pelo botão "Continuar" do evento gratuito
// e pelo "Confirmar inscrição" do passo de pagamento)
async function processarSalvarInscricao(eventoId) {
  const nome = State.inscricaoNome || '';
  const tel = State.inscricaoTel || '';
  if (!nome || !tel) {
    showToast('Faltam seus dados', 'error');
    State.inscPasso = 'dados';
    render(true);
    return;
  }
  const cfg = getConfigDoEvento(eventoId);
  const temPag = !!(cfg.pixChave || cfg.pixLink || cfg.pixValor);
  // Comprovante é OBRIGATÓRIO quando o evento tem cobrança
  if (temPag && !State.compTemp) {
    showToast('📷 Anexe a foto do comprovante para confirmar', 'error');
    return;
  }
  // Tela de "Salvando..."
  State.inscPasso = 'salvando';
  render(true);
  await new Promise(r => setTimeout(r, 100));
  if (USAR_SUPABASE && supabaseClient) {
    try { aplicarConfigNoCache(await carregarConfigSupabase()); } catch (err) {}
  }
  const lista = getInscricoesDoEvento(eventoId);
  const fone = tel.replace(/\D/g, '');
  const idx = lista.findIndex(i => (i.telefone || '').replace(/\D/g, '') === fone && fone);
  const temComp = !!State.compTemp;
  if (idx >= 0) {
    lista[idx].nome = nome;
    lista[idx].telefone = tel;
    if (temComp) { lista[idx].comprovante = State.compTemp; lista[idx].pago = true; }
  } else {
    lista.push({ nome, telefone: tel, comprovante: State.compTemp || null, pago: temComp || !temPag, criado_em: new Date().toISOString() });
  }
  await salvarInscricoesDoEvento(eventoId, lista);
  const eventoAtual = (DB.get('eventos', []) || []).find(ev => String(ev.id) === String(eventoId));
  registrarMinhaInscricao(eventoId, eventoAtual ? eventoAtual.titulo : 'Evento');
  State.inscPasso = 'sucesso';
  vibrarSucesso(); // 📳 comemoração tátil
  render(true);
}

// Verifica se o horário ainda está livre pra essa liderança
// (evita dois jovens marcarem o mesmo horário ao mesmo tempo)
function horarioAindaDisponivel(date, horario, comQuem, agendamentos, horariosTravados) {
  const ocup = getOcupacaoHorario(date, horario, agendamentos);
  const trav = horariosTravados || {};
  const eltTravado = (trav[`eltinho_${date}`] || []).includes(horario);
  const dayTravado = (trav[`dayana_${date}`] || []).includes(horario);
  
  if (comQuem === 'eltinho') {
    if (ocup.eltinho) return { ok: false, motivo: 'Esse horário com o Eltinho acabou de ser preenchido.' };
    if (eltTravado) return { ok: false, motivo: 'Esse horário não está mais disponível.' };
  } else if (comQuem === 'dayana') {
    if (ocup.dayana) return { ok: false, motivo: 'Esse horário com a Day acabou de ser preenchido.' };
    if (dayTravado) return { ok: false, motivo: 'Esse horário não está mais disponível.' };
  } else if (comQuem === 'os_dois') {
    if (ocup.eltinho || ocup.dayana) return { ok: false, motivo: 'Esse horário acabou de ser preenchido. Escolha outro 🙏' };
    if (eltTravado || dayTravado) return { ok: false, motivo: 'Esse horário não está mais disponível.' };
  }
  return { ok: true };
}

// Guarda no aparelho do jovem os agendamentos que ele fez,
// pra conseguir mostrar o status (confirmado/cancelado/remarcação) na home.
// Guarda id + telefone + data + hora pra casar mesmo se o id mudar (reenvio offline).
function registrarMeuAgendamento(ag) {
  if (!ag) return;
  const meus = DB.get('meusAgendamentos', []) || [];
  const jaTem = meus.some(m =>
    (m.id !== undefined && (m.id === ag.id || String(m.id) === String(ag.id))) ||
    (m.telefone === ag.telefone && m.data === ag.data_agendada && m.hora === ag.hora_agendada)
  );
  if (!jaTem) {
    meus.push({
      id: ag.id,
      telefone: ag.telefone,
      data: ag.data_agendada,
      hora: ag.hora_agendada,
      com_quem: ag.com_quem
    });
    DB.set('meusAgendamentos', meus);
  }
}

// Guarda localmente (só neste aparelho) as inscrições em eventos que a pessoa concluiu.
// Assim a home mostra "prova" de que a inscrição foi feita, em vez de parecer que "sumiu".
function registrarMinhaInscricao(eventoId, tituloEvento) {
  if (!eventoId) return;
  const minhas = DB.get('minhasInscricoes', []) || [];
  const jaTem = minhas.some(m => String(m.eventoId) === String(eventoId));
  if (!jaTem) {
    minhas.push({ eventoId, titulo: tituloEvento || 'Evento', criado_em: new Date().toISOString() });
    DB.set('minhasInscricoes', minhas);
  }
}

async function confirmarAgendamento() {
  const f = State.formData;
  
  // 🔒 TRAVA DE HORÁRIO DUPLO
  // Antes de salvar, pega os dados mais frescos da nuvem e confere de novo
  // se o horário ainda está livre — assim dois jovens não marcam o mesmo slot.
  if (USAR_SUPABASE && supabaseClient) {
    try {
      State.cache.agendamentos = await carregarAgendamentosSupabase();
      const cfg = await carregarConfigSupabase();
      State.cache.horariosTravados = cfg.horariosTravados || {};
    } catch (err) {
      console.error('Erro ao revalidar horário:', err);
    }
  }
  const checagem = horarioAindaDisponivel(
    State.dataEscolhida, State.horarioEscolhido, f.com_quem,
    DB.get('agendamentos', []) || [], DB.get('horariosTravados', {}) || {}
  );
  if (!checagem.ok) {
    showToast('😕 ' + checagem.motivo, 'error');
    // Volta pro passo de escolher horário, já atualizado
    State.horarioEscolhido = null;
    State.passo = 3;
    render();
    return;
  }
  
  const newAg = {
    id: 'ag_' + Date.now(),
    ...f,
    idade: calcularIdade(f.data_nascimento),
    data_agendada: State.dataEscolhida,
    hora_agendada: State.horarioEscolhido,
    status: 'confirmado',
    criado_em: new Date().toISOString()
  };
  
  // Salvar no Supabase (se configurado) OU localStorage
  let salvouOnline = false;
  if (USAR_SUPABASE && supabaseClient) {
    const saved = await salvarAgendamentoSupabase(newAg);
    if (saved) {
      newAg.id = saved.id; // Usar ID gerado pelo Supabase
      if (!State.cache.agendamentos) State.cache.agendamentos = [];
      State.cache.agendamentos.push(saved);
      salvouOnline = true;
    }
  }
  // Sempre salva no localStorage também (backup de segurança)
  if (!salvouOnline) {
    const ags = DB.get('agendamentos', []) || [];
    ags.push(newAg);
    DB.set('agendamentos', ags);
    // Se era pra ir pra nuvem mas falhou, coloca na fila de reenvio
    // pra tentar de novo automaticamente até o líder receber.
    if (USAR_SUPABASE && supabaseClient) {
      const fila = DB.get('agendamentosPendentes', []) || [];
      fila.push(newAg);
      DB.set('agendamentosPendentes', fila);
      showToast('📡 Sem internet agora — vamos reenviar sozinho assim que voltar', 'success');
    }
  }
  
  State.agendamentoConfirmado = newAg;
  registrarMeuAgendamento(newAg);
  vibrarSucesso(); // 📳 comemoração tátil
  render();
  showToast('Agendamento confirmado! 🎉', 'success');
  
  // Notificações WhatsApp
  enviarNotificacaoWhatsApp(newAg);
  enviarConfirmacaoJovem(newAg);
}

  if (!WHATSAPP_APIKEY || WHATSAPP_APIKEY === 'COLOQUE_SEU_APIKEY_AQUI') {

}

// ============================================
// LEMBRETES AUTOMÁTICOS
// Roda automaticamente ao abrir o app
// ============================================
function verificarLembretesAutomaticos() {
  const ags = DB.get('agendamentos', []) || [];
  const lembretesEnviados = DB.get('lembretesEnviados', {}) || {};
  const agora = new Date();
  
  ags.forEach(ag => {
    if (ag.status === 'cancelado' || ag.status === 'concluido') return;
    if (!ag.telefone) return;
    
    const dataConversa = new Date(ag.data_agendada + 'T' + ag.hora_agendada + ':00');
    const diff = dataConversa - agora;
    
    // Lembrete 1 hora antes (entre 30min e 90min antes)
    if (diff > 30 * 60 * 1000 && diff <= 90 * 60 * 1000) {
      const chave = `1h_${ag.id}`;
      if (!lembretesEnviados[chave]) {
        enviarLembrete1Hora(ag);
        lembretesEnviados[chave] = new Date().toISOString();
      }
    }
    
    // Lembrete 1 dia antes (entre 20h e 28h antes)
    if (diff > 20 * 60 * 60 * 1000 && diff <= 28 * 60 * 60 * 1000) {
      const chave = `1d_${ag.id}`;
      if (!lembretesEnviados[chave]) {
        enviarLembrete1Dia(ag);
        lembretesEnviados[chave] = new Date().toISOString();
      }
    }
  });
  
  DB.set('lembretesEnviados', lembretesEnviados);
}

// Liga um campo de busca a uma lista de itens (filtragem instantânea por data-nome)
function ligarBusca(inputId, itemSelector, vazioId, limparId) {
  const input = document.getElementById(inputId);
  if (!input) return;
  
  const filtrar = () => {
    const termo = input.value.trim().toLowerCase();
    const itens = document.querySelectorAll(itemSelector);
    let visiveis = 0;
    itens.forEach(el => {
      const nome = el.dataset.nome || '';
      const ok = termo === '' || nome.includes(termo);
      el.style.display = ok ? '' : 'none';
      if (ok) visiveis++;
    });
    // Esconde cabeçalhos/grupos que ficaram sem itens visíveis
    document.querySelectorAll('.section, .aniv-grupo-mes, .aniv-lista-admin').forEach(sec => {
      const lista = sec.querySelectorAll(itemSelector);
      if (lista.length > 0) {
        const algum = Array.from(lista).some(el => el.style.display !== 'none');
        sec.style.display = (termo !== '' && !algum) ? 'none' : '';
      }
    });
    const vazio = vazioId && document.getElementById(vazioId);
    if (vazio) vazio.style.display = (termo !== '' && visiveis === 0) ? 'block' : 'none';
    const limpar = limparId && document.getElementById(limparId);
    if (limpar) limpar.style.display = termo === '' ? 'none' : 'block';
  };
  
  input.addEventListener('input', filtrar);
  const limpar = limparId && document.getElementById(limparId);
  if (limpar) limpar.addEventListener('click', () => { input.value = ''; filtrar(); input.focus(); });
}

async function handleAction(e) {
  // Para a propagação aqui mesmo. Isso impede um problema sutil:
  // se um botão dispara render() e isso troca o HTML, o clique continua
  // "subindo" e pode acionar o fechamento do modal (que voltava pra capa).
  e.stopPropagation();
  
  const action = e.currentTarget.dataset.action;
  const value = e.currentTarget.dataset.value;
  const date = e.currentTarget.dataset.date;
  const horario = e.currentTarget.dataset.horario;
  const id = e.currentTarget.dataset.id;

  switch (action) {
    case 'reload': setView('home'); break;
    case 'scroll-eventos': { const el = document.getElementById('eventos-sec'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
    case 'goto-agendar': setView('agendar'); break;
    case 'goto-admin': setView('admin-login'); break;
    case 'back-home': setView('home'); break;

    // ---------- 🛍️ DEEP STORE — jovem ----------
    case 'goto-loja': setView('loja'); break;

    case 'abrir-produto-loja':
      State.modalLojaProduto = id;
      State.lojaVariacaoTemp = '';
      render(true);
      break;
    case 'close-produto-loja':
      State.modalLojaProduto = null;
      render(true);
      break;

    case 'loja-escolher-variacao':
      State.lojaVariacaoTemp = e.currentTarget.dataset.value;
      render(true);
      break;

    case 'loja-add-carrinho': {
      const produto = getLojaProdutos().find(x => String(x.id) === String(id));
      if (!produto) break;
      const variacoes = lojaListaVariacoes(produto);
      if (variacoes.length > 0 && !State.lojaVariacaoTemp) { showToast('Escolha o tamanho antes de adicionar', 'error'); break; }
      lojaAdicionarAoCarrinho(produto, State.lojaVariacaoTemp);
      State.modalLojaProduto = null;
      State.lojaVariacaoTemp = '';
      showToast('🛒 Adicionado ao carrinho!', 'success');
      render(true);
      break;
    }

    case 'abrir-carrinho-loja':
      State.modalLojaCarrinho = true;
      render(true);
      break;
    case 'close-carrinho-loja':
      State.modalLojaCarrinho = false;
      render(true);
      break;
    case 'loja-remover-carrinho': {
      const idx = parseInt(e.currentTarget.dataset.idx);
      lojaRemoverDoCarrinho(idx);
      render(true);
      break;
    }
    case 'loja-carrinho-qtd': {
      const idx = parseInt(e.currentTarget.dataset.idx);
      const delta = parseInt(e.currentTarget.dataset.delta);
      lojaAlterarQtdCarrinho(idx, delta);
      render(true);
      break;
    }
    case 'loja-finalizar-carrinho': {
      if ((State.lojaCarrinho || []).length === 0) break;
      if (lojaCarrinhoTemProblemaDeEstoque()) {
        showToast('⚠️ Algum item do carrinho esgotou. Ajuste a quantidade pra continuar.', 'error');
        break;
      }
      State.modalLojaCarrinho = false;
      State.modalLojaCompra = {};
      State.lojaCompraPasso = 'dados';
      State.lojaFormaPagamento = null;
      State.lojaComprovanteTemp = undefined;
      State.lojaValorParcelaTemp = '';
      render(true);
      break;
    }

    case 'close-compra-loja':
      State.modalLojaCompra = null;
      State.lojaCompraPasso = 'dados';
      State.lojaComprovanteTemp = undefined;
      State.lojaValorParcelaTemp = '';
      render(true);
      break;

    case 'loja-ir-forma': {
      const nomeEl = document.getElementById('loja-nome');
      const telEl = document.getElementById('loja-tel');
      const nome = (nomeEl ? nomeEl.value : '').trim();
      const tel = (telEl ? telEl.value : '').trim();
      if (!nome || !tel) { showToast('Preencha nome e WhatsApp', 'error'); break; }
      State.lojaCompradorNome = nome;
      State.lojaCompradorTel = tel;
      State.lojaCompraPasso = 'forma';
      render(true);
      break;
    }
    case 'loja-voltar-dados':
      State.lojaCompraPasso = 'dados';
      render(true);
      break;
    case 'loja-escolher-forma': {
      const forma = e.currentTarget.dataset.value;
      State.lojaFormaPagamento = forma;
      State.lojaCompraPasso = forma === 'pix' ? 'pix' : 'cartao';
      render(true);
      break;
    }
    case 'loja-voltar-forma':
      State.lojaCompraPasso = 'forma';
      render(true);
      break;

    case 'loja-confirmar-cartao': {
      if (State.processando) break;
      const ctx = State.modalLojaCompra;
      if (ctx.pedidoId) break; // "add mais parcela" não existe pra cartão
      if (lojaCarrinhoTemProblemaDeEstoque()) { showToast('⚠️ Algum item do carrinho esgotou.', 'error'); break; }
      const itens = (State.lojaCarrinho || []).map(it => ({ ...it }));
      if (itens.length === 0) break;
      State.processando = true;
      render();
      const pedidos = getLojaPedidos();
      const nomeCompleto = itens.map(i => `${i.nome}${i.variacao ? ` (${i.variacao})` : ''}${i.qtd > 1 ? ` x${i.qtd}` : ''}`).join(', ');
      pedidos.push({
        id: Date.now(),
        itens,
        produtoNome: nomeCompleto,
        produtoFoto: itens[0].foto || '',
        precoProduto: itens.reduce((s, i) => s + i.preco * i.qtd, 0),
        compradorNome: State.lojaCompradorNome,
        compradorTel: State.lojaCompradorTel,
        formaPagamento: 'cartao',
        status: 'aguardando',
        parcelas: [],
        criado_em: new Date().toISOString()
      });
      await salvarLojaPedidos(pedidos);
      decrementarEstoqueDoCarrinho(itens);
      State.lojaCarrinho = [];
      State.processando = false;
      State.lojaCompraPasso = 'sucesso';
      vibrarSucesso();
      render(true);
      break;
    }

    case 'loja-enviar-parcela': {
      if (State.processando) break;
      const valorEl = document.getElementById('loja-valor');
      const valorTxt = (valorEl ? valorEl.value : '').trim();
      const valorNum = parseFloat(valorTxt.replace(/\./g, '').replace(',', '.'));
      if (!valorTxt || isNaN(valorNum) || valorNum <= 0) { showToast('Informe um valor válido', 'error'); break; }
      if (!State.lojaComprovanteTemp) { showToast('📷 Anexe a foto do comprovante para enviar', 'error'); break; }
      const ctx = State.modalLojaCompra;
      if (!ctx.pedidoId && lojaCarrinhoTemProblemaDeEstoque()) {
        showToast('⚠️ Algum item do carrinho esgotou. Ajuste a quantidade pra continuar.', 'error');
        break;
      }
      State.processando = true;
      render();
      const pedidos = getLojaPedidos();
      const novaParcela = { valor: valorNum, comprovante: State.lojaComprovanteTemp, data: new Date().toISOString(), status: 'pendente' };
      if (ctx.pedidoId) {
        const pedido = pedidos.find(p => String(p.id) === String(ctx.pedidoId));
        if (pedido) {
          pedido.parcelas = pedido.parcelas || [];
          pedido.parcelas.push(novaParcela);
        }
      } else {
        const itens = (State.lojaCarrinho || []).map(it => ({ ...it }));
        if (itens.length > 0) {
          const nomeCompleto = itens.map(i => `${i.nome}${i.variacao ? ` (${i.variacao})` : ''}${i.qtd > 1 ? ` x${i.qtd}` : ''}`).join(', ');
          pedidos.push({
            id: Date.now(),
            itens,
            produtoNome: nomeCompleto,
            produtoFoto: itens[0].foto || '',
            precoProduto: itens.reduce((s, i) => s + i.preco * i.qtd, 0),
            compradorNome: State.lojaCompradorNome,
            compradorTel: State.lojaCompradorTel,
            formaPagamento: 'pix',
            status: 'pendente',
            parcelas: [novaParcela],
            criado_em: new Date().toISOString()
          });
          decrementarEstoqueDoCarrinho(itens);
          State.lojaCarrinho = [];
        }
      }
      await salvarLojaPedidos(pedidos);
      State.processando = false;
      State.lojaFormaPagamento = 'pix';
      State.lojaCompraPasso = 'sucesso';
      vibrarSucesso();
      render(true);
      break;
    }

    case 'abrir-meus-pedidos-loja':
      State.modalLojaCompra = null;
      // Se acabou de finalizar uma compra, já pré-preenche nome/telefone (evita digitar de novo)
      if (State.lojaCompradorNome && State.lojaCompradorTel) {
        State.lojaCompradorNomeConsulta = State.lojaCompradorNome;
      }
      State.modalLojaMeusPedidos = true;
      render(true);
