:root { --r: 14px; --stripe: #FF5F00; --ink: #261363; --display-stretch: 125%; }
*, *::before, *::after { font-family: 'Archivo', system-ui, -apple-system, sans-serif !important; letter-spacing: 0; }
body { font-size: 16px; line-height: 1.55; font-weight: 400; }
/* títulos: larga e pesada */
h1, h2, h3, h4, .section-title, .modal-title, .pesq-titulo, .oracao-card-titulo, .oracao-titulo, .stat-number, .cover-deep {
  font-weight: 900 !important; font-stretch: 125%; letter-spacing: -0.01em !important; line-height: 1.12; color: var(--ink); }
h1, h2, .section-title { font-size: 28px; }
h3, .modal-title, .pesq-titulo { font-size: 22px; }
h4, .oracao-card-titulo { font-size: 18px; }
/* etiquetas: caixa alta + espaço, como no estilo da Fogo na Vila */
.section-label, .cover-badge, .oracao-label, .pesq-prog2-t span, .admin-tab-label, .stat-label, .loja-hero-badge, .pesq-selo, .badge, .tag, .evento-tag {
  text-transform: uppercase !important; letter-spacing: .12em !important; font-size: 12px !important; font-weight: 700 !important; }
/* cantos retos, borda preta de 2px, sem sombra */
.card, .modal, .form-box, .info-card, .stat-card, .calendar, .empty-state, .aniv-stat, .pesq-card, .pesq-modal .pesq-card, .oracao-card, .pesq-home { border-radius: var(--r) !important; border: 2px solid var(--ink) !important; box-shadow: none !important; background: #FFFFFF !important; }
.btn, .btn-primary, .btn-ghost, .btn-grande, button.btn, .pesq-rosto, .pesq-op, .pesq-chip, .oracao-input, .oracao-textarea, .pesq-campo, input, textarea, select, .pesq-hero, .pesq-home-ico, .oracao-brilho, .pesq-selo, .pesq-versiculo, .pesq-intro, .modal-close { border-radius: var(--r) !important; }
.btn-primary { background: #FF5F00 !important; color: var(--ink) !important; border: 2px solid var(--ink) !important; box-shadow: none !important; font-weight: 900 !important; font-stretch: 112%; text-transform: none; }
.btn-primary:hover:not(:disabled) { box-shadow: none !important; transform: none; background: #FF7426 !important; }
.btn-primary:active:not(:disabled) { transform: translateY(1px); box-shadow: none !important; }
.btn-ghost { border: 2px solid var(--ink); color: var(--ink); font-weight: 700; }
input, textarea, select, .oracao-input, .oracao-textarea { border: 2px solid var(--ink) !important; background: #FFFFFF !important; color: var(--ink); }
input:focus, textarea:focus, select:focus { outline: 3px solid #FF5F00; outline-offset: 0; box-shadow: none !important; }
/* cabeçalho preto com faixa laranja */
.app-header { background: #261363 !important; border-bottom: 6px solid #FF5F00 !important; }
.app-header .app-header-title, .app-header-title { color: #FF5F00 !important; }
.app-header * { color: #FFFFFF; }
.app-header .logo-text, .app-header [class*="brand"] b { color: #FF5F00; }
.app-header button { border: 2px solid #FF5F00 !important; background: transparent !important; color: #FF5F00 !important; border-radius: var(--r) !important; }
/* capa preta, logo branco, faixa laranja */
.cover { background: #261363 !important; border-bottom: 6px solid #FF5F00; }
.cover::before { background-image: none !important; }
.cover img, .cover-deep-img, .cover-logo { filter: invert(1) brightness(1.1); }
.cover-badge { background: #FF5F00 !important; color: var(--ink) !important; border-radius: var(--r) !important; }
.cover-badge-dot { background: var(--ink) !important; }
.cover-deep + p, .cover-tagline { color: #FF5F00 !important; text-transform: uppercase; letter-spacing: .18em !important; font-weight: 700 !important; font-size: 14px !important; }
.cover p, .cover-text { color: #FFFFFF !important; }
.cover-cta { background: #FF5F00 !important; color: var(--ink) !important; border-radius: var(--r) !important; border: 2px solid #FF5F00 !important; font-weight: 900 !important; font-stretch: 112%; }
.cover-cta * { color: var(--ink) !important; }
.cover-cta .cta-seta, .cover-cta span:last-child { background: var(--ink) !important; color: #FF5F00 !important; }
/* abertura preta com faixa */
.splash { background: #261363 !important; }
.splash::before { display: none !important; }
.splash-logo-img, .splash-logo img { filter: invert(1); }
.splash-title { color: #FF5F00 !important; text-transform: uppercase; letter-spacing: .2em !important; font-weight: 700 !important; font-size: 14px !important; }
.splash-loader span { background: #FF5F00 !important; }
/* abas do painel */
.admin-tabs { background: #FFFFFF !important; border-bottom: 2px solid var(--ink) !important; }
.admin-tab { border-radius: var(--r) !important; border: 2px solid transparent; }
.admin-tab.active { background: #FF5F00 !important; border-color: var(--ink) !important; }
/* pesquisa */
.pesq-rosto { border: 2px solid var(--ink); background: #FFFFFF; opacity: .5; }
.pesq-rosto.sel { background: #FF5F00; opacity: 1; transform: none; }
.pesq-op, .pesq-chip { border: 2px solid var(--ink) !important; background: #FFFFFF; font-weight: 700; }
.pesq-op.sel, .pesq-chip.sel { background: #FF5F00; }
.pesq-hero, .pesq-home-ico { background: #FF5F00; border: 2px solid var(--ink); }
.pesq-barra-prog { height: 8px; border-radius: 0; background: #E2DCCD; }
.pesq-barra-prog i { border-radius: 0; background: #FF5F00; }
.pesq-barra .pb-t, .pesq-barra .pb-t i { border-radius: 0; }
.pesq-conf { display: none; }
.modal-overlay { background: rgba(38,19,99,.6); }

.splash-shine { display: none !important; }
.admin-tab-label { letter-spacing: .04em !important; }
.admin-tab { padding-left: 12px !important; padding-right: 12px !important; min-width: 0 !important; }
.input-wrapper { border: 2px solid var(--ink) !important; border-radius: var(--r) !important; background: #FFFFFF !important; box-shadow: none !important; }
.input-wrapper input, .input-wrapper textarea { border: 0 !important; outline: none !important; background: transparent !important; }
.input-wrapper:focus-within { outline: 3px solid #FF5F00; }
.lider-card, .evento-card, .ag-item, .horario-btn, .hora-btn, .dia-btn, .opcao, .option-card, [class*="-card"]:not(.oracao-card):not(.pesq-card):not(.card) { border-radius: var(--r) !important; }
.lider-card { border: 2px solid var(--ink) !important; background: #FFFFFF !important; box-shadow: none !important; }
.lider-card.selected { background: #FF5F00 !important; }
.lider-card.selected * { color: var(--ink) !important; }
.lider-foto { border-radius: var(--r) !important; border: 2px solid var(--ink); }
.step-circle { border-radius: var(--r) !important; }

/* ===== v10.14 — LARANJA FLUORESCENTE nas áreas grandes (topo, capa, abertura) ===== */
.app-header { background: #FF5F00 !important; border-bottom: 6px solid #261363 !important; }
.app-header *, .app-header .app-header-title { color: #261363 !important; }
.app-header button { border: 2px solid #261363 !important; color: #261363 !important; background: transparent !important; }
.app-header .logo, .app-header [class*="logo"] { background: #261363 !important; color: #FF5F00 !important; }
.app-header [class*="logo"] * { color: #FF5F00 !important; }
.cover { background: #FF5F00 !important; border-bottom: 6px solid #261363 !important; }
.cover img, .cover-deep-img, .cover-logo { filter: none !important; }
.cover p, .cover-text, .cover h1, .cover h2 { color: #261363 !important; }
.cover-deep + p, .cover-tagline { color: #261363 !important; }
.cover-badge { background: #261363 !important; color: #FF5F00 !important; }
.cover-badge-dot { background: #FF5F00 !important; }
.cover-cta { background: #261363 !important; color: #FF5F00 !important; border-color: #261363 !important; }
.cover-cta * { color: #FF5F00 !important; }
.cover-cta span:last-child { background: #FF5F00 !important; color: #261363 !important; }
.cover-cta span:last-child * { color: #261363 !important; }
.splash { background: #FF5F00 !important; }
.splash-logo-img, .splash-logo img { filter: none !important; }
.splash-title { color: #261363 !important; }
.splash-loader span { background: #261363 !important; }

.app-header .brand-icon { background: #261363 !important; color: #FF5F00 !important; border-radius: 4px !important; box-shadow: none !important; }
.app-header .brand-label { opacity: .85; font-weight: 700; }
.loja-theme .app-header { background: #261363 !important; border-bottom-color: #FF5F00 !important; }
.loja-theme .app-header *, .loja-theme .app-header button { color: #FF5F00 !important; border-color: #FF5F00 !important; }
.loja-theme .app-header .brand-icon { background: #FF5F00 !important; color: #261363 !important; }

/* ===== v10.16 — POP JOVEM: creme + laranja fluorescente + amarelo, formas redondas, sombra sólida ===== */
:root, .admin-theme { --bg-0: #FFF6EA; --bg-1: #FFFAF2; --bg-2: #FFFFFF; --bg-3: #FFEBD6; --bg-4: #FFDFC0;
  --border: #F0D9BF; --border-light: #E8CDAE; --border-medium: #D6B590; --pop: #FF8A00; --ink: #261363; }
html, body { background: #FFF6EA !important; }
.app-header { background: #FFF6EA !important; border-bottom: 2px solid #261363 !important; }
.app-header *, .app-header .app-header-title { color: #261363 !important; }
.app-header button { border: 2px solid #261363 !important; border-radius: 999px !important; background: #FFFFFF !important; }
.app-header .brand-icon { background: #FF5F00 !important; color: #261363 !important; border: 2px solid #261363 !important; border-radius: 12px !important; }
/* capa: cartão laranja redondo flutuando no creme */
.cover { background: transparent !important; border: 0 !important; padding: 16px 16px 8px !important; margin-bottom: 8px !important; }
.cover::before { display: none !important; }
.cover-content { position: relative; background: #FF5F00; border: 2px solid #261363; border-radius: 28px; box-shadow: 0 6px 0 #261363; padding: 26px 20px 24px !important; text-align: left !important; align-items: flex-start !important; overflow: hidden; }
.cover-content::after { content: ''; position: absolute; right: -40px; bottom: -40px; width: 160px; height: 160px; border-radius: 50%; background: #FF8A00; opacity: .9; }
.cv-sticker { display: inline-block; background: #FF8A00; color: #261363; font-size: 14px; font-weight: 800; padding: 6px 14px; border: 2px solid #261363; border-radius: 999px; transform: rotate(-3deg); margin-bottom: 18px; }
.cv-star { position: absolute; top: 16px; right: 18px; font-size: 28px; color: #261363; transform: rotate(12deg); }
.cover-deep-img { filter: none !important; width: 120px !important; margin: 0 0 14px !important; }
.cv-big { font-size: 36px !important; line-height: 1.02 !important; font-weight: 900 !important; font-stretch: 125%; color: #261363 !important; margin: 0 0 14px; position: relative; z-index: 1; text-transform: none !important; }
.cv-big mark { background: #FFFFFF; color: #261363; padding: 0 8px; border: 2px solid #261363; border-radius: 10px; display: inline-block; transform: rotate(-2deg); }
.cv-sub { font-size: 16px; line-height: 1.5; color: #261363 !important; margin: 0 0 20px; max-width: 28ch; position: relative; z-index: 1; }
.cover-cta { position: relative; z-index: 1; display: inline-flex !important; align-items: center; gap: 10px; width: auto !important; background: #261363 !important; color: #FFF6EA !important; border: 2px solid #261363 !important; border-radius: 999px !important; padding: 14px 22px !important; font-size: 16px !important; font-weight: 800 !important; box-shadow: 0 4px 0 #FFFFFF !important; text-transform: none !important; letter-spacing: 0 !important; }
.cover-cta *, .cover-cta-arrow { color: #FFF6EA !important; background: transparent !important; width: auto !important; height: auto !important; }
/* cartões e botões: redondos, borda + sombra sólida */
.card, .modal, .form-box, .info-card, .stat-card, .calendar, .empty-state, .aniv-stat, .oracao-card, .pesq-card, .pesq-home, .lider-card { border-radius: 20px !important; border: 2px solid #261363 !important; box-shadow: 0 4px 0 #261363 !important; background: #FFFFFF !important; }
.modal { border-radius: 24px !important; }
.card:hover { box-shadow: 0 4px 0 #261363 !important; }
.btn, .btn-primary, .btn-ghost, .btn-grande { border-radius: 999px !important; }
.btn-primary { background: #FF5F00 !important; color: #261363 !important; border: 2px solid #261363 !important; box-shadow: 0 4px 0 #261363 !important; font-weight: 800 !important; font-stretch: 100%; }
.btn-primary:hover:not(:disabled) { box-shadow: 0 4px 0 #261363 !important; background: #FF7426 !important; transform: none; }
.btn-primary:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #261363 !important; }
.btn-ghost { background: #FFFFFF !important; border: 2px solid #261363 !important; color: #261363 !important; box-shadow: 0 3px 0 #261363; }
input, textarea, select, .input-wrapper, .oracao-input, .oracao-textarea, .pesq-campo { border-radius: 14px !important; border: 2px solid #261363 !important; background: #FFFFFF !important; }
.input-wrapper input { border: 0 !important; }
.pesq-rosto, .pesq-op, .pesq-chip, .lider-card, .admin-tab, .step-circle { border-radius: 14px !important; }
.pesq-op, .pesq-chip { border-radius: 999px !important; }
.pesq-rosto.sel, .pesq-op.sel, .pesq-chip.sel { background: #FF8A00 !important; }
.pesq-hero, .pesq-home-ico { border-radius: 16px !important; background: #FF8A00 !important; }
.pesq-selo { border-radius: 999px !important; background: #FF8A00 !important; }
.pesq-versiculo, .pesq-intro { border-radius: 16px !important; background: #FFEBD6 !important; }
.lider-card.selected { background: #FF8A00 !important; }
/* etiquetas viram adesivos amarelos */
.section-label { display: inline-block !important; background: #FF8A00; color: #261363 !important; padding: 4px 12px; border: 2px solid #261363; border-radius: 999px; transform: rotate(-2deg); margin-bottom: 10px; font-weight: 800 !important; letter-spacing: .04em !important; }
.admin-tabs { background: #FFF6EA !important; }
.admin-tab.active { background: #FF8A00 !important; border-color: #261363 !important; }
.splash { background: #FF5F00 !important; }
.splash::after { content: ''; position: absolute; right: -60px; top: -60px; width: 240px; height: 240px; border-radius: 50%; background: #FF8A00; }
.loja-hero-cta, .loja-hero-badge { border-radius: 999px !important; }

/* ===== v10.17 — home com atalhos coloridos e ritmo mais justo ===== */
.faixa { display: flex; justify-content: center; gap: 18px; background: #FF8A00; border-top: 2px solid #261363; border-bottom: 2px solid #261363; padding: 10px 12px; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #261363; white-space: nowrap; overflow: hidden; margin: 14px 0 20px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 0 0 22px; }
.tile { position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; min-height: 140px; padding: 16px; border: 2px solid #261363; border-radius: 22px; box-shadow: 0 4px 0 #261363; cursor: pointer; color: #261363; }
.tile:active { transform: translateY(3px); box-shadow: 0 1px 0 #261363; }
.tile .t-ico { font-size: 28px; line-height: 1; }
.tile b { display: block; font-size: 18px; font-weight: 900; font-stretch: 125%; line-height: 1.1; letter-spacing: -0.01em; }
.tile span:not(.t-ico):not(.t-tag) { display: block; margin-top: 4px; font-size: 14px; line-height: 1.3; }
.tile-or { background: #FF5F00; } .tile-ye { background: #FF8A00; } .tile-wh { background: #FFFFFF; }
.tile-te { background: #261363; color: #FFF6EA; } .tile-te * { color: #FFF6EA; }
.t-tag { position: absolute; top: 12px; right: 12px; background: #FF5F00; color: #261363; border: 2px solid #261363; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 800; transform: rotate(4deg); }
.container .section { margin-bottom: 22px; }
.section-header { margin-bottom: 12px; }
.card-highlight { background: #FF8A00 !important; }
.card-highlight p, .card-highlight p * { color: #261363 !important; }
.evento-empty { background: #FFFFFF; border: 2px dashed #261363; border-radius: 18px; padding: 20px; text-align: center; color: #261363; font-weight: 600; }
.tiles { grid-auto-rows: 1fr; }

:root, .admin-theme { --ink: #261363; --pink: #FF8A00; --violet: #E8420A; --bg-0: #FFF7EE; --bg-3: #FFEBD9; --text-primary: #1D0F4F; --text-secondary: #3F2F78; --text-tertiary: #6A5CA0; }
html, body { background: #FFF7EE !important; color: #1D0F4F; }
h1, h2, h3, h4, .section-title, .modal-title, .pesq-titulo, .oracao-card-titulo, .oracao-titulo, .stat-number, .evento-data b, .cv-big, .tile b, .lider-nome, .brand-name {
  font-family: 'Anton', 'Archivo', sans-serif !important; font-weight: 400 !important; text-transform: uppercase !important; letter-spacing: .01em !important; line-height: 1.04 !important; font-stretch: 100% !important; font-synthesis: none; }
h1, h2, .section-title { font-size: 28px; } h3, .modal-title, .pesq-titulo { font-size: 22px; } h4, .oracao-card-titulo, .tile b, .lider-nome { font-size: 18px; }
/* topo */
.app-header { background: #FFF7EE !important; border-bottom: 2px solid #261363 !important; }
.app-header .brand-icon { background: linear-gradient(135deg, #FF5F00, #FF8A00) !important; color: #fff !important; border: 2px solid #261363 !important; font-family: 'Anton' !important; }
/* capa = pôster */
.cover { background: linear-gradient(160deg, #FF8A00 0%, #FF5F00 48%, #E8301A 100%) !important; border: 0 !important; border-bottom: 2px solid #261363 !important; padding: 26px 20px 56px !important; margin: 0 !important; position: relative; overflow: hidden; }
.cover::before { display: block !important; content: ''; position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(255,255,255,.22) 1.5px, transparent 1.6px); background-size: 18px 18px; pointer-events: none; }
.cover::after { content: ''; position: absolute; right: -70px; top: 90px; width: 230px; height: 230px; border-radius: 50%; border: 3px solid rgba(255,255,255,.55); box-shadow: 0 0 0 26px rgba(255,255,255,.10); pointer-events: none; }
.cover-content { background: transparent !important; border: 0 !important; box-shadow: none !important; border-radius: 0 !important; padding: 0 !important; position: relative; z-index: 1; overflow: visible; }
.cover-content::after { display: none !important; }
.cv-sticker { background: #FFFFFF; color: #261363; border: 2px solid #261363; border-radius: 999px; box-shadow: 0 3px 0 #261363; font-weight: 800; transform: rotate(-3deg); margin-bottom: 16px; }
.cv-star { color: #fff; font-size: 32px; top: 0; right: 0; }
.cover-deep-img { filter: invert(1) !important; width: 110px !important; margin: 0 0 10px !important; }

.cv-big mark { background: #261363; color: #fff; border: 0; border-radius: 0; padding: 0 12px; transform: rotate(-3deg); display: inline-block; text-shadow: none; }
.cv-sub { color: #fff !important; font-weight: 600; max-width: 30ch; margin-bottom: 22px; }
.cover-cta { background: #FFFFFF !important; color: #261363 !important; border: 2px solid #261363 !important; box-shadow: 0 4px 0 #261363 !important; }
.cover-cta *, .cover-cta-arrow { color: #261363 !important; }
/* fita diagonal cruzando o pôster */
.fita { background: #261363; color: #fff; transform: rotate(-2.5deg); margin: -34px -12px 26px; padding: 11px 0; white-space: nowrap; overflow: hidden; position: relative; z-index: 2; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; border-top: 2px solid #FF5F00; border-bottom: 2px solid #FF5F00; }
.fita { text-align: center; } .fita span { display: inline-block; padding: 0 8px; }
.faixa { display: none; }
/* atalhos */
.tile-or { background: #FF5F00; } .tile-ye { background: #FF8A00; } .tile-wh { background: #FFFFFF; } .tile-te { background: #E8420A; color: #fff; } .tile-te * { color: #fff; }
.t-tag { background: #FF8A00; color: #fff; }
.tile b { font-size: 22px; }
/* etiquetas, cartões, verso */
.section-label { background: #261363 !important; color: #fff !important; border: 0 !important; border-radius: 0 !important; transform: rotate(-2deg); padding: 4px 12px; }
.card-highlight { background: #E8420A !important; } .card-highlight p, .card-highlight p * { color: #fff !important; }
.pesq-rosto.sel, .pesq-op.sel, .pesq-chip.sel, .admin-tab.active, .lider-card.selected { background: #FF8A00 !important; color: #fff !important; }
.pesq-hero, .pesq-home-ico, .pesq-selo { background: #FF8A00 !important; color: #fff; }
.pesq-versiculo, .pesq-intro { background: #FFEBD9 !important; }
.btn-primary { background: #FF5F00 !important; color: #fff !important; text-shadow: 0 1px 0 rgba(38,19,99,.35); }
/* abertura */
.splash { background: linear-gradient(160deg, #FF8A00 0%, #FF5F00 48%, #E8301A 100%) !important; }
.splash::after { display: none !important; }
.splash-logo-img, .splash-logo img { filter: invert(1) !important; }
.splash-title { color: #fff !important; font-weight: 800 !important; }

// Inicializa Supabase (com try/catch pra não quebrar o app se falhar)
let supabaseClient = null;
let USAR_SUPABASE = false;

// 🛡️ GUARDA CONTRA "ECO" DO PRÓPRIO SALVAMENTO
// Quando este app escreve na nuvem, o Supabase Realtime avisa TODOS os
// aparelhos conectados — inclusive o próprio que acabou de escrever. Se esse
// aviso chegar e disparar uma releitura antes da escrita estar 100% visível
// pra leitura, o app recarrega dados VELHOS e sobrescreve a mudança que a
// pessoa acabou de fazer (ela "volta a não estar marcada" na tela).
// Por isso, depois de CADA escrita, ignoramos por um instante os avisos de
// mudança daquela mesma tabela — o dado local já está correto e mais novo.
const _ecoGuarda = { agendamentos: 0, eventos: 0, config: 0 };
function marcarEscritaLocal(tabela) {
  _ecoGuarda[tabela] = Date.now() + 2500;
}
function ehEcoDaPropriaEscrita(tabela) {
  return Date.now() < _ecoGuarda[tabela];
}

try {
  const temUrl = SUPABASE_URL && SUPABASE_URL !== 'COLE_SUA_URL_AQUI';
  const temKey = SUPABASE_ANON_KEY && SUPABASE_ANON_KEY !== 'COLE_SUA_CHAVE_AQUI';
  
  if (temUrl && temKey && typeof window.supabase !== 'undefined') {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    USAR_SUPABASE = true;
    console.log('✅ Supabase conectado!');
  } else {
    console.log('⚠️ Supabase não configurado - usando localStorage local');
  }
} catch (err) {
  console.error('❌ Erro ao conectar Supabase, usando localStorage:', err);
  supabaseClient = null;
  USAR_SUPABASE = false;
}

// Funciona tanto com Supabase quanto localStorage
// ============================================
const DB = {
  get(key, fallback = null) {
    // Se for dado de cache do Supabase
    if (USAR_SUPABASE && State.cache[key] !== undefined) {
      return State.cache[key];
    }
    // Fallback para localStorage
    try {
      return JSON.parse(localStorage.getItem('deep_' + key)) || fallback;
    } catch {
      return fallback;
    }
  },
  set(key, value) {
    // Atualiza cache local sempre
    if (State.cache[key] !== undefined) {
      State.cache[key] = value;
    }
    // Salva também no localStorage como backup
    try {
      localStorage.setItem('deep_' + key, JSON.stringify(value));
      return true;
    } catch {
      return false;
    }
  }
};

      .from('agendamentos')

async function salvarEventoSupabase(ev) {
  if (!supabaseClient) return null;
  try {
    marcarEscritaLocal('eventos');
    // É edição se o id for um número que JÁ existe no Supabase (id real do banco)
    const ehEdicaoReal = ev.id && typeof ev.id === 'number' && 
                         (State.cache.eventos || []).some(e => e.id === ev.id);
    
    if (ehEdicaoReal) {
      // Atualizar existente
      const { data, error } = await supabaseClient
        .from('eventos')
        .update({
          titulo: ev.titulo,
          icone: ev.icone,
          data: ev.data,
          horario: ev.horario || null,
          local: ev.local || null,
          descricao: ev.descricao || null
        })
        .eq('id', ev.id)
        .select();
      if (error) throw error;
      return data[0];
    } else {
      // Criar novo (NÃO manda o id — deixa o Supabase gerar)
      const { data, error } = await supabaseClient
        .from('eventos')
        .insert([{
          titulo: ev.titulo,
          icone: ev.icone,
          data: ev.data,
          horario: ev.horario || null,
          local: ev.local || null,
          descricao: ev.descricao || null
        }])
        .select();
      if (error) throw error;
      return data[0];
    }
  } catch (err) {
    console.error('Erro ao salvar evento:', err);
    const msgErro = err.message || err.hint || 'erro desconhecido';
    showToast(ehFalhaDeRede(msgErro)
      ? '📶 Sinal fraco agora — vamos tentar de novo em instantes.'
      : '⚠️ Erro: ' + msgErro.substring(0, 60), 'error');
    return null;
  }
}

// FUNÇÕES SUPABASE - CONFIGURAÇÕES
// (datas fechadas, horários travados, notas)
// ============================================
async function carregarConfigSupabase() {
  if (!supabaseClient) return {};
  try {
    const { data, error } = await supabaseClient
      .from('configuracoes')
      .select('*');
    if (error) throw error;
    
    const config = {
      datasFechadas: [],
      horariosTravados: {},
      notasAgendamentos: {},
      aniversariantes: [],
      lembretesEnviados: {},
      inscricoes: {},
      eventosConfig: {},
      pesquisaRetiro: [],
      presencas: [],
      celulaConfig: {},
      muralPosts: [],
      muralReacoes: [],
      bibLivros: [],
      bibPedidos: [],
      lojaProdutos: [],
      lojaPedidos: []
    };
    
    (data || []).forEach(item => {
      // Pesquisa do retiro: UMA chave por resposta (pesquisa_<id>) — ninguém sobrescreve ninguém
      if (item.chave && item.chave.indexOf('pesquisa_') === 0 && item.valor) config.pesquisaRetiro.push(item.valor);
      if (item.chave && item.valor) {
        if (item.chave.indexOf('pres_') === 0) config.presencas.push(item.valor);
        else if (item.chave.indexOf('mural_') === 0) config.muralPosts.push(item.valor);
        else if (item.chave.indexOf('murr_') === 0) config.muralReacoes.push(item.valor);
        else if (item.chave.indexOf('bibp_') === 0) config.bibPedidos.push(item.valor);
        else if (item.chave.indexOf('bib_') === 0) config.bibLivros.push(item.valor);
        else if (item.chave === 'celulaConfig') config.celulaConfig = item.valor;
      }
      if (item.chave === 'datasFechadas') config.datasFechadas = item.valor || [];
      if (item.chave === 'horariosTravados') config.horariosTravados = item.valor || {};
      if (item.chave === 'notasAgendamentos') config.notasAgendamentos = item.valor || {};
      if (item.chave === 'aniversariantes') config.aniversariantes = item.valor || [];
      if (item.chave === 'lembretesEnviados') config.lembretesEnviados = item.valor || {};
      if (item.chave === 'eventosConfig') config.eventosConfig = item.valor || {};
      if (item.chave === 'lojaProdutos') config.lojaProdutos = item.valor || [];
      if (item.chave === 'lojaPedidos') config.lojaPedidos = item.valor || [];
      // Inscrições: chave antiga (tudo junto) + chaves por evento (inscricoes_<id>)
      if (item.chave === 'inscricoes') config.inscricoes = { ...(item.valor || {}), ...config.inscricoes };
      if (item.chave && item.chave.indexOf('inscricoes_') === 0) {
        config.inscricoes[item.chave.slice('inscricoes_'.length)] = item.valor || [];
      }
    });
    
    return config;
  } catch (err) {
    console.error('Erro ao carregar config:', err);
    return {};
  }
}

let _ultimoErroConfig = '';
async function salvarConfigSupabase(chave, valor) {
  if (!supabaseClient) return false;
  try {
    marcarEscritaLocal('config');
    const { error } = await supabaseClient
      .from('configuracoes')
      .upsert({ chave, valor }, { onConflict: 'chave' });
    if (error) throw error;
    return true;
  } catch (err) {
    _ultimoErroConfig = err.message || err.hint || err.details || 'erro desconhecido';
    console.error('Erro ao salvar config:', err);
    return false;
  }
}

// 🔁 Envolve salvarConfigSupabase com fila de repetição automática.
// Se a escrita falhar, a mudança NÃO se perde: fica guardada e o app tenta
// salvar de novo sozinho a cada sincronização. O aviso mostra o motivo REAL
// (ex: permissão negada, coluna errada) — nunca um "sem conexão" genérico
// quando o problema é outro, pra dar pra identificar o que está acontecendo.
// Identifica se o erro é uma falha de REDE (sinal fraco, conexão engasgou)
// em vez de um problema de configuração no Supabase (permissão, coluna, etc).
// Isso evita assustar a pessoa com termos técnicos quando é só instabilidade.
function ehFalhaDeRede(err) {
  const msg = String((err && (err.message || err)) || '');
  return /Failed to fetch|NetworkError|Load failed|network/i.test(msg);
}

async function salvarConfigComRetentativa(chave, valor) {
  if (!USAR_SUPABASE || !supabaseClient) return true; // modo local: já salvou no aparelho
  const ok = await salvarConfigSupabase(chave, valor);
  const pend = DB.get('configPendente', {}) || {};
  if (!ok) {
    pend[chave] = valor;
    DB.set('configPendente', pend);
    const msg = ehFalhaDeRede(_ultimoErroConfig)
      ? '📶 Sinal fraco agora — vamos tentar salvar de novo sozinhos.'
      : '⚠️ Não salvou na nuvem: ' + String(_ultimoErroConfig).substring(0, 80);
    showToast(msg, 'error');
  } else if (pend[chave] !== undefined) {
    delete pend[chave];
    DB.set('configPendente', pend);
  }
  return ok;
}

// Tenta reenviar qualquer alteração de configuração que ficou pendente
// (mesmo padrão já usado pros agendamentos pendentes)
async function reenviarConfigPendente() {
  if (!USAR_SUPABASE || !supabaseClient) return;
  const pend = DB.get('configPendente', {}) || {};
  const chaves = Object.keys(pend);
  if (chaves.length === 0) return;
  let sucesso = 0;
  for (const chave of chaves) {
    const ok = await salvarConfigSupabase(chave, pend[chave]);
    if (ok) { delete pend[chave]; sucesso++; }
  }
  DB.set('configPendente', pend);
  if (sucesso > 0) {
    console.log(`✅ Reenviadas ${sucesso} configuração(ões) pendente(s)`);
    showToast(`✅ ${sucesso} alteração${sucesso > 1 ? 'ões' : ''} pendente${sucesso > 1 ? 's' : ''} salva${sucesso > 1 ? 's' : ''} agora!`, 'success');
    renderSeguro();
  }
}

// ============================================
// SINCRONIZAÇÃO EM TEMPO REAL
// ============================================
let _realtimeReconectando = false;
let _tentativasRealtime = 0;
function tratarStatusCanal(status, nomeCanal) {
  console.log('📡 Canal ' + nomeCanal + ':', status);
  // NÃO mexemos no selo aqui. O tempo real é "bônus"; quem garante a
  // sincronização é o polling de 4s. Soluços de canal no celular são normais
  // e não devem ficar piscando "reconectando" na cara do usuário.
  if (status === 'SUBSCRIBED') {
    _tentativasRealtime = 0; // reconectou, zera o contador
  } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
    tentarReconectarRealtime();
  }
}
function tentarReconectarRealtime() {
  if (_realtimeReconectando || !supabaseClient) return;
  // Limita as tentativas: se o tempo real não colar, tudo bem —
  // o polling de 4s cobre. Evita ficar reconectando em loop.
  if (_tentativasRealtime >= 5) return;
  _tentativasRealtime++;
  _realtimeReconectando = true;
  setTimeout(() => {
    try {
      supabaseClient.removeAllChannels();
      ativarRealtimeSupabase();
      console.log('🔁 Tempo real: tentativa de reconexão ' + _tentativasRealtime);
    } catch (e) {
      console.error('Falha ao reconectar tempo real:', e);
    }
    _realtimeReconectando = false;
  }, 6000);
}

function ativarRealtimeSupabase() {
  if (!supabaseClient) return;
  
  // Escuta mudanças em agendamentos (quando um jovem marca, o líder vê na hora)
  supabaseClient
    .channel('agendamentos-changes')
    .on('postgres_changes', 
      { event: '*', schema: 'public', table: 'agendamentos' }, 
      async (payload) => {
        console.log('🔄 Mudança em agendamentos:', payload.eventType);
        if (ehEcoDaPropriaEscrita('agendamentos')) {
          console.log('  ↳ ignorado: é eco da própria escrita deste aparelho');
          return;
        }
        const antes = new Set((State.cache.agendamentos || []).map(a => a.id));
        State.cache.agendamentos = await carregarAgendamentosSupabase();
        // Se chegou agendamento novo e o líder está logado, avisa
        if (State.adminLogado && payload.eventType === 'INSERT') {
          (State.cache.agendamentos || [])
            .filter(a => !antes.has(a.id))
            .forEach(novoAg => notificarNovoAgendamento(novoAg));
        }
        renderSeguro();
      }
    )
    .subscribe((status) => tratarStatusCanal(status, 'agendamentos'));
  
  // Escuta mudanças em eventos (postagens/eventos do líder aparecem pros jovens)
  supabaseClient
    .channel('eventos-changes')
    .on('postgres_changes', 
      { event: '*', schema: 'public', table: 'eventos' }, 
      async () => {
        console.log('🔄 Mudança em eventos');
        if (ehEcoDaPropriaEscrita('eventos')) {
          console.log('  ↳ ignorado: é eco da própria escrita deste aparelho');
          return;
        }
        State.cache.eventos = await carregarEventosSupabase();
        renderSeguro();
      }
    )
    .subscribe((status) => tratarStatusCanal(status, 'eventos'));
  
  // Escuta mudanças em configurações
  // (datas fechadas, horários travados, aniversariantes, notas, lembretes)
  supabaseClient
    .channel('config-changes')
    .on('postgres_changes', 
      { event: '*', schema: 'public', table: 'configuracoes' }, 
      async () => {
        console.log('🔄 Mudança em configurações');
        if (ehEcoDaPropriaEscrita('config')) {
          console.log('  ↳ ignorado: é eco da própria escrita deste aparelho');
          return;
        }
        const config = await carregarConfigSupabase();
        aplicarConfigNoCache(config);
        renderSeguro();
      }
    )
    .subscribe((status) => tratarStatusCanal(status, 'configurações'));
  
  console.log('🔴 Tempo real ativado!');
}

// ============================================
// REENVIO AUTOMÁTICO DE AGENDAMENTOS PENDENTES
// Se um jovem marcou sem internet, isto reenvia pra nuvem
// assim que a conexão voltar — assim o líder sempre recebe.
// ============================================
async function reenviarAgendamentosPendentes() {
  if (!USAR_SUPABASE || !supabaseClient) return;
  const fila = DB.get('agendamentosPendentes', []) || [];
  if (fila.length === 0) return;
  
  const aindaPendentes = [];
  for (const ag of fila) {
    const saved = await salvarAgendamentoSupabase(ag);
    if (saved) {
      // Conseguiu enviar: atualiza o cache local
      if (!State.cache.agendamentos) State.cache.agendamentos = [];
      if (!State.cache.agendamentos.some(a => a.id === saved.id)) {
        State.cache.agendamentos.push(saved);
      }
    } else {
      // Ainda não foi: mantém na fila pra tentar de novo depois
      aindaPendentes.push(ag);
    }
  }
  DB.set('agendamentosPendentes', aindaPendentes);
  if (aindaPendentes.length < fila.length) {
    console.log(`✅ Reenviados ${fila.length - aindaPendentes.length} agendamento(s) pendente(s)`);
    renderSeguro();
  }
}

function calcularIdade(dataNascimento) {
  if (!dataNascimento) return 0;
  const hoje = new Date();
  const nasc = new Date(dataNascimento + 'T00:00:00');
  let idade = hoje.getFullYear() - nasc.getFullYear();
  const mes = hoje.getMonth() - nasc.getMonth();
  if (mes < 0 || (mes === 0 && hoje.getDate() < nasc.getDate())) idade--;
  return idade;
}

function formatarData(dataStr, opts = {}) {
  if (!dataStr) return '';
  const dt = new Date(dataStr + 'T00:00:00');
  return dt.toLocaleDateString('pt-BR', opts);
}

function formatarDataNascimento(dataStr) {
  return formatarData(dataStr);
}

function formatDateShort(dateStr) {
  return formatarData(dateStr, { day: 'numeric', month: 'short' });
}

function formatDateFull(dateStr) {
  return formatarData(dateStr, { weekday: 'long', day: 'numeric', month: 'long' });
}

function formatMonth(d) {
  const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
                 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
  return `${meses[d.getMonth()]} ${d.getFullYear()}`;
}

// Pega versículo aleatório que mude TODO DIA
function getVersiculoDoDia() {
  const hoje = new Date();
  const diaDoAno = Math.floor((hoje - new Date(hoje.getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
  // Combina dia do ano + ano pra variar entre anos
  const indice = (diaDoAno + hoje.getFullYear()) % VERSICULOS_CORACAO.length;
  return VERSICULOS_CORACAO[indice];
}

// Pega versículo aleatório por contexto (mensagem específica)
function getVersiculoAleatorio(seed = null) {
  if (seed) {
    // Usa seed pra ter consistência por agendamento
    const idx = Math.abs(seed.toString().split('').reduce((acc, c) => acc + c.charCodeAt(0), 0)) % VERSICULOS_CORACAO.length;
    return VERSICULOS_CORACAO[idx];
  }
  const idx = Math.floor(Math.random() * VERSICULOS_CORACAO.length);
  return VERSICULOS_CORACAO[idx];
}

function formatarVersiculo(v) {
  return `_"${v.texto}"_\n*${v.ref}* 🙏`;
}

// Data do pedido em formato amigável ("hoje", "ontem", "12 de junho")
function formatarDataPedido(iso) {
  if (!iso) return '';
  try {
    const d = new Date(iso);
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const dia = new Date(d); dia.setHours(0,0,0,0);
    const diff = Math.round((hoje - dia) / 86400000);
    const hora = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    if (diff === 0) return `Hoje · ${hora}`;
    if (diff === 1) return `Ontem · ${hora}`;
    return d.toLocaleDateString('pt-BR', { day: 'numeric', month: 'long' }) + ` · ${hora}`;
  } catch (e) { return ''; }
}

// Copia texto pra área de transferência. Usa a API moderna se possível e cai
// pro método antigo (textarea+execCommand) quando o navegador bloqueia
// — assim funciona em qualquer celular, instalado ou no navegador.
// Transforma "JOGO DO BRASIL 🇧🇷" em "jogo-do-brasil" (slug bonito pra URL)
// ============================================
// 🎵 MÚSICA DE PARABÉNS (gerada pelo app, sem arquivo)
// Toca ao abrir o detalhe do aniversariante. Para ao fechar.
// ============================================
let _audioCtx = null;
let _musicaTimeouts = [];
let _musicaTocando = false;
// Toca uma nota com "corpo": voz principal + reforço uma oitava abaixo
// (sempre soa bem junto, sem risco de dissonância) + vibrato nas notas longas
function _tocarNotaFesta(freq, inicioSeg, durSeg, opts = {}) {
  const { volume = 0.16, vibrato = false } = opts;
  const id = setTimeout(() => {
    if (!_musicaTocando || !_audioCtx) return;
    try {
      const agora = _audioCtx.currentTime;
      // Voz principal (melodia)
      const osc = _audioCtx.createOscillator();
      const gain = _audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      if (vibrato) {
        const lfo = _audioCtx.createOscillator();
        const lfoGain = _audioCtx.createGain();
        lfo.frequency.value = 5.5;
        lfoGain.gain.value = 4;
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);
        lfo.start(agora);
        lfo.stop(agora + durSeg);
      }
      gain.gain.setValueAtTime(0.0001, agora);
      gain.gain.exponentialRampToValueAtTime(volume, agora + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, agora + durSeg * 0.95);
      osc.connect(gain);
      gain.connect(_audioCtx.destination);
      osc.start(agora);
      osc.stop(agora + durSeg);

      // Reforço grave (uma oitava abaixo) — dá "corpo" de caixinha de música
      const osc2 = _audioCtx.createOscillator();
      const gain2 = _audioCtx.createGain();
      osc2.type = 'sine';
      osc2.frequency.value = freq / 2;
      gain2.gain.setValueAtTime(0.0001, agora);
      gain2.gain.exponentialRampToValueAtTime(volume * 0.55, agora + 0.03);
      gain2.gain.exponentialRampToValueAtTime(0.0001, agora + durSeg * 0.95);
      osc2.connect(gain2);
      gain2.connect(_audioCtx.destination);
      osc2.start(agora);
      osc2.stop(agora + durSeg);
    } catch (e) { /* nota falhou: ignora e segue */ }
  }, inicioSeg * 1000);
  _musicaTimeouts.push(id);
}

function tocarParabens() {
  try {
    pararMusica(); // garante que não toca duas ao mesmo tempo
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return; // navegador sem suporte: segue sem música
    if (!_audioCtx) _audioCtx = new AC();
    if (_audioCtx.state === 'suspended') _audioCtx.resume();
    
    // "Parabéns pra Você" — a melodia tradicional cantada nas festas
    // brasileiras (mesma que a Xuxa popularizou na TV). Não reproduzimos a
    // gravação dela — é protegida por direitos autorais — então tocamos essa
    // melodia com uma arranjo mais cheio (harmonia + vibrato + floreio final).
    const G4=392.00, A4=440.00, B4=493.88, C5=523.25, D5=587.33, E5=659.25, F5=698.46, G5=783.99, A5=880.00;
    const melodia = [
      [G4,.7],[G4,.3],[A4,1],[G4,1],[C5,1],[B4,1.8,true],
      [G4,.7],[G4,.3],[A4,1],[G4,1],[D5,1],[C5,1.8,true],
      [G4,.7],[G4,.3],[G5,1],[E5,1],[C5,1],[B4,1],[A4,1.8,true],
      [F5,.7],[F5,.3],[E5,1],[C5,1],[D5,1],[C5,2.4,true]
    ];
    const BATIDA = 0.4; // segundos por batida (andamento animado, tipo festa)
    _musicaTocando = true;
    let t = 0;
    melodia.forEach(([freq, dur, comVibrato]) => {
      const durSeg = dur * BATIDA;
      _tocarNotaFesta(freq, t, durSeg, { vibrato: !!comVibrato });
      t += durSeg;
    });
    // 🎉 Floreio festivo no final — uma escaladinha animada tipo "tcharam!"
    const floreio = [C5, D5, E5, G5, A5];
    floreio.forEach((freq, i) => {
      _tocarNotaFesta(freq, t + i * 0.09, 0.13, { volume: 0.13 });
    });
    t += floreio.length * 0.09 + 0.35;
    // Marca o fim da música
    const fim = setTimeout(() => { _musicaTocando = false; }, t * 1000 + 200);
    _musicaTimeouts.push(fim);
  } catch (e) {
    console.warn('Música indisponível:', e);
  }
}

function pararMusica() {
  _musicaTocando = false;
  _musicaTimeouts.forEach(id => clearTimeout(id));
  _musicaTimeouts = [];
}

function slugificar(texto) {
  return String(texto || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // tira acento
    .replace(/[^\w\s-]/g, '')   // remove emojis, pontuação
    .trim().toLowerCase()
    .replace(/\s+/g, '-')       // espaços viram hífens
    .replace(/-+/g, '-')        // hífens duplicados
    .substring(0, 40);          // tamanho razoável
}

async function copiarTexto(texto) {
  if (!texto) return false;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(texto);
      return true;
    }
  } catch (err) { /* tenta fallback abaixo */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = texto;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (err) { return false; }
}

// Garante que o link do Pix abre direito (se faltar https://, coloca)
function normalizarUrl(url) {
  if (!url) return '';
  const t = String(url).trim();
  if (!t) return '';
  if (/^https?:\/\//i.test(t)) return t;
  if (/^[a-z][a-z0-9+.-]*:/i.test(t)) return t; // outros esquemas (mailto:, pix:, etc.)
  return 'https://' + t;
}

// Formata o valor do Pix de forma bonita: "50" vira "R$ 50,00"
function formatarValorPix(valor) {
  if (!valor) return '';
  const v = String(valor).trim();
  if (!v) return '';
  // Já tem R$, "reais" ou letras? Devolve como o líder digitou
  if (/r\$|reais|[a-z]/i.test(v)) return v;
  // Puramente numérico (vírgula/ponto): formata bonito
  const num = parseFloat(v.replace(/\./g, '').replace(',', '.'));
  if (!isNaN(num)) {
    return 'R$ ' + num.toFixed(2).replace('.', ',');
  }
  return v;
}

// Comprime/redimensiona uma imagem (foto de comprovante, QR Code)
// pra não pesar no armazenamento. Retorna um data URL JPEG.
function comprimirImagem(file, maxLado = 1000, qualidade = 0.6) {  return new Promise((resolve, reject) => {
    if (!file || !String(file.type).startsWith('image/')) { reject(new Error('Arquivo não é imagem')); return; }
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w >= h && w > maxLado) { h = Math.round(h * maxLado / w); w = maxLado; }
        else if (h > w && h > maxLado) { w = Math.round(w * maxLado / h); h = maxLado; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', qualidade));
      };
      img.onerror = () => reject(new Error('Falha ao ler imagem'));
      img.src = ev.target.result;
    };
    reader.onerror = () => reject(new Error('Falha ao abrir arquivo'));
    reader.readAsDataURL(file);
  });
}

function formatarMoeda(v) {
  const n = parseFloat(v) || 0;
  return 'R$ ' + n.toFixed(2).replace('.', ',');
}
// Soma só as parcelas já APROVADAS pelo líder (é o que realmente "conta" como pago)
function lojaValorPago(pedido) {
  return (pedido.parcelas || [])
    .filter(p => p.status === 'aprovado')
    .reduce((s, p) => s + (parseFloat(p.valor) || 0), 0);
}
function lojaTemParcelaPendente(pedido) {
  return (pedido.parcelas || []).some(p => p.status === 'pendente');
}
function lojaPercentualPago(pedido) {
  const total = parseFloat(pedido.precoProduto) || 0;
  if (!total) return 0;
  return Math.min(100, Math.round((lojaValorPago(pedido) / total) * 100));
}
function lojaValorRestante(pedido) {
  const total = parseFloat(pedido.precoProduto) || 0;
  const restante = total - lojaValorPago(pedido);
  return restante > 0 ? restante : 0;
}
function lojaStatusTexto(pedido) {
  if (pedido.status === 'cancelado') return 'Cancelado';
  if (pedido.formaPagamento === 'cartao') {
    return pedido.status === 'pago' ? 'Pago na igreja ✅' : 'Aguardando pagamento na igreja';
  }
  if (lojaValorRestante(pedido) <= 0) return 'Pago 100% ✅';
  if (lojaTemParcelaPendente(pedido)) return `${lojaPercentualPago(pedido)}% pago · tem parcela aguardando aprovação`;
  return `${lojaPercentualPago(pedido)}% pago · falta ${formatarMoeda(lojaValorRestante(pedido))}`;
}
// Data da última movimentação do pedido (última parcela enviada, ou a criação, se nenhuma)
function lojaUltimaAtividade(pedido) {
  const parcelas = pedido.parcelas || [];
  if (parcelas.length === 0) return pedido.criado_em;
  return parcelas.reduce((maisRecente, p) => (p.data > maisRecente ? p.data : maisRecente), parcelas[0].data);
}
function lojaDiasParado(pedido) {
  const data = lojaUltimaAtividade(pedido);
  if (!data) return 0;
  const diffMs = Date.now() - new Date(data).getTime();
  return Math.floor(diffMs / (1000 * 60 * 60 * 24));
}
// ⏰ "Parado" = ninguém mexeu no pedido há muitos dias E ainda falta pagar
// (não conta pedidos com parcela aguardando aprovação — aí quem está devendo resposta é o líder, não o jovem)
const LOJA_DIAS_LIMITE_PARADO = 5;
function lojaEstaParado(pedido) {
  if (pedido.status === 'pago' || pedido.status === 'cancelado') return false;
  if (lojaTemParcelaPendente(pedido)) return false;
  return lojaDiasParado(pedido) >= LOJA_DIAS_LIMITE_PARADO;
}
// 🔐 Exige nome + WhatsApp (não só o telefone) pra ver os pedidos — dificulta
// que alguém digite um número aleatório e veja os pedidos de outra pessoa.
function getMeusPedidosLoja() {
  const fone = (State.lojaCompradorTel || '').replace(/\D/g, '');
  const nome = (State.lojaCompradorNomeConsulta || '').trim().toLowerCase();

  );
}

function getAniversariantesDoMes(mes = null) {
  const lista = getAniversariantes();
  const mesAtual = mes !== null ? mes : new Date().getMonth() + 1; // 1-12
  return lista
    .filter(a => {
      const [, m] = a.data_nascimento.split('-');
      return parseInt(m) === mesAtual;
    })
    .sort((a, b) => {
      const [, , diaA] = a.data_nascimento.split('-');
      const [, , diaB] = b.data_nascimento.split('-');
      return parseInt(diaA) - parseInt(diaB);
    });
}

function getAniversariantesDoDia() {
  const lista = getAniversariantes();
  const hoje = new Date();
  const mesHoje = hoje.getMonth() + 1;
  const diaHoje = hoje.getDate();
  return lista.filter(a => {
    const [, m, d] = a.data_nascimento.split('-');
    return parseInt(m) === mesHoje && parseInt(d) === diaHoje;
  });
}

function formatarDataAniversario(dataStr) {
  // dataStr = '2005-03-15'
  const [, m, d] = dataStr.split('-');
  const meses = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
  return `${parseInt(d)} de ${meses[parseInt(m) - 1]}`;
}

function calcularIdadeAniversario(dataNasc) {
  const hoje = new Date();
  const nasc = new Date(dataNasc + 'T00:00:00');
  let idade = hoje.getFullYear() - nasc.getFullYear();
  const mesAtual = hoje.getMonth();
  const mesNasc = nasc.getMonth();
  if (mesAtual < mesNasc || (mesAtual === mesNasc && hoje.getDate() < nasc.getDate())) {
    idade--;
  }
  return idade;
}

function diasParaAniversario(dataNasc) {
  const hoje = new Date();
  hoje.setHours(0, 0, 0, 0);
  const [, m, d] = dataNasc.split('-');
  const proximoAniv = new Date(hoje.getFullYear(), parseInt(m) - 1, parseInt(d));
  if (proximoAniv < hoje) {
    proximoAniv.setFullYear(hoje.getFullYear() + 1);
  }
  return Math.round((proximoAniv - hoje) / (1000 * 60 * 60 * 24));
}

function diasParaData(dataStr) {
  const hoje = new Date();
  hoje.setHours(0, 0, 0, 0);
  const target = new Date(dataStr + 'T00:00:00');
  const diff = Math.ceil((target - hoje) / (1000 * 60 * 60 * 24));
  return diff;
}

function diaSemana(dataStr) {
  // 0 = domingo, 1-5 = segunda a sexta, 6 = sábado
  const dt = new Date(dataStr + 'T00:00:00');
  return dt.getDay();
}

function ehDiaSemana(dataStr) {
  const ds = diaSemana(dataStr);
  return ds >= 1 && ds <= 5;
}

// Evita que um jovem marque um horário de HOJE que já passou (ex: agendar 14h sendo 20h)
function horarioJaPassouHoje(dataStr, horaStr) {
  const agora = new Date();
  const hojeStr = `${agora.getFullYear()}-${String(agora.getMonth() + 1).padStart(2, '0')}-${String(agora.getDate()).padStart(2, '0')}`;
  if (dataStr !== hojeStr) return false;
  const [h, m] = (horaStr || '').split(':').map(Number);
  if (isNaN(h) || isNaN(m)) return false;
  const minutosAgora = agora.getHours() * 60 + agora.getMinutes();
  const minutosSlot = h * 60 + m;
  // Dá uma margem de 30min: não faz sentido marcar pra "daqui 5 minutos"
  return minutosSlot <= minutosAgora + 30;
}

function getHorariosDisponiveisPorData(dataStr) {
  // Se for dia de semana (seg-sex), só horários >= 19h
  if (ehDiaSemana(dataStr)) {
    return HORARIOS_SEMANA;
  }
  // Sábado e domingo: todos os horários
  return HORARIOS_FIXOS;
}

// Quantos horários livres uma data tem para o líder escolhido (usado na lista de datas do jovem)
function getResumoDisponibilidadeData(dataStr, liderEscolhido) {
  const agendamentos = DB.get('agendamentos', []) || [];
  const horariosTravados = DB.get('horariosTravados', {}) || {};
  const travadosEl = horariosTravados[`eltinho_${dataStr}`] || [];
  const travadosDy = horariosTravados[`dayana_${dataStr}`] || [];
  const travGer = horariosTravados[dataStr] || [];

  const horarios = getHorariosDisponiveisPorData(dataStr);
  const livres = horarios.filter(h => {
    if (horarioJaPassouHoje(dataStr, h)) return false; // não oferece horário de hoje que já passou
    const ags = agendamentos.filter(a =>
      a.data_agendada === dataStr && a.hora_agendada === h && a.status !== 'cancelado'
    );
    if (liderEscolhido === 'eltinho') {
      return !ags.some(a => a.com_quem === 'eltinho' || a.com_quem === 'os_dois') &&
             !travadosEl.includes(h) && !travGer.includes(h);
    }
    if (liderEscolhido === 'dayana') {
      return !ags.some(a => a.com_quem === 'dayana' || a.com_quem === 'os_dois') &&
             !travadosDy.includes(h) && !travGer.includes(h);
    }
    if (liderEscolhido === 'os_dois') {
      const eltOc = ags.some(a => a.com_quem === 'eltinho' || a.com_quem === 'os_dois');
      const dayOc = ags.some(a => a.com_quem === 'dayana' || a.com_quem === 'os_dois');
      return !eltOc && !dayOc && !travadosEl.includes(h) && !travadosDy.includes(h) && !travGer.includes(h);
    }
    return false;
  });
  return { qtd: livres.length, proximo: livres[0] || null };
}

// Monta a lista de próximas datas com pelo menos 1 horário livre (sem calendário — só a lista)
function getProximasDatasDisponiveis(liderEscolhido, maxDatas = 16, horizonteDias = 60) {
  const datasFechadas = DB.get('datasFechadas', []) || [];
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const lista = [];

  for (let i = 0; i < horizonteDias && lista.length < maxDatas; i++) {
    const dia = new Date(hoje); dia.setDate(dia.getDate() + i);
    const y = dia.getFullYear(), m = dia.getMonth(), d = dia.getDate();
    const ds = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    if (datasFechadas.includes(ds)) continue;
    const { qtd, proximo } = getResumoDisponibilidadeData(ds, liderEscolhido);
    if (qtd > 0) lista.push({ data: ds, qtd, proximo, isHoje: i === 0, isAmanha: i === 1 });
  }
  return lista;
}

// Retorna info detalhada de ocupação para um horário
function getOcupacaoHorario(dataStr, horario, agendamentos) {
  const ags = agendamentos.filter(a => 
    a.data_agendada === dataStr && 
    a.hora_agendada === horario && 
    a.status !== 'cancelado'
  );
  
  const eltinho = ags.find(a => a.com_quem === 'eltinho' || a.com_quem === 'os_dois');
  const dayana = ags.find(a => a.com_quem === 'dayana' || a.com_quem === 'os_dois');
  
  return {
    eltinho: eltinho || null,
    dayana: dayana || null,
    duplo: eltinho && eltinho.com_quem === 'os_dois',
    livre: !eltinho && !dayana
  };
}

// Verifica se agendamento já passou (precisa de status)
function agendamentoJaPassou(ag) {
  const dt = new Date(ag.data_agendada + 'T' + ag.hora_agendada + ':00');
  return dt < new Date();
}

// Bolinhas dos carrosséis acompanham o deslize
document.addEventListener('scroll', e => {
  const el = e.target;
  if (!el || !el.classList || !el.classList.contains('carrossel')) return;
  const id = el.getAttribute('data-dots');
  if (!id) return;
  const dots = document.querySelector('.car-dots[data-dots-for="' + id + '"]');
  if (!dots || !el.children.length) return;
  const passo = el.children[0].getBoundingClientRect().width + 12;
  const idx = Math.min(el.children.length - 1, Math.max(0, Math.round(el.scrollLeft / passo)));
  dots.querySelectorAll('i').forEach((d, i) => d.classList.toggle('on', i === idx));
}, true);

      ligarUploadComprovante();
      ligarUploadLojaComprovante();

    }
    
    _ultimaAssinatura = assinaturaDados();
    
    if (keepScroll) window.scrollTo(0, scrollY);
    else window.scrollTo(0, 0);
  } catch (err) {
    console.error('Erro no render:', err);
  }
}

// RE-RENDERIZAÇÃO SEGURA (para sincronização automática)
// - Só repinta quando os dados realmente mudaram (rápido, sem piscar)
// - Nunca apaga o que a pessoa está digitando agora
// ============================================
function usuarioDigitando() {
  const el = document.activeElement;
  if (!el) return false;
  const tag = (el.tagName || '').toUpperCase();
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable === true;
}

function renderSeguro(forcar = false) {
  const sig = assinaturaDados();
  // Nada mudou? Não faz nada (app rápido, sem flicker)
  if (!forcar && sig === _ultimaAssinatura) return;
  // Pessoa digitando? Espera — vai repintar no próximo ciclo
  if (usuarioDigitando()) return;
  render(true);
}

let _syncBadgeEl = null;

  b.id = 'sync-badge';
  b.style.cssText = [
    'position:fixed','bottom:14px','right:14px','z-index:9999',

    'user-select:none','transition:opacity .3s,transform .15s'
  ].join(';');

function setSyncStatus(estado) {
  if (!_syncBadgeEl) return;
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-text');
  if (!dot || !txt) return;
  if (estado === 'ok') {

    txt.textContent = 'Sincronizado';

    dot.style.background = '#ffc83d'; dot.style.boxShadow = '0 0 8px #ffc83d';
    txt.textContent = 'Sincronizando…';
    _syncBadgeEl.style.opacity = '1';
  } else { // reconectando / erro
    dot.style.background = '#ff5a5a'; dot.style.boxShadow = '0 0 8px #ff5a5a';
    txt.textContent = 'Reconectando…';
    _syncBadgeEl.style.opacity = '1';

}

// ============================================
// SINCRONIZAÇÃO CENTRAL — puxa TUDO da nuvem
// Usada pelo ciclo automático, ao voltar pro app, ao reconectar
// e ao tocar no selo. Garante que todos veem tudo.
// ============================================
let _sincronizando = false;
let _falhasSeguidas = 0;
async function sincronizarAgora(silencioso = true) {
  if (!USAR_SUPABASE || !supabaseClient) return;
  if (_sincronizando) return; // evita sobreposição
  _sincronizando = true;
  if (!silencioso) setSyncStatus('sincronizando');
  try {
    // 1) Reenvia o que ficou pendente (jovem/líder sem internet no momento)
    await reenviarAgendamentosPendentes();
    await reenviarConfigPendente();
    
    // 2) Puxa tudo de uma vez
    const idsAntes = new Set((State.cache.agendamentos || []).map(a => a.id));
    const [ags, evs, cfg] = await Promise.all([
      carregarAgendamentosSupabase(),
      carregarEventosSupabase(),
      carregarConfigSupabase()
    ]);
    // Só aplica cada pedaço se este aparelho NÃO acabou de escrever nele, E
    // se não há nada de config ainda pendente de confirmar — assim uma
    // sincronização em segundo plano nunca sobrescreve uma mudança que a
    // pessoa acabou de fazer na tela (evita o "volta a não estar marcado").
    let agendamentosAtualizados = false;
    if (!ehEcoDaPropriaEscrita('agendamentos')) {
      State.cache.agendamentos = ags;
      agendamentosAtualizados = true;
    }
    if (!ehEcoDaPropriaEscrita('eventos')) {
      State.cache.eventos = evs;
    }
    const temConfigPendente = Object.keys(DB.get('configPendente', {}) || {}).length > 0;
    if (!ehEcoDaPropriaEscrita('config') && !temConfigPendente) {
      aplicarConfigNoCache(cfg);
    }
    
    // 3) Avisa o líder logado de agendamentos novos
    if (State.adminLogado && agendamentosAtualizados) {
      ags.filter(a => !idsAntes.has(a.id)).forEach(n => notificarNovoAgendamento(n));
    }
    
    // Deu certo: zera falhas e marca como sincronizado
    _falhasSeguidas = 0;
    setSyncStatus('ok');
    renderSeguro();
  } catch (err) {
    // Uma falha isolada NÃO muda o selo (soluço de rede é normal).
    // Só mostra "reconectando" após 3 falhas seguidas (~12s sem sincronizar).
    _falhasSeguidas++;
    console.warn('Sync falhou (' + _falhasSeguidas + ')');
    if (_falhasSeguidas >= 3) setSyncStatus('reconectando');
  } finally {
    _sincronizando = false;
  }
}

// ============================================
// 🛂 PASSAPORTE DEEP + PRESENÇA NA CÉLULA
// Uma chave por presença (pres_<data>_<pessoa>) — ninguém sobrescreve ninguém
// ============================================
const PASS_DIAS = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const PASS_PONTOS_PRESENCA = 10;
const PASS_PONTOS_AMIGO = 20;
const PASS_DIAS_SUMIU = 21;

function isoLocal(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function passDiasEpoca(iso) { const p = String(iso).split('-').map(Number); return Math.round(Date.UTC(p[0], p[1] - 1, p[2]) / 86400000); }
function passSemana(iso) { return Math.floor((passDiasEpoca(iso) + 3) / 7); } // semana começa na segunda
function passSlug(nome) { return String(nome || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '').slice(0, 30); }
function passDataCurta(iso) { const p = String(iso).split('-'); return p[2] + '/' + p[1]; }

function getCelulaConfig() {
  const c = DB.get('celulaConfig', null) || {};
  return {
    dia: c.dia === undefined || c.dia === null ? 3 : Number(c.dia),
    hora: c.hora !== undefined ? c.hora : '19h30',
    local: c.local !== undefined ? c.local : 'Piso L1 · Shopping Praia da Costa, loja Pitico',
    tema: c.tema || ''
  };
}
// Data da próxima célula (hoje, se hoje for o dia da célula)
function celulaDataSemana() {
  const cfg = getCelulaConfig();
  const d = new Date();
  const falta = (cfg.dia - d.getDay() + 7) % 7;
  d.setDate(d.getDate() + falta);
  return isoLocal(d);
}
function ehDiaDaCelula() { return new Date().getDay() === getCelulaConfig().dia; }

function codigoDoDia(iso) {
  let h = 7;
  const s = 'DEEP-' + iso;
  for (let i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i) * (i + 3)) >>> 0;
  const al = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = '';
  for (let i = 0; i < 4; i++) { out += al[h % al.length]; h = Math.floor(h / al.length) + (h % 7) * 977; }
  return out;
}

function getPerfilJovem() { try { return JSON.parse(localStorage.getItem('deep_jovemPerfil')) || null; } catch (e) { return null; } }
function setPerfilJovem(p) { try { if (p) localStorage.setItem('deep_jovemPerfil', JSON.stringify(p)); else localStorage.removeItem('deep_jovemPerfil'); } catch (e) {} }
function getPresencas() { return DB.get('presencas', []) || []; }

function salvarPresenca(rec) {
  const lista = getPresencas().filter(p => p.id !== rec.id);
  lista.push(rec);
  DB.set('presencas', lista);
  return salvarConfigComRetentativa('pres_' + rec.id, rec);
}
function presencaDe(pid, iso) { return getPresencas().find(p => p.id === iso + '_' + pid) || null; }

function statsPessoa(pid) {
  const regs = getPresencas().filter(p => p.pid === pid && p.presente);
  const semanas = new Set(regs.map(r => passSemana(r.data)));
  const hoje = isoLocal();
  let cw = passSemana(hoje);
  if (!semanas.has(cw)) cw -= 1;
  let seq = 0;
  while (semanas.has(cw)) { seq++; cw--; }
  const ord = Array.from(semanas).sort((a, b) => a - b);
  let melhor = 0, atual = 0, ant = null;
  ord.forEach(w => { atual = (ant !== null && w === ant + 1) ? atual + 1 : 1; ant = w; if (atual > melhor) melhor = atual; });
  const amigos = regs.reduce((a, r) => a + (Number(r.amigo) || 0), 0);
  const ultima = regs.map(r => r.data).sort().pop() || null;
  const primeira = regs.map(r => r.data).sort()[0] || null;
  return { total: regs.length, seq, melhor, amigos, ultima, primeira, semanas, pontos: regs.length * PASS_PONTOS_PRESENCA + amigos * PASS_PONTOS_AMIGO };
}

function selosPessoa(st, pid) {
  return [
    { ico: '🌱', t: 'Primeira vez', d: 'Vir a 1 célula', ok: st.total >= 1 },
    { ico: '🔥', t: 'Fiel', d: '4 semanas seguidas', ok: st.melhor >= 4 },
    { ico: '🏆', t: 'Veterano', d: '10 presenças', ok: st.total >= 10 },
    { ico: '🤝', t: 'Amigo trazido', d: 'Levar 1 amigo', ok: st.amigos >= 1 },
    { ico: '📝', t: 'Voz do retiro', d: 'Responder a pesquisa', ok: pesquisaJaRespondida() },
    { ico: '💬', t: 'Voz do DEEP', d: 'Postar no mural', ok: (DB.get('muralPosts', []) || []).some(m => m.pid === pid && !m.apagado) },
    { ico: '📚', t: 'Leitor DEEP', d: 'Ler um livro da biblioteca', ok: leitorDeLivro(pid) }
  ];
}

function totaisDeTodos() {
  const regs = getPresencas().filter(r => r.presente);
  return { presencas: regs.length, amigos: regs.reduce((a, r) => a + (Number(r.amigo) || 0), 0) };
}

// ---------- CARD "ESTA SEMANA" (home) ----------
function renderEstaSemana() {
  const cfg = getCelulaConfig();
  const iso = celulaDataSemana();
  const hoje = ehDiaDaCelula();
  const perfil = getPerfilJovem();
  const pid = perfil ? passSlug(perfil.nome) : '';
  const meu = pid ? presencaDe(pid, iso) : null;
  const jaEstou = !!(meu && meu.presente);
  const vou = !!(meu && meu.confirmou);
  const conf = getPresencas().filter(p => p.data === iso && (p.confirmou || p.presente)).length;
  const diaNome = PASS_DIAS[cfg.dia];
  const quando = hoje ? 'HOJE' : diaNome.toUpperCase() + ', ' + passDataCurta(iso);
  const st = pid ? statsPessoa(pid) : null;
  let botao;
  if (jaEstou) botao = `<div class="sem-ok">✅ Presença marcada! Valeu por vir 🧡</div>`;
  else if (hoje) botao = `<button class="btn btn-primary btn-grande w-full" data-action="abrir-checkin">📍 Estou aqui!</button>`;
  else if (vou) botao = `<div class="sem-ok">✅ Você vai! Te esperamos 🧡 <button class="sem-link" data-action="cancelar-confirmacao">cancelar</button></div>`;
  else botao = `<button class="btn btn-primary btn-grande w-full" data-action="confirmar-celula">🙋 Vou na ${diaNome}!</button>`;
  return `
    <div class="section sem-wrap">
      <div class="sem-card">
        <div class="sem-top"><span class="sem-quando">${quando}</span>${cfg.hora ? `<span class="sem-hora">${escapeHtml(cfg.hora)}</span>` : ''}</div>
        <h3 class="sem-titulo">Célula DEEP</h3>
        ${cfg.tema ? `<p class="sem-tema">${escapeHtml(cfg.tema)}</p>` : `<p class="sem-tema">Leve um amigo. Aqui o clima é leve e todo mundo é bem-vindo.</p>`}
        ${cfg.local ? `<p class="sem-local">📍 ${escapeHtml(cfg.local)} <a class="sem-mapa" href="https://www.google.com/maps/search/?api=1&query=Shopping+Praia+da+Costa+Vila+Velha" target="_blank" rel="noopener">abrir no mapa</a></p>` : ''}
        ${conf > 0 ? `<p class="sem-conf">🙌 ${conf} ${conf === 1 ? 'pessoa confirmada' : 'pessoas confirmadas'}</p>` : ''}

async function passConfirmar() {

// ============================================
// 💬 MURAL DO DEEP — uma chave por post (mural_<id>) e uma por reação (murr_<post>_<pessoa>)
// ============================================
const MURAL_EMOJIS = ['🔥', '❤️', '🙌'];
function getMuralPosts(incluirOcultos) {
  return (DB.get('muralPosts', []) || []).filter(p => !p.apagado && (incluirOcultos || !p.oculto)).sort((a, b) => String(b.ts).localeCompare(String(a.ts)));
}
function getMuralReacoes() { return (DB.get('muralReacoes', []) || []).filter(r => !r.rem); }
function reacoesDoPost(id) {
  const c = {}; MURAL_EMOJIS.forEach(e => c[e] = 0);
  getMuralReacoes().filter(r => r.post === id).forEach(r => { if (c[r.emoji] !== undefined) c[r.emoji]++; });
  return c;
}
function totalReacoes(id) { return getMuralReacoes().filter(r => r.post === id).length; }
function tempoRelativo(iso) {
  const d = String(iso).slice(0, 10), h = isoLocal();
  const dif = passDiasEpoca(h) - passDiasEpoca(d);
  if (dif <= 0) return 'hoje'; if (dif === 1) return 'ontem'; if (dif < 7) return 'há ' + dif + ' dias';
  return passDataCurta(d);
}
function destaqueDaSemana() {
  const lim = passDiasEpoca(isoLocal()) - 7;
  const cand = getMuralPosts().filter(p => passDiasEpoca(String(p.ts).slice(0, 10)) >= lim);
  let melhor = null, mt = 0;
  cand.forEach(p => { const t = totalReacoes(p.id); if (t > mt) { mt = t; melhor = p; } });
  return melhor;
}
function salvarMuralPost(p) {
  const l = (DB.get('muralPosts', []) || []).filter(x => x.id !== p.id); l.push(p); DB.set('muralPosts', l);
  return salvarConfigComRetentativa('mural_' + p.id, p);
}
function salvarMuralReacao(r) {
  const l = (DB.get('muralReacoes', []) || []).filter(x => x.id !== r.id); l.push(r); DB.set('muralReacoes', l);
  return salvarConfigComRetentativa('murr_' + r.id, r);
}

function renderMuralPost(p, pidEu, admin) {
  const rc = reacoesDoPost(p.id);
  const minha = getMuralReacoes().find(r => r.post === p.id && r.pid === pidEu);
  const eu = p.pid === pidEu;
  return `
    <div class="mur-post ${p.oculto ? 'oculto' : ''}">
      <div class="mur-head"><span class="mur-av">${escapeHtml((p.nome || '?').trim().charAt(0).toUpperCase())}</span><b>${escapeHtml(p.nome)}</b><small>${tempoRelativo(p.ts)}</small>${p.oculto ? '<span class="mur-tag">oculto</span>' : ''}</div>
      <p class="mur-texto">${escapeHtml(p.texto)}</p>
      <div class="mur-reacoes">
        ${admin ? `
          <button class="btn btn-ghost pres-btn" data-action="mural-ocultar" data-id="${p.id}">${p.oculto ? 'Mostrar' : 'Ocultar'}</button>
          <button class="btn btn-ghost pres-btn" data-action="mural-apagar" data-id="${p.id}">Apagar</button>
          <span class="mur-cont">${MURAL_EMOJIS.map(e => e + ' ' + rc[e]).join('  ')}</span>
        ` : `
          ${MURAL_EMOJIS.map(e => `<button class="mur-r ${minha && minha.emoji === e ? 'sel' : ''}" data-action="mural-reagir" data-id="${p.id}" data-value="${e}">${e} <b>${rc[e]}</b></button>`).join('')}
          ${eu ? `<button class="sem-link" data-action="mural-apagar" data-id="${p.id}">apagar</button>` : ''}
        `}
      </div>
    </div>`;
}

function salvarLivro(l) { const lista = (DB.get('bibLivros', []) || []).filter(x => x.id !== l.id); lista.push(l); DB.set('bibLivros', lista); return salvarConfigComRetentativa('bib_' + l.id, l); }
function salvarBibPedido(p) { const lista = getBibPedidos().filter(x => x.id !== p.id); lista.push(p); DB.set('bibPedidos', lista); return salvarConfigComRetentativa('bibp_' + p.id, p); }
function primeiroNome(n) { return String(n || '').trim().split(/\s+/)[0] || ''; }
function diasDesde(iso) { return passDiasEpoca(isoLocal()) - passDiasEpoca(String(iso).slice(0, 10)); }
function leitorDeLivro(pid) { return getBibPedidos().some(p => passSlug(p.nome) === pid && (p.status === 'emprestado' || p.status === 'devolvido')); }

function dadosWrapped() {
  const perfil = getPerfilJovem();
  if (!perfil) return null;
  const pid = passSlug(perfil.nome);
  const ano = String(new Date().getFullYear());
  const regs = getPresencas().filter(p => p.pid === pid && p.presente && String(p.data).startsWith(ano));
  const st = statsPessoa(pid);
  const semAno = Array.from(new Set(regs.map(r => passSemana(r.data)))).sort((a, b) => a - b);
  let melhor = 0, atual = 0, ant = null;
  semAno.forEach(w => { atual = (ant !== null && w === ant + 1) ? atual + 1 : 1; ant = w; if (atual > melhor) melhor = atual; });
  const amigos = regs.reduce((a, r) => a + (Number(r.amigo) || 0), 0);
  const primeira = regs.map(r => r.data).sort()[0] || null;
  const posts = (DB.get('muralPosts', []) || []).filter(p => p.pid === pid && !p.apagado && String(p.ts).startsWith(ano)).length;
  const selos = selosPessoa(st, pid).filter(s => s.ok).length;
  return { nome: perfil.nome, ano, presencas: regs.length, melhor, amigos, primeira, posts, selos };
}
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

async function compartilharWrapped() {
  const d = dadosWrapped(); if (!d) return;
  try { await document.fonts.load('120px Anton'); await document.fonts.load('700 40px Archivo'); } catch (e) {}
  const c = document.createElement('canvas'); c.width = 1080; c.height = 1920;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 1920); g.addColorStop(0, '#FF8A00'); g.addColorStop(.5, '#FF5F00'); g.addColorStop(1, '#E8301A');

  x.fillStyle = 'rgba(255,255,255,.14)';
  for (let yy = 40; yy < 1920; yy += 36) for (let xx = 40; xx < 1080; xx += 36) { x.beginPath(); x.arc(xx, yy, 2.5, 0, 7); x.fill(); }
  x.lineWidth = 8; x.strokeStyle = 'rgba(255,255,255,.55)'; x.beginPath(); x.arc(930, 520, 240, 0, 7); x.stroke();
  x.textAlign = 'left'; x.fillStyle = '#fff'; x.font = '700 44px Archivo, sans-serif'; x.fillText('DEEP WRAPPED ' + d.ano, 90, 200);

    x.fillStyle = '#FFC83D'; x.font = '170px Anton, Impact, sans-serif'; x.fillText(String(l[0]), 130, y + 10);
    const wN = x.measureText(String(l[0])).width;
    x.fillStyle = '#fff'; x.font = '56px Anton, Impact, sans-serif'; x.fillText(l[1], 130 + wN + 40, y - 20);
  });
  x.fillStyle = '#fff'; x.font = '700 46px Archivo, sans-serif'; x.fillText('Jovens 18–25 · Toda quarta tem Célula', 90, 1760);
  x.font = '90px Anton, Impact, sans-serif'; x.fillText('DEEP', 90, 1860);
  c.toBlob(async (blob) => {
    if (!blob) { showToast('Não consegui gerar a imagem', 'error'); return; }
    const file = new File([blob], 'deep-wrapped-' + d.ano + '.png', { type: 'image/png' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Meu ' + d.ano + ' no DEEP' }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const url = URL.createObjectURL(blob); const a = document.createElement('a');

    setTimeout(() => URL.revokeObjectURL(url), 4000);
    showToast('Imagem salva! Agora é só postar nos stories 📲', 'success');
  }, 'image/png');
}

// MEUS AGENDAMENTOS (visível só pro jovem, no aparelho dele)
// Mostra status atual: confirmado / cancelado / pedido de remarcação.
// ============================================
function renderMeusAgendamentosHome() {
  const meus = DB.get('meusAgendamentos', []) || [];
  if (meus.length === 0) return '';
  const ags = DB.get('agendamentos', []) || [];
  
  // Registra a primeira vez que o jovem vê um cancelamento (pra contar 3 dias)
  const vistos = DB.get('cancelamentosVistos', {}) || {};
  let mudou = false;
  ags.forEach(a => {
    if ((a.status === 'cancelado' || a.status === 'remarcacao') && !vistos[a.id]) {
      vistos[a.id] = new Date().toISOString();
      mudou = true;
    }
  });
  if (mudou) DB.set('cancelamentosVistos', vistos);
  
  // Aviso expira após 3 dias da primeira visualização
  const TRES_DIAS = 3 * 24 * 60 * 60 * 1000;
  function expirou(ag) {
    const t = vistos[ag.id];
    if (!t) return false;
    const ms = new Date(t).getTime();
    if (isNaN(ms)) return false;
    return (Date.now() - ms) > TRES_DIAS;
  }
  
  const nomesLider = { eltinho: 'Eltinho', dayana: 'Day', os_dois: 'Eltinho e Day' };
  
  const cards = meus.map((m, i) => {
    const ag = ags.find(a =>
      (a.id === m.id || String(a.id) === String(m.id)) ||
      (a.telefone === m.telefone && a.data_agendada === m.data && a.hora_agendada === m.hora)
    );
    if (!ag) return '';
    
    const passou = agendamentoJaPassou(ag);
    // Esconde os concluídos e os confirmados que já passaram (sem novidade pro jovem)
    if (ag.status === 'concluido') return '';
    if (ag.status === 'confirmado' && passou) return '';
    // Aviso de cancelado/remarcação some sozinho após 3 dias
    if ((ag.status === 'cancelado' || ag.status === 'remarcacao') && expirou(ag)) return '';
    
    const lider = nomesLider[ag.com_quem] || 'a liderança';
    const quando = `${formatDateFull(ag.data_agendada)} às ${ag.hora_agendada}`;
    
    let cor, icone, titulo, msg, botao = '';
    if (ag.status === 'cancelado') {
      cor = '#ef4444'; icone = '✕'; titulo = 'Agendamento cancelado';
      msg = `Sua conversa de ${quando} foi cancelada pela liderança.`;
      botao = `<button class="cover-cta" style="margin-top:12px;width:100%;" data-action="goto-agendar"><span class="cover-cta-icon">📅</span> Agendar outro horário</button>`;
    } else if (ag.status === 'remarcacao') {
      cor = '#f59e0b'; icone = '↻'; titulo = 'Precisa remarcar';
      msg = `A liderança pediu para remarcar sua conversa de ${quando}.`;
      botao = `<button class="cover-cta" style="margin-top:12px;width:100%;" data-action="goto-agendar"><span class="cover-cta-icon">📅</span> Escolher novo horário</button>`;
    } else {
      cor = '#22c55e'; icone = '✓'; titulo = 'Conversa confirmada';
      msg = `Com ${lider} • ${quando}`;
    }

// SEÇÃO ANIVERSARIANTES NA HOME (todos veem)
