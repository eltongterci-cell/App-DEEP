      State.dataSelecionadaAdmin = null;
      render(true);
      break;
    case 'admin-toggle-data-status':
      const datasF = DB.get('datasFechadas', []) || [];
      const idxF = datasF.indexOf(date);
      if (idxF === -1) {
        datasF.push(date);
        showToast(`Data ${formatDateShort(date)} fechada`, 'success');
      } else {
        datasF.splice(idxF, 1);
        showToast(`Data ${formatDateShort(date)} aberta`, 'success');
      }
      DB.set('datasFechadas', datasF);
      if (USAR_SUPABASE) await salvarConfigComRetentativa('datasFechadas', datasF);
      render(true);
      break;
    case 'admin-toggle-horario-lider':
      const liderT = e.currentTarget.dataset.lider;
      const horariosTL = DB.get('horariosTravados', {}) || {};
      const chaveTL = `${liderT}_${date}`;
      const listaTL = horariosTL[chaveTL] || [];
      const idxTL = listaTL.indexOf(horario);
      const nomeLT = liderT === 'eltinho' ? 'Eltinho' : 'Day';
      if (idxTL === -1) {
        listaTL.push(horario);
        showToast(`🔒 ${horario} travado (${nomeLT})`, 'success');
      } else {
        listaTL.splice(idxTL, 1);
        showToast(`✓ ${horario} liberado (${nomeLT})`, 'success');
      }
      horariosTL[chaveTL] = listaTL;
      DB.set('horariosTravados', horariosTL);
      if (USAR_SUPABASE) await salvarConfigComRetentativa('horariosTravados', horariosTL);
      render(true);
      break;
    case 'admin-travar-todos-lider':
      const lT = e.currentTarget.dataset.lider;
      const htT = DB.get('horariosTravados', {}) || {};
      const horariosDataT = getHorariosDisponiveisPorData(date);
      const agsLT = (DB.get('agendamentos', []) || [])
        .filter(a => a.data_agendada === date && a.status !== 'cancelado' &&
                (a.com_quem === lT || a.com_quem === 'os_dois'))
        .map(a => a.hora_agendada);
      htT[`${lT}_${date}`] = horariosDataT.filter(h => !agsLT.includes(h));
      DB.set('horariosTravados', htT);
      if (USAR_SUPABASE) await salvarConfigComRetentativa('horariosTravados', htT);
      showToast(`🔒 Todos travados`, 'success');
      render(true);
      break;
    case 'admin-destravar-todos-lider':
      const lD = e.currentTarget.dataset.lider;
      const htD = DB.get('horariosTravados', {}) || {};
      htD[`${lD}_${date}`] = [];
      DB.set('horariosTravados', htD);
      if (USAR_SUPABASE) await salvarConfigComRetentativa('horariosTravados', htD);
      showToast(`✓ Todos liberados`, 'success');
      render(true);
      break;
    
    // EVENTOS DO DEEP
    case 'novo-evento':
      State.modalEvento = true;
      State.eventoEditando = null;
      State.qrTemp = undefined;
      State.capaTemp = undefined;
      render(true);
      break;
    case 'editar-evento':
      const evento = (DB.get('eventos', []) || []).find(ev => ev.id == id);
      if (evento) {
        State.eventoEditando = { ...evento };
        State.modalEvento = true;
        State.qrTemp = undefined;
        State.capaTemp = undefined;
        render(true);
      }
      break;
    case 'deletar-evento':
      if (confirm('Tem certeza que deseja deletar este evento?')) {
        if (USAR_SUPABASE && supabaseClient) {
          await deletarEventoSupabase(id);
          State.cache.eventos = await carregarEventosSupabase();
        } else {
          const evts = DB.get('eventos', []) || [];
          DB.set('eventos', evts.filter(ev => ev.id != id));
        }
        showToast('Evento deletado', 'success');
        render(true);
      }
      break;
    case 'salvar-evento':
      await salvarEvento(id);
      break;
    case 'close-modal':
      State.modalEvento = false;
      State.eventoEditando = null;
      State.qrTemp = undefined;
      State.capaTemp = undefined;
      render(true);
      break;
    case 'remover-qr': {
      State.qrTemp = '';
      const prev = document.getElementById('qr-preview');
      if (prev) prev.style.display = 'none';
      break;
    }
    case 'remover-capa': {
      State.capaTemp = '';
      const prev = document.getElementById('capa-preview');
      if (prev) prev.style.display = 'none';
      break;
    }
    
    // INSCRIÇÕES EM EVENTOS
    case 'abrir-inscricao':
      State.modalInscritos = null;
      State.modalInscricao = id;
      State.compTemp = null;
      State.inscricaoMsg = null;
      State.inscricaoNome = '';
      State.inscricaoTel = '';
      State.inscPasso = 'dados';
      render(true);
      break;
    case 'close-inscricao':
      State.modalInscricao = null;
      State.compTemp = null;
      State.inscricaoMsg = null;
      State.inscricaoNome = '';
      State.inscricaoTel = '';
      State.inscPasso = 'dados';
      render(true);
      break;
    case 'concluir-inscricao': {
      const foiSucesso = State.inscPasso === 'sucesso';
      State.modalInscricao = null;
      State.compTemp = null;
      State.inscricaoMsg = null;
      State.inscricaoNome = '';
      State.inscricaoTel = '';
      State.inscPasso = 'dados';
      render(true);
      if (foiSucesso) {
        showToast('✅ Inscrição confirmada! Você já pode ver ela aqui embaixo.', 'success');
        // Leva o jovem direto pra prova visual da inscrição, em vez de deixá-lo
        // boiando no topo da home sem saber se realmente funcionou.
        setTimeout(() => {
          const el = document.getElementById('minhas-inscricoes');
          if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 150);
      }
      break;
    }
    case 'ver-inscritos':
      State.modalInscricao = null;
      State.modalInscritos = id;
      render(true);
      break;
    case 'close-inscritos':
      State.modalInscritos = null;
      render(true);
      break;
    case 'insc-continuar': {
      // Passo 1 -> próximo. Captura nome e telefone.
      const nome = (document.getElementById('insc-nome')?.value || '').trim();
      const tel = (document.getElementById('insc-tel')?.value || '').trim();
      if (!nome) { showToast('Digite seu nome', 'error'); break; }
      if (!tel) { showToast('Digite seu WhatsApp', 'error'); break; }
      State.inscricaoNome = nome;
      State.inscricaoTel = tel;
      const cfgC = getConfigDoEvento(id);
      const temPag = (cfgC.pixChave || cfgC.pixLink || cfgC.pixValor);
      if (temPag) {
        State.inscPasso = 'pagamento';
        render(true);
      } else {
        // Evento gratuito: salva direto
        await processarSalvarInscricao(id);
      }
      break;
    }
    case 'insc-voltar':
      State.inscPasso = 'dados';
      render(true);
      break;
    case 'salvar-inscricao': {
      if (State.processando) break;
      State.processando = true;
      await processarSalvarInscricao(id);
      State.processando = false;
      break;
    }
    case 'toggle-pago': {
      const idx = parseInt(e.currentTarget.dataset.idx);
      const lista = getInscricoesDoEvento(id);
      if (lista[idx]) {
        lista[idx].pago = !lista[idx].pago;
        await salvarInscricoesDoEvento(id, lista);
        render(true);
      }
      break;
    }
    case 'del-inscrito': {
      const idx = parseInt(e.currentTarget.dataset.idx);
      const lista = getInscricoesDoEvento(id);
      if (lista[idx] && confirm(`Remover ${lista[idx].nome} da lista?`)) {
        lista.splice(idx, 1);
        await salvarInscricoesDoEvento(id, lista);
        render(true);
      }
      break;
    }
    case 'copiar-pix': {
      const chave = e.currentTarget.dataset.value || '';
      const ok = await copiarTexto(chave);
      if (ok) {
        showToast('📋 Chave Pix copiada! Cole no seu app do banco.', 'success');
      } else {
        showToast('Não consegui copiar. Selecione e copie manualmente.', 'error');
      }
      break;
    }
    case 'abrir-link-pix': {
      const url = normalizarUrl(e.currentTarget.dataset.value || '');
      if (!url) { showToast('Link inválido', 'error'); break; }
      window.open(url, '_blank', 'noopener,noreferrer');
      showToast('🔗 Abrindo o link de pagamento...', 'success');
      break;
    }
    case 'ver-comprovante': {
      const idx = parseInt(e.currentTarget.dataset.idx);
      State.modalComprovante = { eventoId: id, idx };
      render(true);
      break;
    }
    case 'close-comprovante':
      State.modalComprovante = null;
      render(true);
      break;
    case 'exportar-relatorio':
      State.modalRelatorio = id;
      render(true);
      break;
    case 'close-relatorio':
      State.modalRelatorio = null;
      render(true);
      break;
    case 'whatsapp-relatorio': {
      const texto = document.getElementById('relatorio-texto')?.value || gerarRelatorioTexto(id);
      window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank');
      break;
    }
    case 'copiar-relatorio': {
      const texto = document.getElementById('relatorio-texto')?.value || '';
      try {
        await navigator.clipboard.writeText(texto);
        showToast('📋 Relatório copiado! Cole no WhatsApp.', 'success');
      } catch (err) {
        showToast('Selecione o texto e copie manualmente.', 'error');
      }
      break;
    }
    case 'baixar-planilha':
      baixarPlanilha(id);
      break;
    
    // 🔗 LINK DA INSCRIÇÃO (no card do evento, painel do líder)
    case 'copiar-link-evento': {
      const evt = (DB.get('eventos', []) || []).find(ev => String(ev.id) === String(id));
      const slug = evt ? slugificar(evt.titulo) : '';
      const url = montarLinkEvento(id, slug);
      // Avisa se o app não está hospedado num site (link não funcionará pra outros)
      if (!appPublicado()) {
        showToast('⚠️ App não está num site. Link só funciona no seu celular.', 'error');
      }
      const ok = await copiarTexto(url);
      if (ok) showToast('🔗 Link copiado!', 'success');
      else showToast('Copie: ' + url, 'success');
      break;
    }
    case 'enviar-link-wpp': {
      const evt = (DB.get('eventos', []) || []).find(ev => String(ev.id) === String(id));
      if (!evt) { showToast('Evento não encontrado', 'error'); break; }
      if (!appPublicado()) {
        showToast('⚠️ Hospede o app num site pro link funcionar pros jovens.', 'error');
      }
      const slug = slugificar(evt.titulo);
      const url = montarLinkEvento(id, slug);
      // Mensagem com o nome do evento em destaque (negrito do WhatsApp)
      const partes = [
        `🎉 *${evt.titulo.toUpperCase()}*`,
        ''
      ];
      if (evt.data) {
        const dt = new Date(evt.data + 'T00:00:00');
        const diaSem = dt.toLocaleDateString('pt-BR', { weekday: 'long' });
        const dataExt = dt.toLocaleDateString('pt-BR', { day: 'numeric', month: 'long' });
        partes.push(`📅 ${diaSem.charAt(0).toUpperCase() + diaSem.slice(1)} · ${dataExt}`);
      }
      if (evt.horario) partes.push(`🕐 ${evt.horario}`);
      if (evt.local) partes.push(`📍 ${evt.local}`);
      partes.push('');
      partes.push('✨ *Inscrições abertas!*');
      partes.push('Toque no link e participe 👇');
      partes.push(url);
      const msg = partes.join('\n');
      window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
      break;
    }
  }
}

function sincronizarEventoInputs() {
  // Pegar os valores atuais dos inputs antes de re-renderizar
  const titulo = document.getElementById('evt-titulo')?.value;
  const dataEvt = document.getElementById('evt-data')?.value;
  const horario = document.getElementById('evt-horario')?.value;
  const local = document.getElementById('evt-local')?.value;
  const desc = document.getElementById('evt-descricao')?.value;
  
  if (!State.eventoEditando) State.eventoEditando = {};
  if (titulo !== undefined) State.eventoEditando.titulo = titulo;
  if (dataEvt !== undefined) State.eventoEditando.data = dataEvt;
  if (horario !== undefined) State.eventoEditando.horario = horario;
  if (local !== undefined) State.eventoEditando.local = local;
  if (desc !== undefined) State.eventoEditando.descricao = desc;
  // Campos de inscrição/Pix (pra não sumirem ao trocar o ícone)
  const insc = document.getElementById('evt-inscricoes');
  if (insc) State.eventoEditando.inscricoesAbertas = insc.checked;
  const pc = document.getElementById('evt-pix-chave');
  if (pc) State.eventoEditando.pixChave = pc.value;
  const pv = document.getElementById('evt-pix-valor');
  if (pv) State.eventoEditando.pixValor = pv.value;
  const pl = document.getElementById('evt-pix-link');
  if (pl) State.eventoEditando.pixLink = pl.value;
}

async function salvarEvento(id) {
  if (State.processando) return; // já está salvando, ignora clique duplo
  const elTitulo = document.getElementById('evt-titulo');
  if (!elTitulo) return; // modal não está na tela: ignora o clique com segurança
  const titulo = elTitulo.value.trim();
  const data = document.getElementById('evt-data')?.value || '';
  const horario = document.getElementById('evt-horario')?.value || '';
  const local = (document.getElementById('evt-local')?.value || '').trim();
  const descricao = (document.getElementById('evt-descricao')?.value || '').trim();
  // Config de inscrições / Pix
  const inscricoesAbertas = !!document.getElementById('evt-inscricoes')?.checked;
  const pixChave = (document.getElementById('evt-pix-chave')?.value || '').trim();
  const pixValor = (document.getElementById('evt-pix-valor')?.value || '').trim();
  const pixLink = (document.getElementById('evt-pix-link')?.value || '').trim();
  
  if (!titulo) return showToast('Digite o título do evento', 'error');
  if (!data) return showToast('Selecione a data', 'error');
  State.processando = true;
  render();
  
  const icone = State.eventoEditando?.icone || '🎉';
  // Capa: usa a recém enviada (se houver), senão mantém a que já estava
  const capaEvt = (State.capaTemp !== undefined && State.capaTemp !== null)
    ? State.capaTemp
    : (State.eventoEditando?.capa || '');
  const eventoEditandoId = State.eventoEditando?.id;
  const ehEdicao = eventoEditandoId && typeof eventoEditandoId === 'number';
  
  const novoEvento = { 
    id: ehEdicao ? eventoEditandoId : id, 
    titulo, icone, capa: capaEvt, data, horario, local, descricao 
  };
  
  let idFinal = novoEvento.id; // usado pra guardar a config de inscrições
  if (USAR_SUPABASE && supabaseClient) {
    const saved = await salvarEventoSupabase(novoEvento);
    if (!saved) {
      // Falhou ao salvar na nuvem: não fecha o modal nem diz que deu certo.
      showToast('⚠️ Não consegui salvar agora. Confira a internet e toque em salvar de novo.', 'error');
      State.processando = false;
      render();
      return;
    }
    if (saved.id !== undefined) idFinal = saved.id; // id real gerado pelo banco
    // Recarrega os eventos do Supabase pra atualizar a tela na hora
    State.cache.eventos = await carregarEventosSupabase();
  } else {
    const eventos = DB.get('eventos', []) || [];
    const existing = eventos.findIndex(ev => ev.id == id);
    if (existing >= 0) {
      eventos[existing] = novoEvento;
    } else {
      eventos.push(novoEvento);
    }
    DB.set('eventos', eventos);
  }
  
  // Guarda a config (inscrições/Pix + capa) vinculada ao id final do evento
  const prevCfg = getConfigDoEvento(ehEdicao ? eventoEditandoId : id);
  const pixQrCode = (State.qrTemp !== undefined && State.qrTemp !== null) ? State.qrTemp : (prevCfg.pixQrCode || '');
  // Capa: usa a nova (capaTemp) ou mantém a anterior
  const capaFinal = (State.capaTemp !== undefined && State.capaTemp !== null)
    ? State.capaTemp
    : (prevCfg.capa || '');
  await salvarConfigDoEvento(idFinal, { inscricoesAbertas, pixChave, pixValor, pixLink, pixQrCode, capa: capaFinal });
  State.qrTemp = undefined;
  State.capaTemp = undefined;
  
  showToast(ehEdicao ? 'Evento atualizado!' : 'Evento criado!', 'success');
  State.modalEvento = false;
  State.eventoEditando = null;
  State.processando = false;
  render(true);
}

function handleLogin(e) {
  e.preventDefault();
  const elUser = document.getElementById('login-user');
  const elSenha = document.getElementById('login-senha');
  const btn = document.getElementById('login-btn');
  if (!elUser || !elSenha || !btn) return; // tela mudou no meio: ignora com segurança
  const user = elUser.value.toLowerCase().trim();
  const senha = elSenha.value;
  
  btn.textContent = 'Entrando...';
  btn.disabled = true;
  
  setTimeout(async () => {
    if (ADMINS[user] && ADMINS[user].senha === senha) {
      State.adminLogado = true;
      State.adminNome = ADMINS[user].nome;
      showToast(`Bem-vindo(a), ${ADMINS[user].nome}! 👋`, 'success');
      // Pede permissão pra notificar sobre novos agendamentos
      pedirPermissaoNotificacao();
      // Recarrega os dados frescos do Supabase ao entrar no painel
      if (USAR_SUPABASE && supabaseClient) {
        try {
          State.cache.agendamentos = await carregarAgendamentosSupabase();
          State.cache.eventos = await carregarEventosSupabase();
          const config = await carregarConfigSupabase();
          aplicarConfigNoCache(config);
        } catch (err) {
          console.error('Erro ao recarregar no login:', err);
        }
      }
      render();
    } else {
      showToast('Login ou senha incorretos', 'error');
      btn.textContent = 'Entrar';
      btn.disabled = false;
    }
  }, 400);
}

function showToast(msg, type = 'success') {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// ============================================
// INICIALIZAÇÃO
// ============================================
try {
  seedData();
  render();  // 1) Renderização inicial com dados locais (instantâneo)

  // Se Supabase estiver configurado, carrega dados e ativa tempo real
  if (USAR_SUPABASE && supabaseClient) {
    criarBadgeSync();
    setSyncStatus('sincronizando');
    
    carregarDadosIniciais()
      .then(() => {
        // 2) Ativa tempo real (silenciosamente)
        try {
          ativarRealtimeSupabase();
          setSyncStatus('ok');
        } catch (err) {
          console.error('Erro ao ativar realtime:', err);
          setSyncStatus('reconectando');
        }
        
        // 3) Se o link tem ?e=ID, abre o evento direto na inscrição
        try {
          const params = new URLSearchParams(window.location.search);
          const eventoId = params.get('e') || params.get('evento');
          if (eventoId) {
            const evt = (DB.get('eventos', []) || []).find(e => String(e.id) === String(eventoId));
            const cfg = getConfigDoEvento(eventoId);
            if (evt && cfg.inscricoesAbertas) {
              State.modalInscricao = evt.id;
              State.inscPasso = 'dados';
            }
          }
        } catch (e) { console.error('Erro ao abrir link direto:', e); }
        
        // 4) Render ÚNICO no final, mantendo o scroll (sem piscar nem voltar)
        render(true);
      })
      .catch((err) => {
        console.error('Erro ao carregar dados do Supabase:', err);
        State.cache.carregando = false;
        setSyncStatus('reconectando');
        render(true);
      });
    
    // SINCRONIZAÇÃO INTELIGENTE:
    // - Usando o app: sincroniza a cada 4 segundos (resposta rápida)
    // - Parado há mais de 4 min: desacelera pra 1 a cada 3 ciclos (economiza bateria/dados)
    // - Qualquer toque/tecla volta ao modo rápido na hora
    let _ultimaInteracao = Date.now();
    let _cicloSync = 0;
    document.addEventListener('pointerdown', () => { _ultimaInteracao = Date.now(); }, { passive: true });
    document.addEventListener('keydown', () => { _ultimaInteracao = Date.now(); }, { passive: true });
    setInterval(() => {
      if (document.visibilityState !== 'visible') return;
      _cicloSync++;
      const ocioso = (Date.now() - _ultimaInteracao) > 4 * 60 * 1000;
      if (ocioso && _cicloSync % 3 !== 0) return; // modo econômico: 1 sync a cada 12s
      sincronizarAgora(true);
    }, 4000);
  }
  
  // Verificar lembretes
  verificarLembretesAutomaticos();
  setInterval(verificarLembretesAutomaticos, 5 * 60 * 1000);
  
  // Quando a internet voltar: reenvia pendentes e sincroniza na hora
  window.addEventListener('online', () => {
    console.log('🌐 Internet voltou — sincronizando...');
    _falhasSeguidas = 0;
    sincronizarAgora(false);
  });
  window.addEventListener('offline', () => setSyncStatus('reconectando'));
  
  // Ao voltar pro app (trocar de aba, desbloquear o celular): sincroniza na hora
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') sincronizarAgora(false);
    else pararMusica(); // 🔇 música para se o app for pro fundo
  });
  window.addEventListener('focus', () => sincronizarAgora(false));
} catch (err) {
  console.error('Erro fatal na inicialização:', err);
  document.getElementById('app').innerHTML = `
    <div style="padding: 40px 20px; text-align: center; color: #F0FAFC;">
      <h2 style="margin-bottom: 16px;">⚠️ Erro ao iniciar o app</h2>
      <p style="color: #B8D8E0; margin-bottom: 20px;">Tente fechar e abrir novamente.</p>
      <button onclick="location.reload()" style="padding: 12px 24px; background: #FD6A02; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer;">
        🔄 Recarregar
      </button>
      <p style="color: #7FA8B3; margin-top: 30px; font-size: 12px;">Erro técnico: ${err.message}</p>
    </div>
  `;
}
