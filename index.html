<style>
/* ============================================
   DESIGN SYSTEM - DEEP
   Padronização única para todo o app
   ============================================ */

:root {
  /* Cores Primárias - Identidade DEEP */
  --primary: #FD6A02;
  --primary-light: #FF9A4D;
  --primary-dark: #D35525;
  --primary-soft: rgba(253, 106, 2, 0.08);
  --primary-medium: rgba(253, 106, 2, 0.15);
  
  /* Backgrounds — petróleo azulado, com o laranja como
     protagonista nos degradês de destaque (splash, capa, botões). */
  --bg-0: #051826;
  --bg-1: #082033;
  --bg-2: #0C2B41;
  --bg-3: #12374F;
  --bg-4: #19445E;
  
  /* Bordas */
  --border: #163A4C;
  --border-light: #1F4C61;
  --border-medium: #2C5E76;
  
  /* Textos — claros, com leve tom azul-ciano pra combinar com o petróleo */
  --text-primary: #F0FAFC;
  --text-secondary: #B8D8E0;
  --text-tertiary: #7FA8B3;
  --text-muted: #4F7580;
  
  /* Estados */
  --success: #10B981;
  --success-bg: rgba(16, 185, 129, 0.12);
  --error: #EF4444;
  --error-bg: rgba(239, 68, 68, 0.12);
  --warning: #F59E0B;
  --warning-bg: rgba(245, 158, 11, 0.12);
  --info: #3B82F6;
  --info-bg: rgba(59, 130, 246, 0.12);
  
  /* Espaçamentos */
  --space-xs: 4px;
  --space-sm: 8px;
  --space-md: 16px;
  --space-lg: 24px;
  --space-xl: 32px;
  --space-2xl: 48px;
  
  /* Bordas arredondadas */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 24px;
  --radius-full: 999px;
  
  /* Sombras */
  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
  --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.45);
  --shadow-glow: 0 0 24px rgba(253, 127, 33, 0.35);
  
  /* Transições */
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-fast: all 0.15s ease;
}

/* ============================================
   🎨 ÁREA DO LÍDER — reforça a mesma paleta "pôr do sol" global
   (Hoje o app inteiro já usa essas cores lá em cima; este bloco garante
   consistência exata + os toques extras de elevação dos cards.)
   ============================================ */
.admin-theme {
  --bg-0: #F6F3EC;
  --bg-1: #FBF9F4;
  --bg-2: #FFFFFF;
  --bg-3: #EFEBE1;
  --bg-4: #E6E0D2;

  --border: #E2DCCD;
  --border-light: #D9D2C0;
  --border-medium: #C3BBA6;

  --text-primary: #261363;
  --text-secondary: #333333;
  --text-tertiary: #5E5E5E;
  --text-muted: #8A8A8A;

  --shadow-sm: 0 2px 8px rgba(38,19,99,.06);
  --shadow-md: 0 6px 18px rgba(38,19,99,.10);
  --shadow-lg: 0 12px 30px rgba(38,19,99,.14);
  --shadow-glow: 0 0 24px rgba(253, 106, 2, 0.35);

  background: var(--bg-0);
  color: var(--text-primary);
  min-height: 100vh;
}
/* Cards com elevação suave */
.admin-theme .card,
.admin-theme .form-box,
.admin-theme .modal,
.admin-theme .info-card {
  box-shadow: var(--shadow-sm);
}
.admin-theme .card:hover {
  box-shadow: var(--shadow-md);
}
/* Cabeçalho do admin: sobe um pouco o peso visual sobre o off-white */
.admin-theme .app-header {
  background: var(--bg-1);
  border-bottom: 1px solid var(--border);
}

/* ============================================
   🛍️ DEEP STORE — identidade visual própria
   Preto profundo + laranja vibrante + ciano elétrico,
   igual à capa/banner da loja. Reaproveita os componentes
   do design system (card, btn, input) só trocando as cores.
   ============================================ */
.loja-theme {
  --bg-0: #052B33;
  --bg-1: #261363;
  --bg-2: #0A3C46;
  --bg-3: #0F4954;
  --bg-4: #145763;

  --border: rgba(255, 95, 0, 0.14);
  --border-light: rgba(255, 95, 0, 0.26);
  --border-medium: rgba(255, 95, 0, 0.4);

  --text-primary: #FFFFFF;
  --text-secondary: #C1C4CC;
  --text-tertiary: #82858F;
  --text-muted: #55575F;

  --primary: #FF6800;
  --primary-light: #FF9433;
  --primary-dark: #CC5200;
  --primary-soft: rgba(255, 104, 0, 0.1);
  --primary-medium: rgba(255, 104, 0, 0.18);

  --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.5);
  --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.6);
  --shadow-lg: 0 10px 32px rgba(0, 0, 0, 0.7);
  --shadow-glow: 0 0 28px rgba(255, 104, 0, 0.4);

  background: var(--bg-0);
  color: var(--text-primary);
  min-height: 100vh;
}
.loja-theme .card {
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
}
.loja-theme .card:hover {
  border-color: var(--border-medium);
  box-shadow: var(--shadow-md);
}
.loja-theme .btn-primary {
  background: linear-gradient(135deg, #FF7E10, #FF4D00);
  box-shadow: 0 6px 18px rgba(255, 88, 0, 0.35);
  border: none;
}
.loja-theme .app-header {
  background: rgba(5, 43, 51, 0.85);
  border-bottom: 1px solid var(--border);
}
/* Selo ciano — usado em preço/destaque pra ecoar a cor da capa */
.loja-cyan { color: #FF5F00; }
.loja-produto-card {
  border-radius: 16px;
  overflow: hidden;
  background: var(--bg-2);
  border: 1px solid var(--border);
  transition: var(--transition);
}
.loja-produto-card:active { transform: scale(0.97); }
@keyframes lojaBadgeGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 104, 0, 0.5); }
  50% { box-shadow: 0 0 0 5px rgba(255, 104, 0, 0); }
}
/* 🌟 Banner de destaque da loja na HOME — precisa parecer uma vitrine chamando atenção */
.loja-hero {
  position: relative;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.loja-hero:active .loja-hero-img { transform: scale(1.03); }
.loja-hero-img {
  width: 100%;
  height: 172px;
  object-fit: cover;
  display: block;
  transition: transform 0.4s ease;
}
.loja-hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(5,43,51,.1) 0%, rgba(5,43,51,.28) 45%, rgba(5,43,51,.94) 100%);
  pointer-events: none;
}
.loja-hero-badge {
  position: absolute; top: 14px; left: 14px;
  background: rgba(5,43,51,.55);
  border: 1px solid rgba(255,95,0,.55);
  color: #FF5F00;
  font-size: 12px; font-weight: 700; letter-spacing: 0;
  padding: 5px 11px; border-radius: 999px;
  backdrop-filter: blur(6px);
  animation: lojaPulseBadge 2.4s ease-in-out infinite;
}
@keyframes lojaPulseBadge {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255,95,0,.35); }
  50% { box-shadow: 0 0 0 6px rgba(255,95,0,0); }
}
.loja-hero-content {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 14px 16px 16px;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
}
.loja-hero-cta {
  flex-shrink: 0;
  background: linear-gradient(135deg, #FF7E10, #FF4D00);
  color: #fff; font-weight: 700; font-size: 14px;
  padding: 11px 18px; border-radius: 999px;
  display: flex; align-items: center; gap: 6px;
  box-shadow: 0 8px 22px rgba(255, 90, 0, .45);
  position: relative; overflow: hidden;
  white-space: nowrap;
}
.loja-hero-cta::before {
  content: '';
  position: absolute; top: -50%; left: -60%; width: 35%; height: 200%;
  background: linear-gradient(105deg, transparent 0%, rgba(255,255,255,.6) 50%, transparent 100%);
  transform: rotate(15deg);
  animation: ctaShine 2.6s ease-in-out infinite;
}
.loja-thumb-preco {
  position: absolute; bottom: 6px; left: 6px;
  background: rgba(5,43,51,.78);
  backdrop-filter: blur(3px);
  color: #FF8A2B;
  font-size: 12px; font-weight: 700;
  padding: 3px 7px; border-radius: 8px;
}
.loja-ver-todos {
  flex: 0 0 76px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 4px;
  border-radius: 12px;
  background: rgba(255,95,0,.06);
  border: 1px dashed rgba(255,95,0,.35);
  color: #FF5F00;
  font-size: 12px; font-weight: 700; text-align: center;
  cursor: pointer;
  height: 100px;
}

/* Reset */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  background: var(--bg-0);
  color: var(--text-primary);
  font-family: 'Plus Jakarta Sans', -apple-system, system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  letter-spacing: 0;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(circle at 15% 85%, rgba(253, 127, 33, 0.05) 0%, transparent 50%),
    radial-gradient(circle at 85% 15%, rgba(253, 127, 33, 0.03) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

#app {
  position: relative;
  z-index: 1;
  min-height: 100vh;
}

/* ===== TIPOGRAFIA PADRONIZADA ===== */
h1, h2, h3, h4, h5, h6 {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: 0;
  line-height: 1.15;
}

h1 { font-size: clamp(36px, 8vw, 56px); }
h2 { font-size: clamp(28px, 6vw, 38px); letter-spacing: 0; }
h3 { font-size: clamp(20px, 4vw, 24px); letter-spacing: 0; }
h4 { font-size: 16px; font-weight: 700; }

p {
  color: var(--text-secondary);
  line-height: 1.7;
}

strong { font-weight: 700; color: var(--text-primary); }

/* ===== CONTAINER ===== */
.container {
  max-width: 720px;
  margin: 0 auto;
  padding: 0 20px;
}

/* ===== HEADER PADRONIZADO ===== */
.app-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(246, 243, 236, 0.94);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 14px 0;
}

.app-header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 720px;
  margin: 0 auto;
  padding: 0 20px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: var(--transition);
}

.brand:hover { opacity: 0.85; }

.brand-icon {
  width: 40px;
  height: 40px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 700;
  color: white;
  box-shadow: var(--shadow-sm), var(--shadow-glow);
}

.brand-text {
  display: flex;
  flex-direction: column;
  line-height: 1;
  gap: 3px;
}

.brand-label {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0;
  color: var(--text-muted);
  text-transform: none;
}

.brand-name {
  font-size: 18px;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: 0;
}

.icon-button {
  width: 40px;
  height: 40px;
  border: 1.5px solid var(--border-light);
  border-radius: var(--radius-full);
  background: transparent;
  color: var(--primary);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}

.icon-button:hover {
  border-color: var(--primary);
  background: var(--primary-soft);
  transform: scale(1.05);
}

/* ===== BOTÕES PADRONIZADOS ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 22px;
  border: none;
  border-radius: 12px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0;
  cursor: pointer;
  transition: var(--transition);
  min-height: 46px;
  text-decoration: none;
  white-space: nowrap;
}

.btn:active:not(:disabled) {
  transform: scale(0.94);
  transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* Brilho radial que "pisca" ao tocar — dá aquele feedback tátil visual */
.btn-primary {
  position: relative;
  overflow: hidden;
}
.btn-primary::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle, rgba(255,255,255,.4) 0%, transparent 65%);
  opacity: 0;
  transform: scale(0);
  pointer-events: none;
  transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.5s ease-out;
}
.btn-primary:active:not(:disabled)::after {
  transform: scale(2.4);
  opacity: 1;
  transition: transform 0.15s ease-out, opacity 0.1s ease-out;
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
  box-shadow: 0 2px 10px rgba(253, 127, 33, 0.25);
}

.btn-grande {
  padding: 13px 22px;
  font-size: 16px;
  font-weight: 600;
  min-height: 50px;
  border-radius: 12px;
}

.btn-primary:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md), 0 0 32px rgba(253, 127, 33, 0.5);
}

.btn-primary:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.btn-secondary {
  background: var(--bg-3);
  color: var(--text-primary);
  border: 1.5px solid var(--border-light);
}

.btn-secondary:hover {
  border-color: var(--primary);
  background: var(--primary-soft);
}

.btn-ghost {
  background: transparent;
  color: var(--text-tertiary);
  padding: 8px 14px;
  min-height: auto;
  font-weight: 600;
}

.btn-ghost:hover { color: var(--primary); }

.btn-full { width: 100%; }
.btn-sm { padding: 10px 16px; font-size: 14px; min-height: 36px; }
.btn-lg { padding: 18px 32px; font-size: 18px; min-height: 56px; }

/* ===== CAPA MODERNA DESTAQUE ===== */
.cover {
  position: relative;
  width: 100%;
  background: 
    radial-gradient(circle at 50% 35%, var(--primary-light) 0%, var(--primary) 32%, transparent 62%),
    radial-gradient(circle at 10% 90%, #FF8A3D 0%, transparent 55%),
    radial-gradient(circle at 90% 8%, #051826 0%, transparent 50%),
    linear-gradient(135deg, var(--primary-dark) 0%, #051826 100%);
  padding: 56px 24px 64px;
  overflow: hidden;
  margin-bottom: 32px;
}

.cover::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle, rgba(255,255,255,0.15) 1px, transparent 1px);
  background-size: 28px 28px;
  pointer-events: none;
}

.cover-shape {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}

.cover-shape-1 {
  width: 140px;
  height: 140px;
  border: 3px solid rgba(0, 0, 0, 0.25);
  top: 30px;
  right: -50px;
}

.cover-shape-2 {
  width: 160px;
  height: 160px;
  border: 2px solid rgba(0, 0, 0, 0.2);
  bottom: -50px;
  left: -40px;
}

.cover-shape-3 {
  width: 36px;
  height: 36px;
  background: rgba(0, 0, 0, 0.5);
  bottom: 70px;
  right: 50px;
}

.cover-sparkle {
  position: absolute;
  color: rgba(255,255,255,.6);
  font-weight: 900;
  font-size: 22px;
  pointer-events: none;
  animation: sparkleFloat 3.2s ease-in-out infinite;
}

.cover-sparkle-1 { top: 60px; left: 24px; font-size: 28px; animation-delay: 0s; }
.cover-sparkle-2 { top: 45%; right: 28px; font-size: 18px; animation-delay: .7s; }
.cover-sparkle-3 { bottom: 50px; left: 60px; font-size: 22px; animation-delay: 1.4s; }

.cover-content {
  position: relative;
  z-index: 2;
  text-align: center;
  max-width: 600px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.cover-badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: rgba(0, 0, 0, 0.92);
  color: var(--primary-light);
  padding: 10px 20px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0;
  margin-bottom: 20px;
}

.cover-badge-dot {
  width: 5px;
  height: 5px;
  background: var(--primary-light);
  border-radius: 50%;
}

.cover-deep {
  font-size: clamp(72px, 18vw, 140px);
  font-weight: 700;
  color: #fff;
  letter-spacing: 0;
  line-height: 0.9;
  text-shadow: 0 4px 20px rgba(0,0,0,.3);
}
.cover-deep-img {
  width: clamp(200px, 50vw, 380px);
  aspect-ratio: 700 / 176;
  height: auto;
  display: block;
  margin: 0 auto;
  filter: drop-shadow(4px 4px 0 rgba(0,0,0,0.08));
}

.cover-tagline {
  font-size: clamp(15px, 3vw, 20px);
  font-weight: 700;
  color: #fff;
  text-shadow: 0 2px 10px rgba(0,0,0,.3);
  margin-top: 12px;
  letter-spacing: 0;
}

.cover-divider {
  width: 56px;
  height: 4px;
  background: #fff;
  opacity: .85;
  border-radius: 2px;
  margin: 20px auto;
}

.cover-title {
  font-size: clamp(15px, 3.2vw, 18px);
  font-weight: 700;
  color: #fff;
  text-shadow: 0 2px 10px rgba(0,0,0,.3);
  letter-spacing: 0;
  line-height: 1.4;
  margin-bottom: 28px;
}

/* CTA Principal - SUPER DESTACADO */
.cover-cta {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  background: #000000;
  color: var(--primary-light);
  border: none;
  padding: 20px 36px;
  border-radius: var(--radius-full);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0;
  cursor: pointer;
  transition: var(--transition);
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
  position: relative;
  overflow: hidden;
  animation: pulseCTA 2.5s ease-in-out infinite;
}
.cover-cta::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -60%;
  width: 35%;
  height: 200%;
  background: linear-gradient(105deg, transparent 0%, rgba(255,168,92,.55) 50%, transparent 100%);
  transform: rotate(15deg);
  animation: ctaShine 3.2s ease-in-out infinite;
  animation-delay: 1s;
  pointer-events: none;
}

.cover-cta:hover {
  transform: translateY(-4px) scale(1.04);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
  animation: none;
}

.cover-cta-icon {
  font-size: 18px;
}

.cover-cta-arrow {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  background: var(--primary);
  color: #000000;
  border-radius: 50%;
  font-size: 12px;
  transition: transform 0.3s;
}

.cover-cta:hover .cover-cta-arrow {
  transform: translateX(4px) rotate(-12deg);
}

@keyframes pulseCTA {
  0%, 100% { box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4); }
  50% { box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4), 0 0 0 8px rgba(0, 0, 0, 0.15); }
}

/* ===== SEÇÕES PADRONIZADAS ===== */
.section {
  padding: 32px 0;
}

.section-header {
  margin-bottom: 24px;
}

.section-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: 0;
  text-transform: none;
  margin-bottom: 8px;
}

.section-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0;
  margin-bottom: 6px;
}

.section-subtitle {
  font-size: 14px;
  color: var(--text-tertiary);
}

/* ===== CARDS PADRONIZADOS ===== */
.card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  transition: var(--transition);
}

.card:hover {
  border-color: var(--border-light);
}

.card-highlight {
  background: linear-gradient(135deg, var(--primary-soft) 0%, transparent 100%);
  border-color: var(--primary-medium);
}

/* ===== ALERTAS DE AGENDAMENTOS PRÓXIMOS ===== */
.alerta-proximos {
  margin-bottom: 24px;
}

.alerta-card {
  background: linear-gradient(135deg, var(--primary-soft) 0%, transparent 100%);
  border: 1px solid var(--primary-medium);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 16px;
  transition: var(--transition);
}

.alerta-card:hover {
  border-color: var(--primary);
  transform: translateY(-1px);
}

.alerta-card.urgente {
  background: linear-gradient(135deg, rgba(239, 68, 68, 0.1) 0%, transparent 100%);
  border-color: rgba(239, 68, 68, 0.4);
}

.alerta-card.amanha {
  background: linear-gradient(135deg, rgba(245, 158, 11, 0.1) 0%, transparent 100%);
  border-color: rgba(245, 158, 11, 0.4);
}

.alerta-card.hoje {
  background: linear-gradient(135deg, var(--success-bg) 0%, transparent 100%);
  border-color: rgba(16, 185, 129, 0.4);
}

.alerta-dias {
  flex-shrink: 0;
  width: 60px;
  height: 60px;
  border-radius: var(--radius-md);
  background: var(--bg-3);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--border-light);
}

.alerta-dias-numero {
  font-size: 22px;
  font-weight: 700;
  color: var(--primary);
  line-height: 1;
}

.alerta-dias-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-tertiary);
  text-transform: none;
  letter-spacing: 0;
  margin-top: 2px;
}

.alerta-card.hoje .alerta-dias-numero { color: var(--success); }
.alerta-card.amanha .alerta-dias-numero { color: var(--warning); }
.alerta-card.urgente .alerta-dias-numero { color: var(--error); }

.alerta-info {
  flex: 1;
  min-width: 0;
}

.alerta-info-nome {
  font-weight: 700;
  font-size: 16px;
  margin-bottom: 4px;
  letter-spacing: 0;
}

.alerta-info-data {
  font-size: 14px;
  color: var(--text-tertiary);
  font-weight: 600;
  text-transform: capitalize;
}

.alerta-info-tags {
  display: flex;
  gap: 6px;
  margin-top: 6px;
  flex-wrap: wrap;
}

.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  background: var(--bg-3);
  color: var(--text-secondary);
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0;
}

.tag-primary {
  background: var(--primary-medium);
  color: var(--primary-light);
}

.tag-urgent {
  background: rgba(239, 68, 68, 0.2);
  color: #FCA5A5;
}

/* ===== EVENTOS DO DEEP ===== */
.evento-card {
  background: linear-gradient(135deg, var(--bg-2) 0%, var(--bg-1) 100%);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 16px;
  transition: var(--transition);
  cursor: default;
}

.evento-card:hover {
  border-color: var(--primary-medium);
  transform: translateY(-2px);
}

/* Variante FEED: capa em destaque no topo (estilo Instagram) */
.evento-card.feed {
  display: block;
  padding: 0;
  overflow: hidden;
}
.evento-card.feed .evento-capa-grande {
  width: 100%;
  aspect-ratio: 4 / 5;          /* proporção tipo feed do Instagram */
  background-size: cover;
  background-position: center;
  background-color: var(--bg-1);
  position: relative;
}
.evento-card.feed .evento-feed-body {
  padding: 14px 16px 16px;
}

.evento-icone {
  flex-shrink: 0;
  width: 56px;
  height: 56px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--primary-soft), var(--primary-medium));
  border: 1px solid var(--primary-medium);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
}

.evento-capa {
  flex-shrink: 0;
  width: 56px;
  height: 56px;
  border-radius: var(--radius-md);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  border: 1px solid var(--border, rgba(255,255,255,.08));
}

.evento-info {
  flex: 1;
  min-width: 0;
}

.evento-titulo {
  font-weight: 700;
  font-size: 16px;
  margin-bottom: 4px;
  letter-spacing: 0;
}

.evento-meta {
  display: flex;
  gap: 12px;
  font-size: 12px;
  color: var(--text-tertiary);
  font-weight: 600;
  flex-wrap: wrap;
}

.evento-meta span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.evento-descricao {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 6px;
  line-height: 1.5;
}

.evento-empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-tertiary);
  font-size: 14px;
}

/* ===== INPUTS PADRONIZADOS ===== */
.input-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 20px;
}

.input-label {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-secondary);
  letter-spacing: 0;
}

.input-wrapper {
  position: relative;
  background: var(--bg-1);
  border: 1.5px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  transition: var(--transition);
}

.input-wrapper:focus-within {
  border-color: var(--primary);
  background: var(--primary-soft);
  box-shadow: 0 0 0 3px rgba(253, 127, 33, 0.1);
}

.input-base {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 16px;
  font-weight: 400;
  caret-color: var(--primary);
}

.input-base::placeholder {
  color: var(--text-muted);
  font-weight: 400;
}

textarea.input-base {
  resize: none;
  line-height: 1.6;
  font-family: 'Plus Jakarta Sans', sans-serif;
}

/* Input de data customizado */
input[type="date"].input-base,
input[type="time"].input-base {
  color-scheme: dark;
  cursor: pointer;
}

/* ===== PILLS / OPÇÕES ===== */
.pill-group {
  display: grid;
  gap: 10px;
}

.pill-group.cols-2 { grid-template-columns: repeat(2, 1fr); }
.pill-group.cols-3 { grid-template-columns: repeat(3, 1fr); }

.pill {
  padding: 14px 18px;
  background: var(--bg-1);
  border: 1.5px solid var(--border-light);
  border-radius: var(--radius-md);
  color: var(--text-secondary);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14px;
  font-weight: 700;
  text-align: center;
  cursor: pointer;
  transition: var(--transition);
  letter-spacing: 0;
}

.pill:hover:not(:disabled) {
  border-color: var(--primary);
  background: var(--primary-soft);
  color: var(--text-primary);
  transform: translateY(-1px);
}

.pill.selected {
  background: linear-gradient(135deg, var(--primary-medium), var(--primary-soft));
  border-color: var(--primary);
  color: var(--primary-light);
  font-weight: 700;
  box-shadow: 0 0 0 3px rgba(253, 127, 33, 0.1);
}

.pill:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* ===== CARDS DE LÍDER ===== */
.lider-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}

.lider-card {
  background: var(--bg-1);
  border: 2px solid var(--border-light);
  border-radius: var(--radius-lg);
  padding: 22px 14px;
  cursor: pointer;
  transition: var(--transition);
  text-align: center;
  font-family: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  min-height: 160px;
  justify-content: center;
}

.lider-card:hover {
  border-color: var(--primary);
  background: var(--primary-soft);
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
}

.lider-card.selected {
  background: linear-gradient(135deg, var(--primary-medium), var(--primary-soft));
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(253, 127, 33, 0.15);
}

.lider-avatar {
  font-size: 36px;
  line-height: 1;
}

/* ============================================
   📅 LISTA DE DATAS DISPONÍVEIS (jovem)
   Substitui o calendário — só as datas com horário livre
   ============================================ */
.data-mes-label {
  font-size: 12px; font-weight: 700; letter-spacing: 0; text-transform: none;
  color: var(--text-tertiary); margin: 18px 0 10px;
}
.data-mes-label:first-of-type { margin-top: 4px; }
.datas-lista { display: flex; flex-direction: column; gap: 10px; }

.data-card {
  display: flex; align-items: center; gap: 14px;
  width: 100%; text-align: left;
  background: var(--bg-3);
  border: 1.5px solid var(--border-light);
  border-radius: 16px; padding: 14px 16px;
  cursor: pointer; transition: var(--transition);
  font-family: inherit;
}
.data-card:hover {
  border-color: rgba(253, 127, 33, .5);
  transform: translateY(-1px);
  box-shadow: var(--shadow-sm, 0 4px 12px rgba(0,0,0,.15));
}
.data-card.selected {
  border-color: var(--primary);
  background: linear-gradient(135deg, rgba(253, 127, 33, .14), rgba(253, 127, 33, .06));
  box-shadow: 0 0 0 3px rgba(253, 127, 33, .15);
}

.data-card-dia {
  flex-shrink: 0; width: 52px; height: 52px;
  border-radius: 12px;
  background: rgba(253, 127, 33, .10);
  border: 1.5px solid rgba(253, 127, 33, .25);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: var(--transition);
}
.data-card.selected .data-card-dia {
  background: var(--primary); border-color: var(--primary);
}
.data-card-numero {
  font-size: 18px; font-weight: 700; line-height: 1;
  color: var(--text-primary);
}
.data-card.selected .data-card-numero { color: #fff; }
.data-card-semana {
  font-size: 12px; font-weight: 700; text-transform: none;
  letter-spacing: 0; color: var(--text-tertiary); margin-top: 2px;
}
.data-card.selected .data-card-semana { color: rgba(255,255,255,.85); }

.data-card-info { flex: 1; min-width: 0; }
.data-card-titulo {
  font-size: 16px; font-weight: 700; color: var(--text-primary);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-bottom: 3px;
}
.data-card-tag {
  font-size: 12px; font-weight: 700; text-transform: none; letter-spacing: 0;
  color: #fff; background: var(--primary);
  border-radius: 999px; padding: 2px 8px;
}
.data-card-horarios {
  font-size: 12px; color: var(--text-secondary);
}

.data-card-check {
  flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: #fff;
  background: var(--primary);
  opacity: 0; transform: scale(0.6);
  transition: var(--transition);
}
.data-card.selected .data-card-check { opacity: 1; transform: scale(1); }

.lider-info { flex: 1; min-width: 0; }

/* Foto do líder: imagem INTEIRA (quadrada, sem corte), moderna */
.lider-foto {
  width: 84px;
  height: 84px;
  border-radius: 20px;
  object-fit: cover; /* imagem é 1:1, então mostra inteira */
  display: block;
  border: 2px solid var(--border-light);
  box-shadow: 0 3px 10px rgba(0,0,0,.25);
  transition: var(--transition);
}
.lider-card:hover .lider-foto {
  transform: scale(1.04);
}
.lider-card.selected .lider-foto {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(253,127,33,.35), 0 4px 14px rgba(253,127,33,.3);
}

.lider-nome {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: 0;
}

.lider-card.selected .lider-nome {
  color: var(--primary-light);
}

.lider-desc {
  font-size: 12px;
  color: var(--text-tertiary);
  font-weight: 400;
}

.lider-tag {
  display: inline-block;
  margin-top: 4px;
  padding: 3px 8px;
  background: var(--primary-medium);
  color: var(--primary);
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: none;
}

/* ===== CALENDÁRIO MODERNO E BONITO ===== */
.calendar {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  margin-bottom: 20px;
}

.calendar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}

.calendar-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: capitalize;
}

.calendar-nav {
  display: flex;
  gap: 6px;
}

.calendar-nav-btn {
  width: 36px;
  height: 36px;
  background: var(--bg-3);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  color: var(--text-primary);
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: var(--transition);
}

.calendar-nav-btn:hover {
  border-color: var(--primary);
  background: var(--primary-soft);
  color: var(--primary);
}

.calendar-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  margin-bottom: 8px;
}

.calendar-weekday {
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: none;
  letter-spacing: 0;
  padding: 6px 0;
}

.calendar-days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}

.calendar-day {
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  background: rgba(34, 197, 94, 0.08);
  border: 1.5px solid rgba(34, 197, 94, 0.25);
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 700;
  color: var(--text-primary);
  cursor: pointer;
  transition: var(--transition);
  position: relative;
  font-family: inherit;
  padding: 4px;
  overflow: hidden;
}

.calendar-day:hover:not(:disabled):not(.empty):not(.closed):not(.indisponivel) {
  border-color: var(--primary);
  background: var(--primary-soft);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(253, 127, 33, 0.2);
}

.calendar-day.empty {
  background: transparent;
  border: none;
  cursor: default;
  opacity: 0.2;
}

.calendar-day.disabled {
  opacity: 0.25;
  cursor: not-allowed;
  color: var(--text-muted);
  background: var(--bg-1);
  border-color: var(--border);
}

.calendar-day.today {
  border-color: var(--primary);
  border-width: 2.5px;
  background: var(--primary-soft);
  color: var(--primary);
  font-weight: 900;
}

.calendar-day.today::before {
  content: '';
  position: absolute;
  bottom: 4px;
  width: 4px;
  height: 4px;
  background: var(--primary);
  border-radius: 50%;
}

.calendar-day.selected {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  border-color: var(--primary);
  color: white;
  font-weight: 700;
  transform: scale(1.05);
  box-shadow: 0 4px 16px rgba(253, 127, 33, 0.4);
}

/* Data marcada no modo seleção múltipla */
.calendar-day.multi-selected {
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  border-color: #3b82f6;
  color: white;
  font-weight: 700;
  transform: scale(1.06);
  box-shadow: 0 4px 16px rgba(37, 99, 235, 0.5);
  animation: multiPop 0.25s ease;
}

@keyframes multiPop {
  0% { transform: scale(0.9); }
  60% { transform: scale(1.12); }
  100% { transform: scale(1.06); }
}

.day-check-multi {
  position: absolute;
  top: 2px;
  right: 4px;
  font-size: 12px;
  font-weight: 900;
  color: #fff;
}

/* Data fechada (líder bloqueou) - VERMELHO claro com X */
.calendar-day.closed {
  background: rgba(239, 68, 68, 0.12);
  border-color: rgba(239, 68, 68, 0.4);
  color: #ef4444;
  cursor: not-allowed;
  border-style: dashed;
}

.calendar-day.closed::after {
  content: '✕';
  position: absolute;
  top: 2px;
  right: 4px;
  font-size: 12px;
  font-weight: 900;
  color: #ef4444;
}

/* Indisponível (sem horários) - cinza apagado */
.calendar-day.indisponivel {
  background: var(--bg-2);
  border-color: var(--border);
  color: var(--text-muted);
  cursor: not-allowed;
  opacity: 0.5;
}

/* Tem evento - AZUL claro */
.calendar-day.com-evento {
  background: rgba(37, 99, 235, 0.12);
  border-color: rgba(37, 99, 235, 0.4);
  color: #60a5fa;
}

.calendar-day .day-event-dot {
  position: absolute;
  bottom: 4px;
  width: 5px;
  height: 5px;
  background: var(--primary);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--primary);
}

.calendar-day.com-evento.today::before { display: none; }

/* Tem agendamento próprio - bordinha verde */
.calendar-day.com-agendamento::before {
  content: '';
  position: absolute;
  top: 3px;
  right: 3px;
  width: 6px;
  height: 6px;
  background: var(--success);
  border-radius: 50%;
}

/* Legenda do calendário */
.calendar-legend {
  margin-top: 18px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  font-size: 12px;
  color: var(--text-tertiary);
  font-weight: 600;
}

/* ===== PAINEL SELEÇÃO MÚLTIPLA ===== */
.selecao-multipla-painel {
  background: linear-gradient(135deg, rgba(37, 99, 235, 0.12), rgba(37, 99, 235, 0.05));
  border: 1px solid rgba(37, 99, 235, 0.3);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 16px;
}

.selecao-contador {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.selecao-numero {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 32px;
  height: 32px;
  padding: 0 8px;
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
  color: #fff;
  border-radius: var(--radius-full);
  font-size: 16px;
  font-weight: 700;
}

.selecao-acoes {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.btn-fechar-massa {
  background: var(--error);
  color: #fff;
  flex: 1;
  min-width: 100px;
}

.btn-fechar-massa:hover { filter: brightness(1.1); }

.btn-abrir-massa {
  background: var(--success);
  color: #fff;
  flex: 1;
  min-width: 100px;
}

.btn-abrir-massa:hover { filter: brightness(1.1); }

.selecao-dica {
  font-size: 14px;
  color: var(--text-tertiary);
  text-align: center;
  padding: 4px;
}


.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
}

.legend-dot {
  width: 14px;
  height: 14px;
  border-radius: 4px;
  flex-shrink: 0;
  border: 1.5px solid var(--border-light);
}

.legend-dot.livre { background: rgba(34, 197, 94, 0.15); border-color: rgba(34, 197, 94, 0.5); }
.legend-dot.today { background: var(--primary-soft); border-color: var(--primary); border-width: 2px; }
.legend-dot.selected { background: var(--primary); border-color: var(--primary); }
.legend-dot.closed { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.5); border-style: dashed; }
.legend-dot.indisponivel { background: var(--bg-2); border-color: var(--border); opacity: 0.6; }
.legend-dot.com-evento { background: rgba(37, 99, 235, 0.15); border-color: rgba(37, 99, 235, 0.5); }
.legend-dot.com-agendamento { background: var(--bg-1); position: relative; }
.legend-dot.com-agendamento::after {
  content: '';
  position: absolute;
  top: 1px;
  right: 1px;
  width: 5px;
  height: 5px;
  background: var(--success);
  border-radius: 50%;
}

/* ===== HORÁRIOS ===== */
.horarios-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 24px;
}

.horario {
  background: var(--bg-1);
  border: 1.5px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 14px 8px;
  cursor: pointer;
  transition: var(--transition);
  text-align: center;
  font-family: inherit;
  min-height: 68px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
}

.horario:hover:not(:disabled) {
  border-color: var(--primary);
  background: var(--primary-soft);
  transform: translateY(-1px);
}

.horario.selected {
  background: linear-gradient(135deg, var(--primary-medium), var(--primary-soft));
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(253, 127, 33, 0.15);
}

.horario:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.horario-time {
  font-size: 18px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: 0;
}

.horario.selected .horario-time {
  color: var(--primary-light);
}

.horario:disabled .horario-time {
  color: var(--text-muted);
  text-decoration: line-through;
}

.horario-status {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: none;
}

.horario-status.ok { color: var(--success); }
.horario-status.no { color: var(--text-muted); }

/* ===== FORM BOX ===== */
.form-box {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 28px;
  max-width: 540px;
  margin: 0 auto;
}

.form-header {
  margin-bottom: 24px;
}

.form-header h3 {
  margin-bottom: 6px;
}

.form-subtitle {
  font-size: 14px;
  color: var(--text-tertiary);
}

.form-section {
  margin-bottom: 0;
}

.form-section + .form-section {
  margin-top: 24px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
}

.form-section-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: 0;
  text-transform: none;
  margin-bottom: 16px;
}

.form-actions {
  display: flex;
  gap: 12px;
  margin-top: 28px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
}

/* ===== STEPS BAR ===== */
.steps-bar {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 28px;
  padding: 0 8px;
}

.step {
  flex: 1;
  text-align: center;
}

.step-circle {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--bg-1);
  border: 1.5px solid var(--border-light);
  color: var(--text-tertiary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  margin: 0 auto 6px;
  transition: var(--transition);
}

.step.active .step-circle {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  border-color: var(--primary);
  color: white;
  transform: scale(1.1);
  box-shadow: var(--shadow-glow);
}

.step.done .step-circle {
  background: var(--success-bg);
  border-color: var(--success);
  color: var(--success);
}

.step-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  letter-spacing: 0;
  text-transform: none;
}

.step.active .step-label { color: var(--primary); }

/* ===== NOVO: NAVEGAÇÃO POR TABS DO ADMIN ===== */
.admin-tabs {
  position: sticky;
  top: 68px;
  z-index: 50;
  background: rgba(0, 0, 0, 0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}

.admin-tabs-inner {
  display: flex;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 12px 0;
  -webkit-overflow-scrolling: touch;
}

.admin-tabs-inner::-webkit-scrollbar { display: none; }

.admin-tab {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 18px;
  background: transparent;
  border: 1.5px solid transparent;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: var(--transition);
  font-family: inherit;
  color: var(--text-tertiary);
  flex-shrink: 0;
  min-width: 80px;
}

.admin-tab:hover {
  background: var(--bg-2);
  color: var(--text-primary);
}

.admin-tab.active {
  background: var(--primary-soft);
  border-color: var(--primary-medium);
  color: var(--primary);
}

.admin-tab.pendentes.active {
  background: var(--warning-bg);
  border-color: rgba(245, 158, 11, 0.4);
  color: var(--warning);
}

.admin-tab-icon { font-size: 18px; line-height: 1; }

/* ============================================
   🙏 PEDIDO DE ORAÇÃO — visual organizado
   ============================================ */

/* Card na home do jovem */
.oracao-card {
  border: 1.5px solid rgba(253, 127, 33, .45);
  background: linear-gradient(135deg, rgba(253, 127, 33, .12), rgba(253, 127, 33, .05));
  padding: 20px !important;
  transition: var(--transition);
}
@keyframes oracao-glow {
  0%, 100% { box-shadow: 0 0 0 4px rgba(253, 127, 33, .10), 0 8px 22px rgba(253, 127, 33, .32); }
  50%      { box-shadow: 0 0 0 8px rgba(253, 127, 33, .20), 0 10px 32px rgba(253, 127, 33, .55); }
}
/* Luz que varre a imagem de tempos em tempos (chama atenção) */
@keyframes oracao-shine {
  0%, 55% { left: -90%; }
  100%    { left: 170%; }
}
.oracao-brilho {
  position: relative; display: inline-block; overflow: hidden;
  border-radius: 20px; flex-shrink: 0; line-height: 0;
  border: 2.5px solid rgba(253, 127, 33, .75);
  animation: oracao-glow 3s ease-in-out infinite;
}
.oracao-brilho::after {
  content: ''; position: absolute; top: -60%; left: -90%;
  width: 55%; height: 220%;
  background: linear-gradient(105deg, transparent 0%, rgba(255,255,255,.06) 30%, rgba(255,255,255,.55) 50%, rgba(255,255,255,.06) 70%, transparent 100%);
  transform: rotate(8deg);
  animation: oracao-shine 3.4s ease-in-out infinite;
  pointer-events: none;
}
.oracao-brilho img { display: block; }
.oracao-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: rgba(253, 127, 33, .6); }
.oracao-capa-mini {
  width: 128px; height: 128px;
  object-fit: cover; display: block;
}
.oracao-card-titulo {
  font-size: 18px; font-weight: 700; letter-spacing: 0;
  color: var(--text-primary); margin-bottom: 3px;
}
.oracao-card-sub {
  font-size: 14px; line-height: 1.55; color: var(--text-secondary);
}

/* Modal: cabeçalho com a arte */
.oracao-hero {
  text-align: center;
  margin: 2px 0 16px;
}
.oracao-hero .oracao-brilho { border-radius: 28px; }
.oracao-hero img {
  width: 200px; height: 200px;
  object-fit: cover;
}
.oracao-titulo {
  font-size: 22px; font-weight: 700; letter-spacing: 0;
  color: var(--text-primary); text-align: center; margin: 12px 0 6px;
}
.oracao-privacidade {
  display: block; text-align: center;
  font-size: 12px; font-weight: 600; line-height: 1.5;
  color: var(--text-secondary);
  background: rgba(253, 127, 33, .10);
  border: 1px solid rgba(253, 127, 33, .25);
  border-radius: 16px; padding: 9px 16px;
  max-width: 100%; width: fit-content; margin: 0 auto 18px;
}

/* Campos do formulário */
.oracao-label {
  display: block; font-size: 12px; font-weight: 700;
  letter-spacing: 0; text-transform: none;
  color: var(--primary); margin-bottom: 8px;
}
.oracao-campo { margin-bottom: 16px; }
.oracao-input,
.oracao-textarea {
  display: block; width: 100%;
  font-size: 16px; line-height: 1.6; font-family: inherit;
  color: var(--text-primary);
  background: var(--bg-3);
  border: 1.5px solid var(--border-light);
  border-radius: 16px; padding: 13px 16px;
  transition: var(--transition);
  box-sizing: border-box;
}
.oracao-textarea { min-height: 130px; resize: vertical; }
.oracao-input:focus,
.oracao-textarea:focus {
  outline: none; border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(253, 127, 33, .18);
}
.oracao-input::placeholder,
.oracao-textarea::placeholder { color: var(--text-tertiary); }
.oracao-input {
  width: 100%; display: block;
  font-size: 16px; line-height: 1.5; font-family: inherit;
  color: var(--text-primary);
  background: var(--bg-3);
  border: 1.5px solid var(--border-light);
  border-radius: 16px; padding: 13px 16px;
  transition: var(--transition);
}
.oracao-input:focus {
  outline: none; border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(253, 127, 33, .18);
}
.oracao-input::placeholder { color: var(--text-tertiary); }
.oracao-anonimo {
  display: flex; align-items: center; gap: 12px;
  font-size: 14px; color: var(--text-secondary); cursor: pointer;
  background: var(--bg-3);
  border: 1.5px solid var(--border-light);
  border-radius: 16px; padding: 13px 16px; margin: 14px 0 20px;
  transition: var(--transition);
}
.oracao-anonimo:hover { border-color: rgba(253, 127, 33, .5); }
.oracao-anonimo input { width: 19px; height: 19px; accent-color: var(--primary); flex-shrink: 0; }

@media (max-width: 480px) {
  .oracao-hero img { width: 160px; height: 160px; }
  .oracao-capa-mini { width: 108px; height: 108px; }
  .oracao-titulo { font-size: 18px; }
}

.admin-tab-label {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0;
  text-transform: none;
}

.admin-tab-badge {
  position: absolute;
  top: 4px;
  right: 6px;
  background: var(--primary);
  color: #000;
  font-size: 12px;
  font-weight: 700;
  padding: 2px 6px;

}

@keyframes pulseBadge {

  50% { transform: scale(1.15); }
}

}

/* ===== ALERTAS - SETA NO FIM ===== */

  font-weight: 700;

/* ===== AG ITEM - SETA NO FIM ===== */

}

.ag-item.clickable:hover .ag-arrow { color: var(--primary); }

.ag-item.pendente {

.ag-actions {

/* ===== ALERTAS DE STATUS ===== */
.alert-warning {

.hc-avatar {

/* ===== ANIVERSARIANTES — FAIXA COM FOTOS ===== */

/* ===== ANIVERSARIANTES ===== */
.aniversariantes-grid {

}

.aniv-card {
  background: linear-gradient(135deg, var(--primary-soft) 0%, rgba(0,0,0,0.3) 100%);

}

.aniv-card.aniv-hoje {
  border-color: var(--primary);
  border-width: 2px;

  animation: cardStagger 0.5s cubic-bezier(0.22, 1, 0.36, 1) both, pulseGlow 2s ease-in-out 0.5s infinite;
}

@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 20px var(--primary-medium); }
  50% { box-shadow: 0 0 30px var(--primary); }
}

.aniv-card.aniv-passou {
  opacity: 0.55;
}

/* Destaque dos aniversariantes da SEMANA */
.aniv-card.aniv-semana {
  border-color: #FFD700;
  border-width: 2px;

}

  font-weight: 700;

  letter-spacing: 0;
  overflow: hidden;
}
.aniv-badge-hoje::after {
  content: '';
  position: absolute;
  top: -50%;
  left: -60%;
  width: 30%;
  height: 200%;
  background: linear-gradient(105deg, transparent 0%, rgba(255,255,255,.7) 50%, transparent 100%);
  transform: rotate(15deg);
  animation: ctaShine 2.4s ease-in-out infinite;
}

.aniv-icon {

}

}

  animation-delay: .8s;
  transform-origin: 70% 100%;
}
@keyframes anivBoloWiggle {
  0%, 100% { transform: rotate(0deg) scale(1); }
  15% { transform: rotate(-14deg) scale(1.05); }
  30% { transform: rotate(11deg) scale(1.05); }
  45% { transform: rotate(-7deg) scale(1.02); }
  60% { transform: rotate(4deg); }
  80% { transform: rotate(0deg); }
}

}

  min-height: 64px;
  justify-content: center;
}

.admin-horario:hover:not(:disabled) {
  transform: translateY(-1px);
}

.admin-horario.travado {
  background: rgba(239, 68, 68, 0.06);
  border-color: rgba(239, 68, 68, 0.35);
}

.admin-horario.ocupado {
  background: var(--primary-soft);
  border-color: var(--primary);
  cursor: not-allowed;
}

.admin-horario-time {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0;
}

.admin-horario.travado .admin-horario-time {
  text-decoration: line-through;
  color: #FCA5A5;
}

.admin-horario.ocupado .admin-horario-time {
  color: var(--primary-light);
}

.admin-horario-status {
  font-size: 12px;
  font-weight: 700;
  color: var(--success);
}

.admin-horario.travado .admin-horario-status { color: var(--error); }
.admin-horario.ocupado .admin-horario-status { color: var(--primary); }

/* ===== AGENDAMENTOS NA LISTA ADMIN ===== */
.ag-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.ag-item {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 16px;
  transition: var(--transition);
}

.ag-item:hover { border-color: var(--border-light); }

.ag-item.ag-urgent {
  border-color: rgba(239, 68, 68, 0.4);
  background: linear-gradient(135deg, rgba(239, 68, 68, 0.04) 0%, var(--bg-1) 100%);
}

.ag-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}

.ag-nome {
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 0;
}

.ag-meta {
  display: flex;
  gap: 10px;
  font-size: 12px;
  color: var(--text-tertiary);
  font-weight: 600;
  flex-wrap: wrap;
  margin-bottom: 8px;
}

.ag-detail {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 8px;
  padding: 8px 12px;
  background: var(--bg-2);
  border-radius: var(--radius-sm);
}

.ag-detail strong { color: var(--primary); }

.ag-phone {
  color: var(--primary);
  font-size: 12px;
  margin-top: 6px;
  font-weight: 700;
}

/* ===== STATS GRID ===== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}

/* ===== STATUS DE CONEXÃO (diagnóstico) ===== */
.conexao-status {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border-radius: var(--radius-lg);
  margin-bottom: 20px;
  border: 1px solid;
}

.conexao-status.ok {
  background: rgba(34, 197, 94, 0.1);
  border-color: rgba(34, 197, 94, 0.3);
}

.conexao-status.erro {
  background: rgba(239, 68, 68, 0.1);
  border-color: rgba(239, 68, 68, 0.35);
}

.conexao-icon {
  font-size: 18px;
  flex-shrink: 0;
}

.conexao-info {
  flex: 1;
  min-width: 0;
}

.conexao-titulo {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-primary);
}

.conexao-sub {
  font-size: 12px;
  color: var(--text-tertiary);
  margin-top: 2px;
}

.conexao-btn {
  flex-shrink: 0;
  width: 40px;
  height: 40px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--bg-2);
  font-size: 18px;
  cursor: pointer;
  transition: var(--transition);
}

.conexao-btn:active {
  transform: rotate(180deg);
}


.stat-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px;
}

.stat-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-tertiary);
  letter-spacing: 0;
  text-transform: none;
  margin-bottom: 8px;
}

.stat-value {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: 0;
  line-height: 1;
}

.stat-card.primary .stat-value { color: var(--primary); }
.stat-card.success .stat-value { color: var(--success); }
.stat-card.error .stat-value { color: var(--error); }

/* ===== CONFIRM LIST ===== */
.confirm-list {
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  overflow: hidden;
}

.confirm-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  gap: 16px;
}

.confirm-item:last-child { border-bottom: none; }

.confirm-label {
  font-size: 14px;
  color: var(--text-tertiary);
  font-weight: 600;
  flex-shrink: 0;
}

.confirm-value {
  font-size: 14px;
  font-weight: 700;
  text-align: right;
}

.confirm-value.highlight {
  color: var(--primary);
  font-weight: 700;
  font-size: 16px;
}

/* ===== TOAST ===== */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-3);
  border: 1px solid var(--border-light);
  color: var(--text-primary);
  padding: 14px 22px;
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 600;
  z-index: 1000;
  box-shadow: var(--shadow-lg);
  animation: toastIn 0.3s ease-out;
}

.toast.success { border-color: rgba(16, 185, 129, 0.4); }
.toast.error { border-color: rgba(239, 68, 68, 0.4); }

/* ===== SPLASH ===== */
.splash {
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(circle at 50% 42%, var(--primary-light) 0%, var(--primary) 30%, transparent 58%),
    radial-gradient(circle at 12% 88%, #FF8A3D 0%, transparent 55%),
    radial-gradient(circle at 88% 10%, #051826 0%, transparent 50%),
    linear-gradient(135deg, var(--primary-dark) 0%, #051826 100%);
  z-index: 10000;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: splashOut 0.55s cubic-bezier(0.4, 0, 1, 1) 2.15s forwards;
  pointer-events: none;
  overflow: hidden;
}

.splash::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle, rgba(255,255,255,0.15) 1px, transparent 1px);
  background-size: 28px 28px;
  opacity: 0.5;
  animation: splashGridDrift 6s linear infinite;
}

.splash-content {
  text-align: center;
  position: relative;
  z-index: 2;
  padding: 32px;
}

.splash-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(0, 0, 0, 0.92);
  color: var(--primary-light);
  padding: 8px 18px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0;
  margin-bottom: 20px;
}

.splash-logo {
  font-size: clamp(80px, 20vw, 160px);
  font-weight: 700;
  color: #000;
  letter-spacing: 0;
  line-height: 0.9;
  text-shadow: 4px 4px 0 rgba(0,0,0,0.08);
}
.splash-logo-wrap {
  position: relative;
  display: inline-block;
  overflow: hidden;
  animation: splashLogoIn 0.75s cubic-bezier(0.22, 1.6, 0.36, 1) both;
}
.splash-logo-img {
  width: clamp(220px, 55vw, 420px);
  aspect-ratio: 700 / 176;
  height: auto;
  display: block;
  filter: drop-shadow(4px 4px 0 rgba(0,0,0,0.08));
  opacity: 0;
  transition: opacity 0.25s ease;
}
.splash-logo-img[src] {
  opacity: 1;
}
.splash-shine {
  position: absolute;
  top: -30%;
  left: -60%;
  width: 45%;
  height: 160%;
  background: linear-gradient(105deg, transparent 0%, rgba(255,255,255,0) 30%, rgba(255,255,255,.75) 50%, rgba(255,255,255,0) 70%, transparent 100%);
  transform: rotate(12deg);
  animation: splashShine 1s cubic-bezier(0.4, 0, 0.2, 1) 0.55s both;
  pointer-events: none;
}

.splash-tagline {
  font-size: clamp(15px, 3vw, 20px);
  font-weight: 700;
  color: #000;
  margin-top: 10px;
}

.splash-divider {
  width: 50px;
  height: 4px;
  background: #000;
  margin: 18px auto;
  border-radius: 2px;
}

.splash-title {
  font-size: clamp(14px, 3.5vw, 24px);
  font-weight: 700;
  color: #fff;
  text-shadow: 0 2px 12px rgba(0,0,0,.35);
  letter-spacing: 0;
  white-space: nowrap;
  margin-top: 22px;
  opacity: 0;
  animation: splashFadeUp 0.55s ease-out 0.5s both;
}

.splash-loader {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  margin-top: 28px;
  opacity: 0;
  animation: splashFadeUp 0.5s ease-out 0.85s both;
}
.splash-loader span {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,.3);
  animation: splashDot 1.1s ease-in-out infinite;
}
.splash-loader span:nth-child(1) { animation-delay: 0s; }
.splash-loader span:nth-child(2) { animation-delay: 0.15s; }
.splash-loader span:nth-child(3) { animation-delay: 0.3s; }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: #0a0a0e;
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal {
  background: var(--bg-2);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  padding: 24px;
  max-width: 480px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}

/* === MODAL ANIVERSÁRIO (festivo e decorativo) === */
.aniv-detalhe-modal {
  position: relative;
  max-width: 400px;
  text-align: center;
  padding: 28px 22px 22px;
  background:
    radial-gradient(ellipse at top, rgba(253,127,33,.18), transparent 60%),
    radial-gradient(ellipse at bottom, rgba(124,92,255,.12), transparent 60%),
    linear-gradient(160deg, var(--bg-2), var(--bg-1));
  border: 1px solid rgba(253,127,33,.25);
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(253,127,33,.18);
}
.aniv-detalhe-close {
  position: absolute;
  top: 12px; right: 12px;
  z-index: 2;
}
.aniv-detalhe-badge-hoje {
  display: inline-block;
  margin: 0 auto 14px;
  padding: 6px 14px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0;
  border-radius: 999px;
  box-shadow: 0 4px 14px rgba(253,127,33,.4);
  animation: anivPulse 1.8s ease-in-out infinite;
}
@keyframes anivPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}
.aniv-confete {
  position: absolute;
  font-size: 22px;
  opacity: .55;
  pointer-events: none;
  animation: anivFloat 4s ease-in-out infinite;
}
.aniv-confete-1 { top: 12px; left: 18px; animation-delay: 0s; }
.aniv-confete-2 { top: 30px; right: 56px; animation-delay: .6s; font-size: 18px; }
.aniv-confete-3 { bottom: 110px; left: 14px; animation-delay: 1.2s; font-size: 16px; }
.aniv-confete-4 { bottom: 90px; right: 16px; animation-delay: 1.8s; }
@keyframes anivFloat {
  0%, 100% { transform: translateY(0) rotate(0); opacity: .4; }
  50% { transform: translateY(-8px) rotate(8deg); opacity: .7; }
}
.aniv-detalhe-foto-wrap {
  display: inline-block;
  position: relative;
  margin: 0 auto 16px;
  padding: 4px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, var(--primary), var(--primary-dark), #ffd56b, var(--primary));
  box-shadow: 0 8px 28px rgba(253,127,33,.32);
  animation: anivRingSpin 5s linear infinite;
}
@keyframes anivRingSpin {
  from { filter: hue-rotate(0deg); transform: rotate(0deg); }
  to { filter: hue-rotate(0deg); transform: rotate(360deg); }
}
.aniv-detalhe-foto,
.aniv-detalhe-foto-fallback {
  animation: anivRingSpinCounter 5s linear infinite;
}
@keyframes anivRingSpinCounter {
  from { transform: rotate(0deg); }
  to { transform: rotate(-360deg); }
}
.aniv-detalhe-foto {
  display: block;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid var(--bg-2);
}
.aniv-detalhe-foto-fallback {
  background: linear-gradient(135deg, var(--primary-soft), var(--primary-medium));
  font-size: 56px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
}
.aniv-detalhe-nome {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 6px;
  color: var(--text-primary);
  line-height: 1.2;
}
.aniv-detalhe-idade {
  font-size: 14px;
  color: var(--primary);
  margin-bottom: 18px;
  font-weight: 600;
}
.aniv-detalhe-data-card {
  background: var(--bg-3);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px 18px;
  margin-bottom: 18px;
}
.aniv-detalhe-data-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-tertiary);
  letter-spacing: 0;
  margin-bottom: 6px;
}
.aniv-detalhe-data-valor {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
}
.aniv-detalhe-btn {
  margin-top: 4px;
}

.modal-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 0;
}

.modal-close {
  background: none;
  border: none;
  color: var(--text-tertiary);
  font-size: 22px;
  cursor: pointer;
  padding: 4px 8px;
}

/* ===== PASTORAL CARD (TELA SUCESSO) ===== */
.sucesso {
  min-height: calc(100vh - 70px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  gap: 20px;
}

.sucesso-confirmacao {
  text-align: center;
  max-width: 480px;
  width: 100%;
  animation: scaleIn 0.5s ease-out;
}

.sucesso-check {
  width: 84px;
  height: 84px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--success), #059669);
  color: white;
  font-size: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 16px;
  font-weight: 700;
  box-shadow: 0 8px 32px rgba(16, 185, 129, 0.4);
  animation: bounceCheck 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes bounceCheck {
  0% { transform: scale(0); }
  60% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

.sucesso-titulo {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 0;
  margin-bottom: 6px;
}

.sucesso-sub {
  color: var(--text-tertiary);
  font-size: 16px;
  font-weight: 600;
}

.sucesso-card {
  max-width: 480px;
  width: 100%;
  background: linear-gradient(135deg, var(--primary-soft) 0%, transparent 100%);
  border: 1px solid var(--primary-medium);
  border-radius: var(--radius-xl);
  padding: 24px;
  text-align: center;
  animation: fadeInUp 0.6s ease-out;
}

.sucesso-data {
  font-size: 16px;
  font-weight: 700;
  color: var(--primary);
  text-transform: capitalize;
  letter-spacing: 0;
  margin-bottom: 6px;
}

.sucesso-horario {
  font-size: 56px;
  font-weight: 700;
  letter-spacing: 0;
  color: var(--text-primary);
  line-height: 1;
  margin-bottom: 20px;
  text-shadow: 0 0 40px rgba(253, 127, 33, 0.3);
}

.sucesso-info {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  padding-top: 16px;
  border-top: 1px solid var(--primary-medium);
}

.sucesso-info-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.sucesso-info-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-tertiary);
  letter-spacing: 0;
  text-transform: none;
}

.sucesso-info-valor {
  font-size: 14px;
  font-weight: 700;
}

.sucesso-aviso {
  max-width: 480px;
  width: 100%;
  background: var(--info-bg);
  border: 1px solid rgba(59, 130, 246, 0.3);
  border-radius: var(--radius-md);
  padding: 12px 16px;
  font-size: 14px;
  color: #93C5FD;
  text-align: center;
  font-weight: 600;
  animation: fadeIn 0.8s ease-out;
}

.sucesso-aviso strong { color: #BFDBFE; }

.pastoral-card {
  max-width: 640px;
  width: 100%;
  background: linear-gradient(135deg, var(--primary-soft) 0%, transparent 100%);
  border: 1px solid var(--primary-medium);
  border-radius: var(--radius-xl);
  padding: 32px;
  text-align: left;
  position: relative;
  overflow: hidden;
  animation: fadeInUp 0.9s ease-out;
}

.pastoral-card::before {
  content: '';
  position: absolute;
  top: -80px;
  right: -80px;
  width: 200px;
  height: 200px;
  background: radial-gradient(circle, var(--primary-medium) 0%, transparent 70%);
  pointer-events: none;
}

.pastoral-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 22px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--primary-medium);
  position: relative;
  z-index: 1;
}

.pastoral-icon {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
  box-shadow: var(--shadow-glow);
}

.pastoral-title {
  font-size: 18px;
  color: var(--primary);
  letter-spacing: 0;
}

.pastoral-content {
  position: relative;
  z-index: 1;
}

.pastoral-content p {
  font-size: 16px;
  line-height: 1.8;
  color: var(--text-secondary);
  margin-bottom: 14px;
}

.pastoral-content p:last-of-type { margin-bottom: 0; }
.pastoral-content strong { color: var(--primary); }

.pastoral-footer {
  margin-top: 22px;
  padding-top: 18px;
  border-top: 1px solid var(--primary-medium);
  text-align: center;
  font-size: 12px;
  color: var(--text-tertiary);
  font-weight: 700;
  letter-spacing: 0;
  position: relative;
  z-index: 1;
}

.pastoral-footer span { color: var(--primary); margin: 0 6px; }

.link-voltar {
  margin-top: 28px;
  background: transparent;
  border: none;
  color: var(--text-tertiary);
  font-size: 12px;
  font-weight: 400;
  font-family: inherit;
  cursor: pointer;
  padding: 8px 16px;
  text-decoration: underline;
  text-underline-offset: 4px;
  text-decoration-color: rgba(168, 168, 168, 0.3);
  transition: var(--transition);
}

.link-voltar:hover {
  color: var(--primary);
  text-decoration-color: var(--primary);
}

/* ===== ANIMAÇÕES ===== */
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
@keyframes splashLogoIn { 0% { opacity: 0; transform: scale(0.6) translateY(20px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
@keyframes splashShine { 0% { left: -60%; } 100% { left: 130%; } }
@keyframes splashFadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes splashDot { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-9px); opacity: 1; } }
@keyframes splashGridDrift { from { background-position: 0 0; } to { background-position: 28px 28px; } }
@keyframes splashOut {
  0%, 82% { opacity: 1; transform: scale(1); filter: blur(0px); }
  100% { opacity: 0; transform: scale(1.05); filter: blur(12px); visibility: hidden; }
}

/* ============================================
   ✨ PACOTE DE ANIMAÇÕES "APP PROFISSIONAL"
   ============================================ */
@keyframes sparkleFloat {
  0%, 100% { transform: translateY(0) scale(1) rotate(0deg); opacity: .35; }
  50% { transform: translateY(-10px) scale(1.3) rotate(18deg); opacity: 1; }
}
@keyframes ctaShine { 0%, 45% { left: -60%; } 100% { left: 140%; } }

/* Entrada escalonada de cards em listas — cada item aparece um pouquinho
   depois do anterior (efeito "cascata" que apps profissionais usam muito) */
@keyframes cardStagger {
  from { opacity: 0; transform: translateY(16px) scale(.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.stagger-item {
  animation: cardStagger 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
}

/* Ícone "pop" ao ativar uma aba */
@keyframes iconPop {
  0% { transform: scale(1); }
  40% { transform: scale(1.35) rotate(-8deg); }
  70% { transform: scale(0.92) rotate(4deg); }
  100% { transform: scale(1) rotate(0deg); }
}

/* Números que "sobem" contando (usado em contadores/estatísticas) */
@keyframes numberPop {
  0% { transform: scale(0.5); opacity: 0; }
  60% { transform: scale(1.15); opacity: 1; }
  100% { transform: scale(1); }
}

.anim-fade-in { animation: fadeIn 0.4s ease-out; }
.anim-fade-up { animation: fadeInUp 0.4s ease-out; }
.anim-scale-in { animation: scaleIn 0.3s ease-out; }

/* ===== UTILS ===== */

.text-center { text-align: center; }
.hidden { display: none; }
.mt-2 { margin-top: 8px; }
.mt-4 { margin-top: 16px; }
.mt-6 { margin-top: 24px; }
.mb-2 { margin-bottom: 8px; }
.mb-4 { margin-bottom: 16px; }

/* ===== RESPONSIVO ===== */
@media (max-width: 640px) {
  .container { padding: 0 16px; }
  .app-header-inner { padding: 0 16px; }
  .cover { padding: 40px 20px 50px; }
  .cover-shape-1 { width: 100px; height: 100px; top: 20px; right: -30px; }
  .cover-shape-2 { width: 130px; height: 130px; bottom: -40px; left: -30px; }
  .cover-cta { padding: 16px 28px; font-size: 16px; }

  .calendar { padding: 18px; }

  .lider-foto { width: 68px; height: 68px; border-radius: 16px; flex-shrink: 0; }
  
  .pill-group.cols-3 { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pill { padding: 12px 10px; font-size: 14px; }

  .stats-grid { grid-template-columns: 1fr 1fr; }
  
  .form-actions { flex-direction: column-reverse; }
  
  .calendar-day { font-size: 14px; }
  .day-numero { font-size: 14px; }
  .day-evento-icon { font-size: 12px; bottom: 2px; }
  .day-badge-ags { width: 14px; height: 14px; font-size: 12px; }

    gap: 10px; 
    padding: 12px;
  }
  .hc-time { 
    width: 100%; 
    font-size: 18px; 
    padding: 6px;
  }
  .hc-liderencias { gap: 6px; }
  .hc-lider { padding: 8px 10px; }
  .hc-avatar { font-size: 18px; }

/* ===== v10.7 — VISUAL CALMO (confiança e suavidade) ===== */
.cover-sparkle { display: none !important; }
.cover-cta, .loja-hero-badge, .oracao-brilho { animation: none !important; }
.cover-cta::before, .loja-hero-cta::before, .oracao-brilho::after, .aniv-badge-hoje::after { display: none !important; }
.cover-cta { box-shadow: var(--shadow-md) !important; }
.loja-hero-cta { box-shadow: none !important; }
.oracao-card { border: 1px solid var(--border-light) !important; background: var(--bg-2) !important; }
.oracao-card:hover { border-color: var(--border-medium) !important; transform: none !important; box-shadow: none !important; }
.oracao-brilho { border: 1.5px solid var(--border-medium) !important; box-shadow: none !important; }
.evento-card:hover { transform: none !important; }
.card-highlight { background: var(--bg-2) !important; border-color: var(--border-light) !important; }

/* ===== Pesquisa do retiro ===== */
.pesq-modal, .pesq-final { position: relative; overflow: hidden; }
.pesq-topo { display: flex; align-items: center; justify-content: space-between; margin: 0 40px 14px 0; }
.pesq-hero { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; font-size: 28px; background: rgba(253,106,2,.14); border: 1px solid rgba(253,106,2,.35); }
.pesq-final .pesq-hero { margin: 8px auto 14px; width: 72px; height: 72px; font-size: 38px; border-radius: 24px; }
.pesq-dots { display: flex; gap: 6px; }
.pesq-dots i { width: 22px; height: 6px; border-radius: 6px; background: var(--bg-3); }
.pesq-dots i.on { background: var(--primary); }
.pesq-dots i.ok { background: rgba(253,106,2,.45); }
.pesq-titulo { font-size: 22px; font-weight: 700; line-height: 1.2; margin: 0 0 6px; color: var(--text-primary); }
.pesq-sub { font-size: 14px; color: var(--text-secondary); margin: 0 0 16px; line-height: 1.5; }
.pesq-item { margin-bottom: 14px; }
.pesq-card { background: var(--bg-3); border: 1px solid var(--border-light); border-radius: 18px; padding: 14px; }
.pesq-linha { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.pesq-item-t { display: block; font-size: 16px; font-weight: 600; color: var(--text-primary); margin-bottom: 0; }
.pesq-item > label.pesq-item-t { margin-bottom: 8px; }
.pesq-rot { font-size: 14px; font-weight: 600; color: var(--primary); min-height: 1em; }
.pesq-opc { font-weight: 400; color: var(--text-tertiary); font-size: 14px; }
.pesq-obrig { color: var(--primary); }
.pesq-rostos { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.pesq-rosto { aspect-ratio: 1 / 1; border-radius: 14px; border: 1.5px solid var(--border-light); background: var(--bg-2); font-size: 22px; line-height: 1; cursor: pointer; padding: 0; filter: grayscale(.9); opacity: .7; transition: transform .15s ease, opacity .15s ease; }
.pesq-rosto.sel { filter: none; opacity: 1; border-color: var(--primary); background: rgba(253,106,2,.16); transform: scale(1.08); }
.pesq-opcoes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.pesq-op { padding: 12px 4px; border-radius: 14px; border: 1.5px solid var(--border-light); background: var(--bg-2); color: var(--text-secondary); font-size: 14px; font-weight: 600; cursor: pointer; }
.pesq-op.sel { border-color: var(--primary); background: rgba(253,106,2,.16); color: var(--text-primary); }
.pesq-nav { display: flex; gap: 8px; margin-top: 18px; }
.pesq-pular { display: block; margin: 12px auto 0; background: none; border: 0; color: var(--text-tertiary); font-size: 14px; cursor: pointer; text-decoration: underline; }
.pesq-rodape { text-align: center; font-size: 12px; color: var(--text-tertiary); margin-top: 14px; }
.pesq-versiculo { text-align: center; font-size: 14px; line-height: 1.6; font-style: italic; color: var(--text-secondary); background: var(--bg-3); border-radius: 14px; padding: 12px 14px; margin: 0; }
.pesq-versiculo span { font-style: normal; font-size: 12px; color: var(--text-tertiary); }
.pesq-conf { position: absolute; top: -20px; font-size: 22px; opacity: 0; animation: pesqConf 2.2s ease-out 1 forwards; pointer-events: none; }
.pesq-conf.c0 { left: 8%; } .pesq-conf.c1 { left: 24%; animation-delay: .15s; } .pesq-conf.c2 { left: 42%; animation-delay: .3s; }
.pesq-conf.c3 { left: 58%; animation-delay: .1s; } .pesq-conf.c4 { left: 74%; animation-delay: .35s; } .pesq-conf.c5 { left: 88%; animation-delay: .2s; }
@keyframes pesqConf { 0% { opacity: 0; transform: translateY(0); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(260px) rotate(30deg); } }
.pesq-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.pesq-kpis b { display: block; font-size: 28px; font-weight: 700; color: var(--text-primary); }
.pesq-kpis span { font-size: 12px; color: var(--text-tertiary); }
.pesq-barra { display: grid; grid-template-columns: 1fr 90px 32px; gap: 8px; align-items: center; margin-bottom: 8px; font-size: 14px; }
.pesq-barra .pb-n { color: var(--text-secondary); }
.pesq-barra .pb-t { height: 8px; border-radius: 8px; background: var(--bg-3); overflow: hidden; }
.pesq-barra .pb-t i { display: block; height: 100%; border-radius: 8px; }
.pesq-barra .pb-v { text-align: right; font-weight: 600; color: var(--text-primary); }
.pesq-resp { padding: 10px 0; border-top: 1px solid var(--border-light); font-size: 14px; line-height: 1.55; color: var(--text-secondary); }
.pesq-resp p { margin: 4px 0 0; word-break: break-word; }
.pesq-resp-q { font-size: 12px; color: var(--text-tertiary); }

.pesq-prog2 { flex: 1; min-width: 0; margin-left: 14px; }
.pesq-prog2-t { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-tertiary); margin-bottom: 6px; }
.pesq-prog2-t b { color: var(--primary); font-weight: 600; }
.pesq-barra-prog { height: 6px; border-radius: 6px; background: var(--bg-3); overflow: hidden; }
.pesq-barra-prog i { display: block; height: 100%; background: var(--primary); border-radius: 6px; transition: width .3s ease; }
.pesq-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.pesq-chip { padding: 9px 14px; border-radius: 999px; border: 1.5px solid var(--border-light); background: var(--bg-2); color: var(--text-secondary); font-size: 14px; font-weight: 600; cursor: pointer; }
.pesq-chip.sel { border-color: var(--primary); background: rgba(253,106,2,.16); color: var(--text-primary); }
.pesq-selo { display: block; width: fit-content; margin: 0 auto; padding: 8px 16px; border-radius: 999px; background: rgba(253,106,2,.16); border: 1px solid rgba(253,106,2,.5); color: var(--primary); font-size: 14px; font-weight: 700; }
.pesq-topo { margin-right: 40px; }
.pesq-intro { font-size: 14px; line-height: 1.6; color: var(--text-secondary); background: var(--bg-3); border-radius: 14px; padding: 12px 14px; margin: 0 0 14px; }

/* ===== alinhamento padronizado da pesquisa ===== */
.pesq-home { padding: 20px !important; }
.pesq-home-ico { width: 72px; height: 72px; flex-shrink: 0; display: grid; place-items: center; font-size: 34px; border-radius: 20px; background: rgba(253,106,2,.14); border: 1.5px solid rgba(253,106,2,.5); }
.pesq-modal .pesq-item { margin: 0 0 12px; }
.pesq-modal .pesq-card { display: block; width: 100%; box-sizing: border-box; background: var(--bg-3); border: 1px solid var(--border-light); border-radius: 18px; padding: 14px; margin: 0 0 12px; }
.pesq-modal .pesq-linha { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin: 0 0 10px; min-height: 22px; }
.pesq-modal .pesq-item-t { font-size: 16px; font-weight: 600; line-height: 1.3; color: var(--text-primary); margin: 0; }
.pesq-modal .pesq-lbl { display: block; margin: 0 0 10px; }
.pesq-modal .pesq-rot { flex-shrink: 0; font-size: 14px; font-weight: 600; line-height: 1.3; color: var(--primary); }
.pesq-modal .pesq-campo { width: 100%; box-sizing: border-box; background: var(--bg-2); border-radius: 14px; padding: 12px 14px; font-size: 16px; min-height: 0; }
.pesq-modal textarea.pesq-campo { min-height: 84px; resize: none; }
.pesq-modal .pesq-check { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; font-size: 14px; line-height: 1.4; color: var(--text-secondary); }
.pesq-modal .pesq-check input { width: 20px; height: 20px; flex-shrink: 0; margin: 1px 0 0; accent-color: var(--primary); }
.pesq-modal .pesq-rostos, .pesq-modal .pesq-opcoes { width: 100%; }
.pesq-modal .pesq-intro { margin: 0 0 12px; }
.pesq-modal .pesq-titulo { margin: 0 0 4px; }
.pesq-modal .pesq-sub { margin: 0 0 14px; }
.pesq-modal .pesq-topo { display: flex; align-items: center; gap: 14px; margin: 0 40px 16px 0; }
.pesq-modal .pesq-prog2 { margin: 0; }
.pesq-modal .pesq-nav { margin-top: 6px; }

/* ===== v10.11 — TEMA CLARO: off white + laranja fluorescente + preto ===== */
